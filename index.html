<script>/* util.js */
'use strict';
// 공용 수학/그리기 유틸리티

const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const dist = (ax, ay, bx, by) => Math.sqrt(dist2(ax, ay, bx, by));
const angleTo = (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax);
const angleDiff = (a, b) => {
  let d = (b - a) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return d;
};
// 0=E 1=SE 2=S 3=SW 4=W 5=NW 6=N 7=NE (캔버스 y축 아래 방향)
const dir8 = (a) => ((Math.round(a / (Math.PI / 4)) % 8) + 8) % 8;

function weightedPick(list, weightFn) {
  let total = 0;
  const ws = list.map((it) => { const w = Math.max(0, weightFn(it)); total += w; return w; });
  if (total <= 0) return list[0];
  let r = Math.random() * total;
  for (let i = 0; i < list.length; i++) { r -= ws[i]; if (r <= 0) return list[i]; }
  return list[list.length - 1];
}

const Ease = {
  outCubic: (t) => 1 - Math.pow(1 - t, 3),
  outQuad: (t) => 1 - (1 - t) * (1 - t),
  inQuad: (t) => t * t,
  outBack: (t, s = 1.4) => { const c3 = s + 1; return 1 + c3 * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); },
};

function roundRect(ctx, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function fmtTime(s) {
  s = Math.floor(s);
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

const FONT_FAMILY = '"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif';
const font = (size, weight = 'bold') => `${weight} ${size}px ${FONT_FAMILY}`;

function textOutlined(ctx, str, x, y, fill, stroke = '#140c1e', lw = 5) {
  ctx.lineJoin = 'round';
  ctx.lineWidth = lw;
  ctx.strokeStyle = stroke;
  ctx.strokeText(str, x, y);
  ctx.fillStyle = fill;
  ctx.fillText(str, x, y);
}

</script>

    out.push({
      id: 'add', sym: id, tag: '추가', name: SYMBOLS[id].name, weight: () => 12,
      desc: () => '릴 덱에 추가' + (rc ? `\n합성 가능!\n→ ${SYMBOLS[rc.out].name}` : ''),
      apply: (g) => g.preel.addSymbol(id),
    });
  }
  if (R.deck.length > D.min) {
    // 레시피 재료·회복 수단(물약·힐러)이 아닌 심볼을 먼저 빼도록 가중
    const id = weightedPick(R.deck, (s) => (s === 'potion' || s === 'healer' ? 0.3 : RECIPES.some((r) => r.a === s || r.b === s) ? 1 : 3));
    out.push({
      id: 'remove', sym: id, tag: '제거', name: SYMBOLS[id].name, weight: () => 8,
      desc: () => '릴 덱에서 제거\n덱이 좁을수록\n합체·합성 확률 ↑',
      apply: (g) => g.preel.removeSymbol(id),
    });
  }
  const boostable = R.deck.filter((s) => (R.boost[s] || 0) < D.boostMax);
  if (boostable.length) {
    const id = pick(boostable);
    out.push({
      id: 'boost', sym: id, tag: '강화', name: SYMBOLS[id].name, weight: () => 9,
      desc: () => `획득 Lv +1 (현재 +${R.boost[id] || 0})\n등장 확률 ↑`,
      apply: (g) => g.preel.boostSymbol(id),
    });
  }
  out.push({
    id: 'gold', glyph: 'coin', tag: '황금', name: '황금 와일드', weight: () => 6,
    desc: () => '다음 합체 2회 확정\n(왼쪽 칸과 같은 심볼)',
    apply: (g) => { g.preel.gold += 2; },
  });
  return out;
}

<script>/* sfx.js */
'use strict';
// WebAudio 합성 효과음 (리소스 없이 즉석 생성)

const SFX = {
  ctx: null, master: null, nbuf: null, _last: {},

  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.32;
      this.master.connect(this.ctx.destination);
    } catch (e) { this.ctx = null; }
  },

  can(key, gap) {
    const now = performance.now();
    if ((this._last[key] || 0) + gap * 1000 > now) return false;
    this._last[key] = now;
    return true;
  },

  tone(f, dur, type = 'square', vol = 0.3, f2 = null, delay = 0) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },

  noise(dur, vol = 0.3, freq = 1200, delay = 0) {
    const c = this.ctx; if (!c) return;
    if (!this.nbuf) {
      const len = c.sampleRate;
      this.nbuf = c.createBuffer(1, len, c.sampleRate);
      const d = this.nbuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    const t = c.currentTime + delay;
    const s = c.createBufferSource(); s.buffer = this.nbuf;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t); s.stop(t + dur + 0.02);
  },

  slash() { if (!this.can('slash', 0.04)) return; this.noise(0.12, 0.22, 2600); this.tone(900, 0.08, 'triangle', 0.07, 380); },
  hit() { if (!this.can('hit', 0.03)) return; this.noise(0.08, 0.28, 700); this.tone(180, 0.08, 'square', 0.1, 80); },
  kill() { if (!this.can('kill', 0.05)) return; this.tone(520, 0.1, 'square', 0.08, 900); },
  parry() { this.tone(1800, 0.4, 'triangle', 0.32, 1200); this.tone(2600, 0.3, 'sine', 0.22, 2100); this.noise(0.18, 0.4, 4200); },
  parryWhiff() { this.tone(640, 0.07, 'sine', 0.08, 520); },
  hurt() { if (!this.can('hurt', 0.1)) return; this.tone(210, 0.18, 'sawtooth', 0.16, 90); },
  dash() { if (!this.can('dash', 0.08)) return; this.noise(0.2, 0.16, 1500); },
  tick() { if (!this.can('tick', 0.045)) return; this.tone(1300, 0.025, 'square', 0.04); },
  reelStop() { this.tone(320, 0.08, 'square', 0.14, 200); this.noise(0.05, 0.18, 3000); },
  spinStart() { for (let i = 0; i < 4; i++) this.tone(600 + i * 200, 0.08, 'square', 0.1, null, i * 0.05); },
  jackpot() { [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.25, 'square', 0.12, null, i * 0.08)); },
  levelup() { [392, 523, 659, 784].forEach((f, i) => this.tone(f, 0.18, 'triangle', 0.18, null, i * 0.07)); },
  explode() { if (!this.can('boom', 0.05)) return; this.noise(0.5, 0.45, 300); this.tone(90, 0.4, 'sawtooth', 0.18, 40); },
  zap() { if (!this.can('zap', 0.06)) return; this.noise(0.1, 0.18, 5000); this.tone(1400, 0.1, 'sawtooth', 0.05, 300); },
  heal() { this.tone(660, 0.2, 'sine', 0.2, 990); this.tone(880, 0.25, 'sine', 0.15, 1320, 0.08); },
  summon() { this.tone(330, 0.3, 'triangle', 0.18, 660); this.tone(495, 0.35, 'triangle', 0.14, 990, 0.1); },
  click() { this.tone(800, 0.05, 'square', 0.08); },
  coin() { if (!this.can('coin', 0.05)) return; this.tone(1320, 0.08, 'square', 0.1); this.tone(1760, 0.18, 'square', 0.1, null, 0.07); },
  merge() { [660, 880, 1175, 1568].forEach((f, i) => this.tone(f, 0.16, 'square', 0.12, null, i * 0.05)); },
  curse() { if (!this.can('curse', 0.2)) return; this.tone(220, 0.5, 'sawtooth', 0.14, 110); this.tone(233, 0.5, 'sawtooth', 0.1, 116); },
  miss() { if (!this.can('miss', 0.1)) return; this.tone(300, 0.15, 'triangle', 0.1, 180); },
  charged() { this.tone(880, 0.12, 'square', 0.12, 1760); this.tone(1320, 0.2, 'triangle', 0.1, 2640, 0.06); },
  freeze() { this.noise(0.4, 0.3, 6000); this.tone(2000, 0.3, 'sine', 0.12, 3000); },
};

<script>/* art.js */
'use strict';
// 절차적 2D 그래픽 (리소스 없이 캔버스 도형으로 캐릭터/아이콘/지형 생성)

const OL = '#17111f'; // 외곽선 색

const PAL_PLAYER = { skin: '#ffd9b8', hair: '#2c3263', body: '#3b78d8', body2: '#2c5db0', belt: '#5a3b22', pants: '#2b2b3d', boots: '#5a3a24', scarf: '#3ff0d8' };
const PAL_WHITE = { skin: '#fff', hair: '#fff', body: '#fff', body2: '#fff', belt: '#fff', pants: '#fff', boots: '#fff', scarf: '#fff', hat: '#fff' };
const PAL_HERO = {
  knight: { skin: '#ffd9b8', hair: '#8a5a2a', body: '#a9b4c6', body2: '#8592a8', belt: '#5a4632', pants: '#3a4050', boots: '#4a4a58', hat: '#c3ccda' },
  archer: { skin: '#ffd9b8', hair: '#6a3a1a', body: '#3f8a4a', body2: '#2f6e3a', belt: '#6a4a2a', pants: '#3a3426', boots: '#5a3a24', hat: '#2f6e3a' },
  mage:   { skin: '#ffd9b8', hair: '#d8d8e8', body: '#6b48b8', body2: '#55389a', belt: '#e8b84a', pants: '#3a2a5a', boots: '#3a2a4a', hat: '#4b2f8f' },
  healer: { skin: '#ffd9b8', hair: '#f0d070', body: '#f4f1ff', body2: '#d6d0f0', belt: '#4fc77a', pants: '#bfb8dc', boots: '#8a7a5a', hat: '#ffffff' },
  // 합성 영웅
  paladin:     { skin: '#ffd9b8', hair: '#d8a040', body: '#f2d27a', body2: '#d8ae4a', belt: '#7a4a2a', pants: '#4a3a5a', boots: '#5a4632', hat: '#ffe08a' },
  stormArcher: { skin: '#ffd9b8', hair: '#2a3a6a', body: '#3a6ad8', body2: '#2a4ea8', belt: '#ffd24a', pants: '#2a2a46', boots: '#3a3a5a', hat: '#2a4ea8' },
};

const ART = {
  icons: {},
  tile: null,

  init() { this.tile = makeGroundTile(); },

  circle(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, TAU); },
  ell(ctx, x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, TAU); },
  fs(ctx, fill, lw = 3, stroke = OL) {
    ctx.fillStyle = fill; ctx.fill();
    if (lw > 0) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
  },
  shadow(ctx, x, y, rx, ry, a = 0.28) {
    ctx.fillStyle = `rgba(0,0,0,${a})`;
    this.ell(ctx, x, y, rx, ry); ctx.fill();
  },
};

// ---------------------------------------------------------------- 지형
function makeGroundTile() {
  const S = 512;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const x = c.getContext('2d');
  x.fillStyle = '#4d8a3c'; x.fillRect(0, 0, S, S);
  const wrap = (fn) => { for (const ox of [-S, 0, S]) for (const oy of [-S, 0, S]) { x.save(); x.translate(ox, oy); fn(); x.restore(); } };
  for (let i = 0; i < 16; i++) {
    const px = Math.random() * S, py = Math.random() * S, r = rand(50, 140), light = Math.random() < 0.5;
    wrap(() => {
      const g = x.createRadialGradient(px, py, 0, px, py, r);
      g.addColorStop(0, light ? 'rgba(130,190,85,0.35)' : 'rgba(25,65,30,0.3)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      x.fillStyle = g; x.fillRect(px - r, py - r, r * 2, r * 2);
    });
  }
  const cols = ['#5fa147', '#3f7a32', '#6db352', '#457f36', '#78c25a'];
  x.lineWidth = 2; x.lineCap = 'round';
  for (let i = 0; i < 1100; i++) {
    const px = Math.random() * S, py = Math.random() * S, h = rand(4, 9);
    x.strokeStyle = pick(cols);
    x.beginPath(); x.moveTo(px, py); x.lineTo(px + rand(-2.5, 2.5), py - h); x.stroke();
  }
  for (let i = 0; i < 36; i++) {
    const px = rand(10, S - 10), py = rand(10, S - 10), r = rand(2, 5);
    x.fillStyle = 'rgba(0,0,0,0.18)'; x.beginPath(); x.ellipse(px + 1, py + 1.5, r, r * 0.7, 0, 0, TAU); x.fill();
    x.fillStyle = '#9a9c88'; x.beginPath(); x.ellipse(px, py, r, r * 0.7, 0, 0, TAU); x.fill();
    x.fillStyle = '#c4c6b2'; x.beginPath(); x.ellipse(px - r * 0.3, py - r * 0.25, r * 0.4, r * 0.25, 0, 0, TAU); x.fill();
  }
  return c;
}

ART.drawDecal = function (ctx, d) {
  if (d.kind === 'flower') {
    ctx.fillStyle = d.color;
    for (let i = 0; i < 5; i++) { const a = i / 5 * TAU; this.circle(ctx, d.x + Math.cos(a) * 3, d.y + Math.sin(a) * 2.4, 2.4); ctx.fill(); }
    ctx.fillStyle = '#ffe35a'; this.circle(ctx, d.x, d.y, 1.8); ctx.fill();
  } else if (d.kind === 'tuft') {
    ctx.strokeStyle = '#3a7030'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(d.x + i * 3, d.y); ctx.lineTo(d.x + i * 5, d.y - 10 + Math.abs(i) * 2); ctx.stroke(); }
  }
};

// 필드 오브젝트 (모두 캐릭터 허리 높이 이하)
ART.drawProp = function (ctx, p) {
  if (p.kind === 'stump') {
    const x = p.x, y = p.y;
    this.shadow(ctx, x + 3, y + 2, 24, 8, 0.3);
    ctx.beginPath(); ctx.moveTo(x - 17, y - 20); ctx.lineTo(x - 18, y - 2); ctx.quadraticCurveTo(x, y + 6, x + 18, y - 2); ctx.lineTo(x + 17, y - 20); ctx.closePath();
    this.fs(ctx, '#6b4426');
    ctx.strokeStyle = '#4e2f18'; ctx.lineWidth = 2;
    for (const dx of [-9, 0, 9]) { ctx.beginPath(); ctx.moveTo(x + dx, y - 16); ctx.lineTo(x + dx + 1, y); ctx.stroke(); }
    this.ell(ctx, x, y - 20, 17, 7); this.fs(ctx, '#d9b07a');
    ctx.strokeStyle = '#a77b48'; ctx.lineWidth = 1.5;
    this.ell(ctx, x, y - 20, 10, 4); ctx.stroke(); this.ell(ctx, x, y - 20, 4, 1.6); ctx.stroke();
    ctx.fillStyle = '#4f8f3a'; this.ell(ctx, x - 14, y - 2, 6, 3); ctx.fill();
  } else if (p.kind === 'rock') {
    this.shadow(ctx, p.x + 3, p.y + 2, p.r * 1.15, p.r * 0.45, 0.3);
    ctx.beginPath();
    p.pts.forEach((q, i) => { const px = p.x + q[0], py = p.y + q[1]; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
    ctx.closePath(); this.fs(ctx, '#8b8f9b');
    ctx.fillStyle = '#b6bac6';
    this.ell(ctx, p.x - p.r * 0.25, p.y - p.r * 0.85, p.r * 0.45, p.r * 0.22); ctx.fill();
  } else if (p.kind === 'bush') {
    const x = p.x, y = p.y;
    this.shadow(ctx, x, y + 1, 24, 8, 0.25);
    const bl = [[-12, -8, 11], [12, -8, 11], [0, -13, 12]];
    ctx.fillStyle = OL; for (const b of bl) { this.circle(ctx, x + b[0], y + b[1], b[2] + 2.5); ctx.fill(); }
    for (const b of bl) { ctx.fillStyle = '#3f8f3a'; this.circle(ctx, x + b[0], y + b[1], b[2]); ctx.fill(); }
    ctx.fillStyle = '#5fb352'; this.circle(ctx, x - 4, y - 18, 5); ctx.fill();
    if (p.berry) { ctx.fillStyle = '#e8384f'; for (const b of [[-9, -9], [8, -12], [2, -5]]) { this.circle(ctx, x + b[0], y + b[1], 2.6); ctx.fill(); } }
  }
};

// 월드 바깥 (흙 절벽)
ART.drawOutside = function (ctx, w, x0, y0, x1, y1) {
  ctx.fillStyle = '#2b2219'; ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  for (let x = Math.floor(x0 / 64) * 64; x < x1; x += 64) {
    for (let y = Math.floor(y0 / 64) * 64; y < y1; y += 64) {
      if (x > -64 && x < w.w && y > -64 && y < w.h) continue;
      const h = ((x * 73856093) ^ (y * 19349663)) & 7;
      this.ell(ctx, x + 20 + h * 3, y + 30, 10 + h, 5); ctx.fill();
    }
  }
};

// 필드 경계 돌담 (허리 높이). 'back' = 위쪽·좌우, 'front' = 아래쪽 (캐릭터 앞에 그림)
ART.drawWalls = function (ctx, w, x0, y0, x1, y1, layer) {
  const S = 36;
  const stone = (x, y, bw, i) => {
    const tone = ['#9e978a', '#a8a194', '#938c80'][i % 3];
    roundRect(ctx, x + 1, y - 22, bw - 2, 12, 3); ctx.fillStyle = '#c4beb0'; ctx.fill();
    roundRect(ctx, x + 1, y - 11, bw - 2, 13, 3); ctx.fillStyle = tone; ctx.fill();
    ctx.strokeStyle = OL; ctx.lineWidth = 2; roundRect(ctx, x + 1, y - 22, bw - 2, 24, 4); ctx.stroke();
  };
  ctx.save();
  if (layer === 'back') {
    // 위쪽 벽
    if (y0 < 20) for (let x = Math.max(-S, Math.floor(x0 / S) * S); x < Math.min(w.w + S, x1); x += S) stone(x, 2, S, Math.abs(x / S) | 0);
    // 좌우 벽 (위에서 내려다본 돌 블록)
    for (const side of [0, 1]) {
      const wx = side ? w.w : -24;
      if (wx + 24 < x0 || wx > x1) continue;
      for (let y = Math.max(0, Math.floor(y0 / S) * S); y < Math.min(w.h, y1); y += S) {
        roundRect(ctx, wx + 1, y + 1, 22, S - 2, 4);
        ctx.fillStyle = ((y / S) | 0) % 2 ? '#a8a194' : '#b4ae9f'; ctx.fill();
        ctx.strokeStyle = OL; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(side ? wx + 1 : wx + 17, y + 3, 5, S - 6);
      }
    }
  } else if (y1 > w.h - 10) {
    for (let x = Math.max(-S, Math.floor(x0 / S) * S); x < Math.min(w.w + S, x1); x += S) stone(x, w.h + 8, S, Math.abs(x / S) | 0);
  }
  ctx.restore();
};

// ---------------------------------------------------------------- 휴머노이드(플레이어/영웅)
function facingInfo(angle) {
  const d = dir8(angle);
  const flip = d === 3 || d === 4 || d === 5;
  const m = flip ? { 3: 1, 4: 0, 5: 7 }[d] : d;
  const view = { 2: 'front', 1: 'fs', 0: 'side', 7: 'bs', 6: 'back' }[m];
  return { d, flip, view, back: view === 'bs' || view === 'back' };
}

ART.humanoid = function (ctx, o) {
  const fi = facingInfo(o.facing);
  const P = o.white ? PAL_WHITE : o.pal;
  const by = -(o.bob || 0), st = o.step || 0, s = o.s || 1;
  const sideAmt = fi.view === 'side' ? 1 : (fi.view === 'fs' || fi.view === 'bs') ? 0.5 : 0;
  ctx.save();
  ctx.translate(o.x, o.y);
  ctx.scale(fi.flip ? -s : s, s);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // 다리
  for (const k of [-1, 1]) {
    const lift = Math.max(0, st * k) * 4;
    const lx = k * 6 * (1 - sideAmt * 0.5) + sideAmt * st * k * 5;
    roundRect(ctx, lx - 4.5, -18 + by * 0.4, 9, 15 - lift, 4); this.fs(ctx, P.pants, 2.5);
    this.ell(ctx, lx + sideAmt * 2, -4 - lift, 6, 4); this.fs(ctx, P.boots, 2.5);
  }
  if (o.behind) o.behind(ctx, fi, by);
  // 몸통
  roundRect(ctx, -13, -42 + by, 26, 27, 9); this.fs(ctx, P.body);
  ctx.fillStyle = P.body2; roundRect(ctx, -11.5, -26 + by, 23, 9, 4); ctx.fill();
  ctx.fillStyle = P.belt; ctx.fillRect(-12, -23 + by, 24, 4);
  // 스카프
  if (P.scarf) {
    const w = Math.sin((o.t || 0) * 10);
    ctx.beginPath();
    ctx.moveTo(-8, -41 + by);
    ctx.quadraticCurveTo(-22, -38 + by + w * 3, -29, -31 + by + w * 4);
    ctx.lineTo(-24, -27 + by + w * 2);
    ctx.quadraticCurveTo(-16, -34 + by, -6, -37 + by);
    ctx.closePath(); this.fs(ctx, P.scarf, 2.5);
    roundRect(ctx, -12, -45 + by, 24, 7, 3.5); this.fs(ctx, P.scarf, 2.5);
  }
  // 머리
  const hy = -60 + by;
  this.circle(ctx, 0, hy, 17); this.fs(ctx, P.skin);
  this.headwear(ctx, o.hat, fi, hy, P);
  if (!fi.back) {
    const ex = fi.view === 'front' ? [-6.5, 6.5] : fi.view === 'fs' ? [-0.5, 9] : [10];
    for (const x of ex) {
      this.ell(ctx, x, hy + 3, 2.6, 3.8); ctx.fillStyle = o.white ? '#fff' : '#1b1530'; ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillRect(x - 1.4, hy + 0.6, 1.7, 1.7);
    }
  }
  if (o.front) o.front(ctx, fi, by);
  ctx.restore();
  return fi;
};

ART.headwear = function (ctx, hat, fi, hy, P) {
  const off = fi.view === 'front' ? 0 : fi.view === 'fs' ? 4 : 8;
  if (hat === 'hair') {
    if (fi.back) {
      this.circle(ctx, 0, hy - 1, 18.5); this.fs(ctx, P.hair);
    } else {
      ctx.beginPath();
      ctx.arc(0, hy - 1, 18.5, Math.PI * 0.95, Math.PI * 2.05);
      ctx.lineTo(16, hy - 1); ctx.lineTo(10 + off * 0.3, hy - 7); ctx.lineTo(6 + off * 0.5, hy - 1);
      ctx.lineTo(off * 0.5, hy - 8); ctx.lineTo(-6 + off * 0.5, hy - 1); ctx.lineTo(-11, hy - 6); ctx.lineTo(-17.5, hy + 1);
      ctx.closePath(); this.fs(ctx, P.hair);
      if (off > 0) { ctx.beginPath(); ctx.arc(-3, hy, 17.5, Math.PI * 0.55, Math.PI * 1.25); ctx.closePath(); this.fs(ctx, P.hair); }
    }
    ctx.beginPath();
    ctx.moveTo(-11, hy - 14); ctx.lineTo(-5, hy - 28); ctx.lineTo(1, hy - 17);
    ctx.lineTo(4, hy - 18); ctx.lineTo(13, hy - 27); ctx.lineTo(14, hy - 12);
    ctx.closePath(); this.fs(ctx, P.hair, 2.5);
  } else if (hat === 'helmet') {
    ctx.beginPath(); ctx.arc(0, hy - 1, 19.5, Math.PI, 0); ctx.lineTo(19.5, hy + 3); ctx.lineTo(-19.5, hy + 3); ctx.closePath();
    this.fs(ctx, P.hat);
    if (!fi.back) { ctx.fillStyle = '#2a2f3d'; ctx.fillRect(-12 + off, hy - 3, 24, 4); }
    ctx.beginPath(); ctx.moveTo(0, hy - 19); ctx.quadraticCurveTo(-18, hy - 36, -27, hy - 16); ctx.quadraticCurveTo(-12, hy - 25, 0, hy - 14); ctx.closePath();
    this.fs(ctx, '#e0463e', 2.5);
  } else if (hat === 'hood') {
    ctx.beginPath(); ctx.moveTo(-14, hy - 10); ctx.lineTo(-27, hy + 8); ctx.lineTo(-10, hy + 10); ctx.closePath(); this.fs(ctx, P.hat, 2.5);
    this.circle(ctx, 0, hy - 1, 20); this.fs(ctx, P.hat);
    if (!fi.back) { this.ell(ctx, off * 0.6, hy + 3, 12.5, 11.5); this.fs(ctx, P.skin, 2); }
  } else if (hat === 'wizard') {
    if (!fi.back) { ctx.fillStyle = P.hair; this.ell(ctx, off * 0.4, hy + 14, 9, 8); ctx.fill(); }
    this.ell(ctx, 0, hy - 10, 27, 7); this.fs(ctx, P.hat);
    ctx.beginPath(); ctx.moveTo(-15, hy - 12); ctx.quadraticCurveTo(-8, hy - 34, -22, hy - 54); ctx.quadraticCurveTo(4, hy - 38, 15, hy - 12); ctx.closePath();
    this.fs(ctx, P.hat);
    ctx.fillStyle = '#ffd24a'; ctx.fillRect(-14, hy - 18, 28, 5);
  }
};

// 릴블레이드 (손잡이 위 회전하는 릴 가드가 특징)
ART.reelBlade = function (ctx, hx, hy, ang, len, glow, t) {
  ctx.save(); ctx.translate(hx, hy); ctx.rotate(ang); ctx.lineJoin = 'round';
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.35;
  ctx.strokeStyle = glow; ctx.lineWidth = 11; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(len, 0); ctx.stroke(); ctx.restore();
  roundRect(ctx, -12, -3, 14, 6, 3); this.fs(ctx, '#5b3a24', 2);
  ctx.beginPath(); ctx.moveTo(8, -6); ctx.lineTo(len - 12, -5); ctx.lineTo(len, 0); ctx.lineTo(len - 12, 5); ctx.lineTo(8, 6); ctx.closePath();
  const gr = ctx.createLinearGradient(0, -6, 0, 6);
  gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.5, '#c4d0e2'); gr.addColorStop(1, '#7f8ca6');
  this.fs(ctx, gr, 2);
  ctx.strokeStyle = glow; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(12, -2); ctx.lineTo(len - 10, -1.5); ctx.stroke();
  this.circle(ctx, 6, 0, 8.5); this.fs(ctx, '#e3b341', 2);
  ctx.save(); ctx.translate(6, 0); ctx.rotate(t * 6);
  ctx.strokeStyle = '#7a5410'; ctx.lineWidth = 1.5;
  for (let i = 0; i < 6; i++) { ctx.rotate(TAU / 6); ctx.beginPath(); ctx.moveTo(3, 0); ctx.lineTo(7.5, 0); ctx.stroke(); }
  ctx.restore();
  this.circle(ctx, 6, 0, 3); ctx.fillStyle = glow; ctx.fill();
  ctx.restore();
};

ART.playerBladePose = function (p, fi, bob) {
  const sgn = fi.flip ? -1 : 1;
  let hx = p.x + sgn * (fi.back ? 10 : 13), hy = p.y - 28 - bob;
  let ang, len = 56;
  if (p.parryPose > 0) {
    ang = -Math.PI / 2 + sgn * 0.35;
    hx = p.x + Math.cos(p.facing) * 14; hy = p.y - 30 - bob;
  } else if (p.swing) {
    const k = clamp(p.swing.t / p.swing.dur, 0, 1);
    if (p.swing.kind === 'thrust') {
      ang = p.facing; len = 56 * (1 + 0.4 * Math.sin(k * Math.PI));
      hx += Math.cos(p.facing) * 10 * Math.sin(k * Math.PI); hy += Math.sin(p.facing) * 6 * Math.sin(k * Math.PI);
    } else {
      ang = p.facing + p.swing.side * (-1.5 + 3.0 * Ease.outCubic(k));
    }
  } else if (p.state === 'dash') {
    ang = p.facing + Math.PI - sgn * 0.5;
  } else if (p.state === 'attack') {
    ang = p.facing + sgn * 0.6;
  } else {
    ang = fi.flip ? Math.PI - 0.85 : 0.85;
  }
  return { hx, hy, ang, len };
};

ART.drawPlayer = function (ctx, p, g) {
  const t = g.time;
  const bob = p.isMoving ? Math.abs(Math.sin(p.walkT * 13)) * 2.5 : Math.sin(t * 3) * 1;
  const step = p.isMoving ? Math.sin(p.walkT * 13) : 0;
  const fi = facingInfo(p.facing);
  ctx.save();
  // 발 위치 기준으로 캐릭터 확대
  const S = BAL.charScale;
  ctx.translate(p.x, p.y); ctx.scale(S, S); ctx.translate(-p.x, -p.y);
  if (p.dead) ctx.globalAlpha = Math.max(0, g.deathT / 1.4);
  else if (p.invuln > 0 && Math.floor(t * 30) % 2 === 0) ctx.globalAlpha = 0.55;
  this.shadow(ctx, p.x, p.y + 1, 22, 8);
  if (p.rage > 0) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const r = 54 + Math.sin(t * 14) * 4;
    const gr = ctx.createRadialGradient(p.x, p.y - 32, 4, p.x, p.y - 32, r);
    gr.addColorStop(0, 'rgba(255,150,40,0.45)'); gr.addColorStop(1, 'rgba(255,60,0,0)');
    ctx.fillStyle = gr; this.circle(ctx, p.x, p.y - 32, r); ctx.fill(); ctx.restore();
  }
  const charged = g.gauge >= BAL.gauge.max;
  const glow = charged ? '#ffd84a' : p.rage > 0 ? '#ffb347' : '#5ff0ff';
  const bp = this.playerBladePose(p, fi, bob);
  if (Object.keys(p.curses).length && !p.dead) {
    // 저주 기운
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 4; i++) {
      const a = t * 2 + i * TAU / 4, k = (t * 0.8 + i * 0.25) % 1;
      ctx.fillStyle = `rgba(170,70,255,${0.5 * (1 - k)})`;
      this.circle(ctx, p.x + Math.cos(a) * 18, p.y - 10 - k * 60, 5 * (1 - k) + 2); ctx.fill();
    }
    ctx.restore();
  }
  if (fi.back) this.reelBlade(ctx, bp.hx, bp.hy, bp.ang, bp.len, glow, t);
  this.humanoid(ctx, { x: p.x, y: p.y, facing: p.facing, bob, step, pal: PAL_PLAYER, white: p.hurtFlash > 0, hat: 'hair', t });
  if (!fi.back) this.reelBlade(ctx, bp.hx, bp.hy, bp.ang, bp.len, glow, t);
  if (charged) {
    const tx = bp.hx + Math.cos(bp.ang) * bp.len, ty = bp.hy + Math.sin(bp.ang) * bp.len;
    this.sparkle(ctx, tx, ty, 7 + 3 * Math.sin(t * 12), t * 3, 0.9);
  }
  if (p.parryPose > 0) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = clamp(p.parryPose / 0.25, 0, 1);
    ctx.strokeStyle = '#ffe9a0'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(p.x, p.y - 30, 42, p.facing - 1.1, p.facing + 1.1); ctx.stroke();
    ctx.restore();
  }
  if (p.shield > 0) {
    ctx.fillStyle = 'rgba(120,200,255,0.14)'; this.circle(ctx, p.x, p.y - 32, 44); ctx.fill();
    ctx.strokeStyle = 'rgba(170,225,255,0.75)'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(p.x, p.y - 32, 36, -2.6, -1.9); ctx.stroke();
  }
  ctx.restore();
  // 회전 칼날
  const ob = p.abilities.orbit;
  if (ob) {
    const n = 2 + ob.lvl;
    for (let i = 0; i < n; i++) {
      const a = p.orbitAng + i * TAU / n;
      const bx = p.x + Math.cos(a) * 88, by2 = p.y + Math.sin(a) * 88 - 26;
      ctx.save(); ctx.translate(bx, by2); ctx.rotate(a + t * 18);
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(120,220,255,0.35)'; this.circle(ctx, 0, 0, 16); ctx.fill(); ctx.restore();
      ctx.beginPath(); ctx.moveTo(-14, 0); ctx.quadraticCurveTo(0, -12, 14, 0); ctx.quadraticCurveTo(0, -4, -14, 0); ctx.closePath();
      this.fs(ctx, '#dff3ff', 2);
      ctx.rotate(Math.PI);
      ctx.beginPath(); ctx.moveTo(-14, 0); ctx.quadraticCurveTo(0, -12, 14, 0); ctx.quadraticCurveTo(0, -4, -14, 0); ctx.closePath();
      this.fs(ctx, '#dff3ff', 2);
      ctx.restore();
    }
  }
  // 블레이드 스톰
  if (p.storm > 0) {
    ctx.save(); ctx.translate(p.x, p.y - 26);
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(140,230,255,0.5)'; ctx.lineWidth = 10;
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(0, 0, 70 + i * 22, t * 14 + i * 2, t * 14 + i * 2 + 2.2); ctx.stroke(); }
    ctx.restore();
    for (let i = 0; i < 4; i++) {
      const a = t * 14 + i * TAU / 4;
      this.reelBlade(ctx, p.x + Math.cos(a) * 30, p.y - 26 + Math.sin(a) * 30, a, 70, '#8ff6ff', t);
    }
  }
};

// ---------------------------------------------------------------- 적
ART.sparkle = function (ctx, x, y, size, rot, alpha = 1) {
  ctx.save(); ctx.translate(x, y); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = alpha;
  const gr = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 1.7);
  gr.addColorStop(0, 'rgba(255,250,210,0.95)'); gr.addColorStop(0.4, 'rgba(255,210,90,0.45)'); gr.addColorStop(1, 'rgba(255,160,40,0)');
  ctx.fillStyle = gr; this.circle(ctx, 0, 0, size * 1.7); ctx.fill();
  ctx.rotate(rot);
  ctx.fillStyle = '#ffffff';
  for (const sc of [1, 0.55]) {
    ctx.beginPath();
    const s = size * sc, w = s * 0.16;
    ctx.moveTo(0, -s); ctx.lineTo(w, -w); ctx.lineTo(s, 0); ctx.lineTo(w, w); ctx.lineTo(0, s); ctx.lineTo(-w, w); ctx.lineTo(-s, 0); ctx.lineTo(-w, -w);
    ctx.closePath(); ctx.fill();
    ctx.rotate(Math.PI / 4);
  }
  ctx.restore();
};

// 특수 공격 범위 표시 (지면)
ART.dangerZone = function (ctx, e) {
  const sp = e.def.special;
  const k = clamp(1 - e.t / sp.wind, 0, 1);
  const hot = e.t <= SPARKLE_TIME;
  ctx.save();
  if (sp.kind === 'lunge') {
    const L = e.spRange + e.r + 10, w = (e.r + 10) * 2;
    ctx.translate(e.x, e.y); ctx.rotate(e.aim);
    ctx.fillStyle = `rgba(255,40,50,${0.1 + 0.15 * k})`;
    roundRect(ctx, -e.r, -w / 2, L + e.r, w, w / 2); ctx.fill();
    ctx.fillStyle = hot ? 'rgba(255,230,120,0.45)' : 'rgba(255,60,60,0.35)';
    roundRect(ctx, -e.r, -w / 2, (L + e.r) * k, w, w / 2); ctx.fill();
    ctx.strokeStyle = hot ? 'rgba(255,240,170,0.9)' : 'rgba(255,90,90,0.7)'; ctx.lineWidth = 2;
    roundRect(ctx, -e.r, -w / 2, L + e.r, w, w / 2); ctx.stroke();
  } else {
    const R = e.spRange + e.r;
    ctx.translate(e.x, e.y);
    ctx.fillStyle = `rgba(255,40,50,${0.08 + 0.14 * k})`;
    this.ell(ctx, 0, 0, R, R); ctx.fill();
    ctx.fillStyle = hot ? 'rgba(255,230,120,0.4)' : 'rgba(255,60,60,0.3)';
    this.ell(ctx, 0, 0, R * k, R * k); ctx.fill();
    ctx.strokeStyle = hot ? 'rgba(255,240,170,0.9)' : 'rgba(255,90,90,0.7)'; ctx.lineWidth = 2.5;
    this.ell(ctx, 0, 0, R, R); ctx.stroke();
  }
  ctx.restore();
};

ART.enemyColors = function (e, base) {
  if (e.hurtFlash > 0) return '#ffffff';
  if (e.frozen > 0) return '#bfe8ff';
  return base;
};

ART.drawEnemy = function (ctx, e, g) {
  const t = g.time;
  ctx.save();
  if (e.state === 'spawn') { const k = 1 - e.t / 0.45; ctx.globalAlpha = clamp(k, 0, 1); }
  // 차지 중 붉은 기운
  if (e.state === 'special') {
    const k = 1 - e.t / e.def.special.wind;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const r = e.r * 2.2 + Math.sin(t * 30) * 3;
    const cy = e.y - e.height * 0.45;
    const gr = ctx.createRadialGradient(e.x, cy, 2, e.x, cy, r);
    const hot = e.t <= SPARKLE_TIME;
    gr.addColorStop(0, hot ? 'rgba(255,240,180,0.55)' : `rgba(255,40,40,${0.25 + 0.3 * k})`);
    gr.addColorStop(1, 'rgba(255,0,0,0)');
    ctx.fillStyle = gr; this.circle(ctx, e.x, cy, r); ctx.fill(); ctx.restore();
  }
  // 정예/보스는 크기 확대 (스프라이트는 기본 크기 기준으로 그림)
  let tip = null;
  const sc = e.sc;
  let jx = 0;
  if (e.hitFreeze > 0) jx = (Math.random() - 0.5) * 4;
  ctx.translate(e.x + jx, e.y); ctx.scale(sc, sc); ctx.translate(-e.x, -e.y);
  if (e.def.art === 'slime') this.drawSlime(ctx, e, t);
  else if (e.def.art === 'goblin') tip = this.drawGoblin(ctx, e, t);
  else tip = this.drawBrute(ctx, e, t);
  ctx.restore();
  if (tip) tip = { x: e.x + (tip.x - e.x) * sc, y: e.y + (tip.y - e.y) * sc };

  const headY = e.y - e.height;
  if (e.state === 'special') {
    // 머리 위 경고 표시
    const hot = e.t <= SPARKLE_TIME;
    ctx.font = font(hot ? 30 : 24); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    textOutlined(ctx, '!', e.x, headY - 16 + Math.sin(t * 20) * 2, hot ? '#fff6b0' : '#ff4a4a', OL, 5);
    if (hot && tip) {
      const k = 1 - e.t / SPARKLE_TIME;
      this.sparkle(ctx, tip.x, tip.y, 16 + 14 * Math.sin(k * Math.PI) + 6, t * 6, 1);
    } else if (tip && Math.sin(t * 25) > 0.3) {
      this.sparkle(ctx, tip.x, tip.y, 6, t * 4, 0.7);
    }
  }
  if (e.frozen > 0) {
    ctx.save();
    ctx.fillStyle = 'rgba(170,230,255,0.35)'; ctx.strokeStyle = 'rgba(230,250,255,0.9)'; ctx.lineWidth = 2;
    roundRect(ctx, e.x - e.r * 1.3, headY - 6, e.r * 2.6, e.height + 10, 8); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.moveTo(e.x - e.r * 0.9, headY + 6); ctx.lineTo(e.x - e.r * 0.4, headY + 20); ctx.stroke();
    ctx.restore();
  }
  if (e.stun > 0) {
    for (let i = 0; i < 3; i++) {
      const a = t * 5 + i * TAU / 3;
      const sx = e.x + Math.cos(a) * (e.r * 0.9 + 6), sy = headY - 6 + Math.sin(a) * 6;
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(t * 4);
      ctx.fillStyle = '#ffe14a'; ctx.strokeStyle = OL; ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let j = 0; j < 10; j++) { const r = j % 2 ? 3 : 7; const aa = j / 10 * TAU - Math.PI / 2; ctx.lineTo(Math.cos(aa) * r, Math.sin(aa) * r); }
      ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
    }
  }
};

ART.drawSlime = function (ctx, e, t) {
  const moving = e.state === 'chase';
  let bounce = moving ? Math.abs(Math.sin(e.animT * 7)) : 0.35 + 0.15 * Math.sin(e.animT * 3);
  let sx = 1 + (1 - bounce) * 0.12, sy = 1 - (1 - bounce) * 0.1 + bounce * 0.08;
  let h = moving ? bounce * 7 : 0;
  if (e.state === 'windup') { sx *= 1.18; sy *= 0.78; h = 0; }
  const R = e.def.r;
  this.shadow(ctx, e.x, e.y, R * 1.1 * (1 - h / 30), R * 0.42);
  ctx.save(); ctx.translate(e.x, e.y - h);
  ctx.beginPath();
  ctx.moveTo(-R * 1.15 * sx, 0);
  ctx.bezierCurveTo(-R * 1.2 * sx, -R * 1.55 * sy, R * 1.2 * sx, -R * 1.55 * sy, R * 1.15 * sx, 0);
  ctx.quadraticCurveTo(0, R * 0.28, -R * 1.15 * sx, 0);
  ctx.closePath();
  const col = this.enemyColors(e, null);
  if (col) this.fs(ctx, col);
  else {
    const gr = ctx.createRadialGradient(-R * 0.3, -R * 0.9, 2, 0, -R * 0.5, R * 1.4);
    gr.addColorStop(0, '#b6f59a'); gr.addColorStop(0.5, '#62cf55'); gr.addColorStop(1, '#2e8a3c');
    this.fs(ctx, gr);
  }
  ctx.fillStyle = 'rgba(255,255,255,0.7)'; this.ell(ctx, -R * 0.42, -R * 0.88 * sy, R * 0.26, R * 0.15, -0.5); ctx.fill();
  if (Math.sin(e.facing) > -0.55) {
    const ex = Math.cos(e.facing) * R * 0.35;
    for (const d of [-1, 1]) {
      ctx.fillStyle = '#1b1530'; this.ell(ctx, ex + d * R * 0.3, -R * 0.55 * sy, 2.6, 4); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillRect(ex + d * R * 0.3 - 1.3, -R * 0.55 * sy - 2.5, 1.6, 1.6);
    }
  }
  ctx.restore();
};

ART.drawGoblin = function (ctx, e, t) {
  const flip = Math.cos(e.facing) < 0;
  const back = Math.sin(e.facing) < -0.6;
  const moving = e.state === 'chase';
  const step = moving ? Math.sin(e.animT * 12) : 0;
  const bob = moving ? Math.abs(step) * 2 : Math.sin(e.animT * 3);
  const c = e.state === 'special' ? 5 : 0;
  const by = c - bob;
  this.shadow(ctx, e.x, e.y, 18, 7);
  ctx.save(); ctx.translate(e.x, e.y); ctx.scale(flip ? -1 : 1, 1);
  ctx.lineJoin = 'round';
  const skin = this.enemyColors(e, '#79b54a'), cloth = this.enemyColors(e, '#7a5434'), dark = this.enemyColors(e, '#3d2a1c');
  roundRect(ctx, -8 + step * 3, -13, 6, 13, 3); this.fs(ctx, dark, 2.5);
  roundRect(ctx, 2 - step * 3, -13, 6, 13, 3); this.fs(ctx, dark, 2.5);
  roundRect(ctx, -11, -33 + by, 22, 22, 7); this.fs(ctx, cloth);
  const hy = -44 + by;
  ctx.beginPath(); ctx.moveTo(-11, hy - 2); ctx.lineTo(-27, hy - 9); ctx.lineTo(-11, hy + 5); ctx.closePath(); this.fs(ctx, skin, 2.5);
  ctx.beginPath(); ctx.moveTo(11, hy - 2); ctx.lineTo(27, hy - 9); ctx.lineTo(11, hy + 5); ctx.closePath(); this.fs(ctx, skin, 2.5);
  this.ell(ctx, 0, hy, 15, 13); this.fs(ctx, skin);
  if (!back) {
    ctx.fillStyle = e.hurtFlash > 0 ? '#fff' : '#ff2a2a';
    this.circle(ctx, -1, hy + 1, 2.8); ctx.fill(); this.circle(ctx, 8, hy + 1, 2.8); ctx.fill();
    ctx.strokeStyle = OL; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-5, hy - 5); ctx.lineTo(2, hy - 3); ctx.moveTo(4, hy - 3); ctx.lineTo(11, hy - 5); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.fillRect(1, hy + 6, 3, 3); ctx.fillRect(6, hy + 6, 3, 3);
  }
  // 단검
  let ang = 0.5;
  if (e.state === 'special') ang = -2.3 + Math.sin(t * 40) * 0.05;
  else if (e.state === 'windup') ang = -1.2;
  else if (e.state === 'recover') ang = 0.1;
  const hx = 12, hyy = -25 + by;
  ctx.save(); ctx.translate(hx, hyy); ctx.rotate(ang);
  roundRect(ctx, -6, -2, 10, 4, 2); this.fs(ctx, '#4a2e1a', 2);
  ctx.beginPath(); ctx.moveTo(4, -3.5); ctx.lineTo(26, 0); ctx.lineTo(4, 3.5); ctx.closePath(); this.fs(ctx, this.enemyColors(e, '#d8dde6'), 2);
  ctx.restore();
  this.circle(ctx, hx, hyy, 4); this.fs(ctx, skin, 2);
  ctx.restore();
  const lx = hx + Math.cos(ang) * 26, ly = hyy + Math.sin(ang) * 26;
  return { x: e.x + (flip ? -lx : lx), y: e.y + ly };
};

ART.drawBrute = function (ctx, e, t) {
  const flip = Math.cos(e.facing) < 0;
  const back = Math.sin(e.facing) < -0.6;
  const moving = e.state === 'chase';
  const step = moving ? Math.sin(e.animT * 7) : 0;
  const bob = moving ? Math.abs(step) * 3 : Math.sin(e.animT * 2) * 1.5;
  const sp = e.state === 'special';
  const by = (sp ? -4 : 0) - bob;
  this.shadow(ctx, e.x, e.y + 2, 36, 12, 0.32);
  ctx.save(); ctx.translate(e.x, e.y); ctx.scale(flip ? -1 : 1, 1);
  ctx.lineJoin = 'round';
  const B = e.boss;
  const F = e.def.final; // 최종 보스: 보랏빛
  const skin = this.enemyColors(e, F ? '#8a4ac8' : B ? '#c85a4a' : '#9a7cc0'), belly = this.enemyColors(e, F ? '#c8a0f0' : B ? '#eaa088' : '#c3a9de');

      roundRect(c, -2.5, -34, 5, 52, 2.5); this.fs(c, '#e8d6a0', 2);
      const gl = h.swing > 0 ? 1 : 0.55;
      c.save(); c.globalCompositeOperation = 'lighter'; c.fillStyle = `rgba(120,255,160,${0.5 * gl})`; this.circle(c, 0, -40, 14); c.fill(); c.restore();

ART.symbolIcon = function (id) {

  ctx.beginPath(); ctx.rect(A.x - 3000, A.y - 3000, 6000, 6000); ctx.ellipse(A.x, A.y, A.r, A.r, 0, 0, TAU, true); ctx.fill('evenodd');

// 몬스터 머리 위 릴 / 플레이어 저주 릴
ART.drawSlotReel = function (ctx, r, g) {
  const n = r.slots.length, S = 34, gap = 3, pad = 5; // 칸 크기 34px (기존 42px 대비 약 20% 축소)
  const curse = r.kind === 'curse', a = r.anchor;
  const tw = n * S + (n - 1) * gap;
  const pop = Ease.outBack(clamp(r.slots[0].t / 0.18, 0, 1)) * BAL.monsterReel.scale;
  const frameCol = curse ? '#b05cff' : a.boss ? '#ff6a5a' : a.elite ? '#ffd24a' : '#d9a441';
  ctx.save();
  ctx.globalAlpha = clamp(r.fade, 0, 1);
  ctx.translate(r.x, r.y); ctx.scale(pop, pop); ctx.translate(-r.x, -r.y);
  ctx.beginPath(); ctx.moveTo(r.x - 6, r.y + S / 2 + pad - 1); ctx.lineTo(r.x, r.y + S / 2 + pad + 7); ctx.lineTo(r.x + 6, r.y + S / 2 + pad - 1); ctx.closePath();
  ctx.fillStyle = frameCol; ctx.fill();
  roundRect(ctx, r.x - tw / 2 - pad, r.y - S / 2 - pad, tw + pad * 2, S + pad * 2, 8);
  ctx.fillStyle = curse ? '#22082e' : '#1a1028'; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = frameCol; ctx.stroke();
  r.slots.forEach((s, i) => {
    const sx = r.x - tw / 2 + i * (S + gap), sy = r.y - S / 2;
    ctx.save();
    roundRect(ctx, sx, sy, S, S, 5); ctx.fillStyle = '#0d0916'; ctx.fill(); ctx.clip();
    const idx = Math.floor(s.pos), frac = s.pos - idx;
    const icon = (id) => (curse ? this.curseIcon(id) : this.mIcon(id));
    ctx.drawImage(icon(s.strip[Math.min(idx, s.strip.length - 1)]), sx, sy + frac * S, S, S);
    ctx.drawImage(icon(s.strip[Math.min(idx + 1, s.strip.length - 1)]), sx, sy + (frac - 1) * S, S, S);
    const sh = ctx.createLinearGradient(0, sy, 0, sy + S);
    sh.addColorStop(0, 'rgba(0,0,0,0.5)'); sh.addColorStop(0.25, 'rgba(0,0,0,0)'); sh.addColorStop(0.75, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,0,0.5)');
    ctx.fillStyle = sh; ctx.fillRect(sx, sy, S, S);
    ctx.restore();
    if (s.flash > 0) { ctx.lineWidth = 2 + 3 * s.flash; ctx.strokeStyle = '#ffffff'; roundRect(ctx, sx, sy, S, S, 6); ctx.stroke(); }
  });
  ctx.restore();
};

ART.drawEliteAura = function (ctx, e, t) {
  const col = e.boss ? '255,90,70' : '255,205,60';
  const k = 0.5 + 0.5 * Math.sin(t * 5);
  ctx.save();
  ctx.fillStyle = `rgba(${col},${0.12 + 0.1 * k})`;
  this.ell(ctx, e.x, e.y, e.r * 1.6, e.r * 0.6); ctx.fill();
  ctx.strokeStyle = `rgba(${col},${0.5 + 0.4 * k})`; ctx.lineWidth = 3;
  this.ell(ctx, e.x, e.y, e.r * 1.6, e.r * 0.6); ctx.stroke();
  ctx.restore();

// 릴블레이드 충전 완료 표시 (발밑)
ART.drawChargedRing = function (ctx, p, t) {

<script>/* fx.js */
'use strict';
// 이펙트 (파티클, 데미지 숫자, 베기 궤적, 폭발, 번개 등)

class FX {
  constructor() { this.list = []; }

  add(o) { o.t = 0; if (!o.layer) o.layer = 'top'; this.list.push(o); return o; }

  update(dt) {
    const L = this.list;
    let j = 0;
    for (let i = 0; i < L.length; i++) {
      const f = L[i];
      f.t += dt;
      if (f.type === 'p') {
        f.vz -= f.g * dt;
        f.x += f.vx * dt; f.y += f.vy * dt; f.z += f.vz * dt;
        if (f.z < 0) { f.z = 0; f.vz *= -0.35; f.vx *= 0.6; f.vy *= 0.6; }
        const d = Math.max(0, 1 - f.drag * dt); f.vx *= d; f.vy *= d;
      } else if (f.type === 'text') {
        f.y += f.vy * dt; f.vy *= Math.max(0, 1 - 3 * dt);
      }
      if (f.t < f.life) L[j++] = f;
    }
    L.length = j;
  }

  draw(ctx, layer) {
    for (const f of this.list) if (f.layer === layer) this.drawOne(ctx, f);
  }

  // ---- spawners
  particle(x, y, o) {
    return this.add(Object.assign({ type: 'p', x, y, z: 0, vx: 0, vy: 0, vz: 0, g: 900, drag: 2, life: 0.5, size: 4, color: '#fff', glow: false }, o));
  }
  burst(x, y, color, n = 10, spd = 300, life = 0.5, size = 4, o = {}) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), s = rand(spd * 0.3, spd);
      this.particle(x, y, Object.assign({
        vx: Math.cos(a) * s, vy: Math.sin(a) * s * 0.6, vz: rand(100, 380), z: o.z ?? 20,
        life: rand(life * 0.6, life), size: rand(size * 0.6, size), color,
      }, o));
    }
  }
  text(x, y, str, color = '#fff', size = 26, o = {}) {
    return this.add(Object.assign({ type: 'text', x: x + rand(-8, 8), y, str: String(str), color, size, vy: -90, life: 0.8, layer: 'text' }, o));
  }
  ring(x, y, r0, r1, life, color, width = 6, ground = false) {
    return this.add({ type: 'ring', x, y, r0, r1, life, color, width, layer: ground ? 'ground' : 'top', squash: ground ? 0.85 : 1 });
  }
  slash(x, y, ang, r, arc, side, color, life = 0.2, thrust = false) {
    return this.add({ type: 'slash', x, y, ang, r, arc, side, color, life, thrust });
  }
  bolt(points, color, life = 0.2) {
    const pts = [];
    for (let i = 0; i < points.length - 1; i++) {
      const a = points[i], b = points[i + 1];
      const segs = 5;
      for (let s = 0; s < segs; s++) {
        const k = s / segs;
        const jit = s === 0 ? 0 : 14;
        pts.push({ x: lerp(a.x, b.x, k) + rand(-jit, jit), y: lerp(a.y, b.y, k) + rand(-jit, jit) });
      }
    }
    pts.push(points[points.length - 1]);
    return this.add({ type: 'bolt', pts, color, life });
  }
  boom(x, y, r, inner = '#fff3b0', outer = '#ff6a1a') {
    this.add({ type: 'boom', x, y, r, inner, outer, life: 0.35 });
    this.add({ type: 'decal', x, y, r: r * 0.7, life: 3, layer: 'ground' });
  }
  ghost(x, y, facing, color = 'rgba(95,240,255,') {
    return this.add({ type: 'ghost', x, y, facing, color, life: 0.22, layer: 'ground' });
  }
  // 대시 관통: 지점에서 ang 방향(몬스터 뒤쪽)으로 뻗는 섬광
  pierce(x, y, ang, len, color, width = 30) {
    return this.add({ type: 'pierce', x, y, ang, len, color, width, life: 0.28 });
  }
  portal(x, y) { return this.add({ type: 'portal', x, y, life: 0.7, layer: 'ground' }); }

  // ---- draw
  drawOne(ctx, f) {
    const k = clamp(f.t / f.life, 0, 1);
    switch (f.type) {
      case 'p': {
        const s = f.size * (1 - k * 0.8);
        ctx.globalAlpha = 1 - k * k;
        if (f.glow) ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = f.color;
        ctx.beginPath(); ctx.arc(f.x, f.y - f.z, Math.max(0.5, s), 0, TAU); ctx.fill();
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
        break;
      }
      case 'text': {
        const a = k < 0.65 ? 1 : 1 - (k - 0.65) / 0.35;
        const sc = f.t < 0.12 ? 1 + (1 - f.t / 0.12) * 0.7 : 1;
        ctx.save(); ctx.globalAlpha = a; ctx.translate(f.x, f.y); ctx.scale(sc, sc);
        ctx.font = font(f.size); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        textOutlined(ctx, f.str, 0, 0, f.color, '#1a0f22', Math.max(4, f.size * 0.22));
        ctx.restore();
        break;
      }
      case 'ring': {
        const r = lerp(f.r0, f.r1, Ease.outCubic(k));
        ctx.save(); ctx.globalAlpha = 1 - k; ctx.strokeStyle = f.color; ctx.lineWidth = f.width * (1 - k) + 1;
        ctx.beginPath(); ctx.ellipse(f.x, f.y, Math.max(0.1, r), Math.max(0.1, r * f.squash), 0, 0, TAU); ctx.stroke();
        ctx.restore();
        break;
      }
      case 'slash': {
        ctx.save(); ctx.translate(f.x, f.y - 28); ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 1 - k;
        if (f.thrust) {
          ctx.rotate(f.ang);
          const L = f.r * (0.6 + 0.6 * Ease.outCubic(Math.min(1, k * 2)));
          const gr = ctx.createLinearGradient(0, 0, L, 0);
          gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(1, f.color);
          ctx.fillStyle = gr;
          ctx.beginPath(); ctx.moveTo(10, -10); ctx.lineTo(L, 0); ctx.lineTo(10, 10); ctx.closePath(); ctx.fill();
        } else {
          const sweep = Ease.outCubic(Math.min(1, k * 2.5));
          const a0 = f.ang - f.side * f.arc / 2;
          const a1 = a0 + f.side * f.arc * sweep;
          const ccw = f.side < 0;
          ctx.beginPath();
          ctx.arc(0, 0, f.r, a0, a1, ccw);
          ctx.arc(0, 0, f.r * 0.62, a1, a0, !ccw);
          ctx.closePath();
          ctx.fillStyle = f.color; ctx.globalAlpha = (1 - k) * 0.55; ctx.fill();
          ctx.globalAlpha = 1 - k; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(0, 0, f.r, a0, a1, ccw); ctx.stroke();
        }
        ctx.restore();
        break;
      }
      case 'bolt': {
        ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 1 - k;
        ctx.lineJoin = 'round'; ctx.lineCap = 'round';
        for (const [w, c] of [[9, f.color], [3, '#ffffff']]) {
          ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath();
          f.pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
          ctx.stroke();
        }
        ctx.restore();
        break;
      }
      case 'boom': {
        const r = f.r * (0.45 + 0.55 * Ease.outCubic(k));
        ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 1 - k;
        const gr = ctx.createRadialGradient(f.x, f.y - 20, 2, f.x, f.y - 20, r);
        gr.addColorStop(0, f.inner); gr.addColorStop(0.5, f.outer); gr.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = gr; ctx.beginPath(); ctx.ellipse(f.x, f.y - 20, r, r * 0.85, 0, 0, TAU); ctx.fill();
        ctx.restore();
        break;
      }
      case 'decal': {
        ctx.save(); ctx.globalAlpha = 0.35 * (1 - k);
        ctx.fillStyle = '#1a120c'; ctx.beginPath(); ctx.ellipse(f.x, f.y, f.r, f.r * 0.6, 0, 0, TAU); ctx.fill();
        ctx.restore();
        break;
      }
      case 'ghost': {
        ctx.save(); ctx.globalAlpha = 0.4 * (1 - k);
        ctx.fillStyle = f.color + '1)';
        ctx.beginPath(); ctx.ellipse(f.x, f.y - 28, 14, 16, 0, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.arc(f.x, f.y - 58, 17, 0, TAU); ctx.fill();
        ctx.restore();
        break;
      }
      case 'pierce': {
        const grow = Ease.outCubic(Math.min(1, k * 3));
        const L = f.len * (0.35 + 0.65 * grow), w = f.width * (1 - k * 0.7);
        ctx.save(); ctx.translate(f.x, f.y - 30); ctx.rotate(f.ang);
        ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 1 - k;
        // 뒤로 퍼지는 원뿔 섬광
        const gr = ctx.createLinearGradient(0, 0, L, 0);
        gr.addColorStop(0, f.color); gr.addColorStop(0.55, f.color); gr.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = gr;
        ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(L * 0.25, -w); ctx.lineTo(L, 0); ctx.lineTo(L * 0.25, w); ctx.closePath(); ctx.fill();
        // 흰 중심선 + 비스듬한 파편 줄기
        ctx.strokeStyle = '#ffffff'; ctx.lineCap = 'round';
        ctx.lineWidth = 4 * (1 - k) + 1;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(L * 0.9, 0); ctx.stroke();
        ctx.lineWidth = 2.5 * (1 - k) + 0.5;
        for (const s of [-1, 1]) {
          ctx.beginPath(); ctx.moveTo(L * 0.1, s * 4); ctx.lineTo(L * 0.7, s * w * 1.25); ctx.stroke();
        }
        ctx.restore();
        break;
      }
      case 'portal': {
        const s = Math.sin(k * Math.PI);
        ctx.save(); ctx.globalAlpha = 0.85;
        ctx.fillStyle = '#2a0f3a'; ctx.beginPath(); ctx.ellipse(f.x, f.y, 34 * s, 13 * s, 0, 0, TAU); ctx.fill();
        ctx.strokeStyle = '#b05cff'; ctx.lineWidth = 3; ctx.stroke();
        ctx.restore();
        break;
      }
    }
  }
}
