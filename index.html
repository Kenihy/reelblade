<script>/* entities.js */
'use strict';
// 플레이어 / 적 / 영웅 / 투사체

// ================================================================ 플레이어
class Player {
  constructor(x, y) {
    const B = BAL.player;
    this.x = x; this.y = y; this.r = B.r;
    this.hp = B.hp; this.maxHp = B.hp;
    this.dead = false;
    this.facing = Math.PI / 2;
    this.state = 'idle';       // idle | move | attack | dash
    this.target = null;
    this.atkTimer = 0; this.combo = 0; this.swing = null;
    this.freeze = 0;           // 타격 시 공격 모션 정지
    this.combatT = 0;          // 공격 상태 유지 (버튼 깜빡임 방지)
    this.dashTarget = null; this.dashT = 0; this.autoDashT = 0;
    this.walkT = 0; this.isMoving = false; this.ghostT = 0;
    this.lastParry = -99; this.parryCD = 0; this.parryCDMax = 1; this.parryPose = 0;
    this.parryPending = false; // 패링 판정 중 (끝날 때까지 막은 게 없으면 실패)
    this.rage = 0;             // 패링 성공 버프
    this.shield = 0; this.shieldT = 0;
    this.invuln = 0; this.hurtFlash = 0;
    this.abilities = {};       // 릴 공격 능력 { id: {t, max, lvl} }
    this.fusions = {};         // 합성 공격·스킬 (판 끝까지) { id: {lvl, ...} }
    this.curses = {};          // 저주 { id: {t, max} }
    this.bleedTick = 0;
    this.orbitAng = 0; this.storm = 0; this.stormTick = 0;
    this.skills = [null, null];
    this.mods = { atk: 0, aspd: 0, move: 0, energy: 0, crit: 0, guard: 0, parryWin: 0, rageTime: 0, rageBonus: 0, lucky: 0, dashRange: 0, dashDmg: 0 };
  }

  get atkPower() {
    const B = BAL.player;
    return B.atk * (1 + this.mods.atk) * (this.rage > 0 ? 1 + B.parryBuffAtk + this.mods.rageBonus : 1) * (this.curses.weak ? 0.7 : 1);
  }
  get atkSpeed() {
    const B = BAL.player;
    return B.atkSpeed * (1 + this.mods.aspd) * (this.rage > 0 ? 1 + B.parryBuffSpd + this.mods.rageBonus : 1) * (this.curses.slow ? 0.75 : 1);
  }
  get moveMul() { return (1 + this.mods.move) * (this.curses.slow ? 0.75 : 1); }
  get parryWindow() { return BAL.player.parryWindow + this.mods.parryWin; }
  get critChance() { return BAL.player.critChance + this.mods.crit; }
  get inCombat() { return this.state === 'attack' || this.combatT > 0; }

  heal(n) { this.hp = Math.min(this.maxHp, this.hp + n); }

  // 대시 가능한 대상 (일정 거리 안의 가장 가까운 적)
  dashCandidate(g) {
    const R = BAL.player.dashRange * (1 + this.mods.dashRange);
    let best = null, bd = Infinity;
    for (const e of g.enemies) {
      if (!e.alive || e.state === 'spawn') continue;
      const gap = dist(this.x, this.y, e.x, e.y) - e.r - this.r;
      if (gap <= R && gap < bd) { bd = gap; best = e; }
    }
    return best;
  }

  startDash(g) {
    if (this.state === 'dash' || this.dead) return false;
    const t = this.dashCandidate(g);
    if (!t) return false;
    this.state = 'dash'; this.dashTarget = t; this.dashT = 0;
    this.invuln = Math.max(this.invuln, 0.3);
    this.swing = null;
    SFX.dash();
    return true;
  }

  tryParry(g) {
    if (this.parryCD > 0 || this.parryPending) return false;
    this.lastParry = g.elapsed;
    this.parryPending = true;
    this.parryCD = this.parryCDMax = BAL.player.parryCooldown;
    this.parryPose = 0.25;
    SFX.parryWhiff();
    return true;
  }

  // 판정 시간 안이거나, 누른 뒤 반짝이는 특수기가 아직 진행 중이면 유효 (타격 경직으로 발동이 늦어져도 막힘)
  parryActive(g) { return this.parryPending || g.elapsed - this.lastParry <= this.parryWindow; }

  // 판정 시간이 끝날 때까지 막은 특수기가 없으면 실패 → 긴 쿨타임
  parryFailed(g) {
    this.parryPending = false;
    this.parryCD = this.parryCDMax = BAL.player.parryFailCD;
    g.fx.text(this.x, this.y - 116, '패링 실패', '#ff8a8a', 22, { life: 0.9 });
    SFX.miss();
  }

  onParrySuccess() {
    this.parryPending = false;
    this.parryCD = 0;
    this.rage = BAL.player.parryBuffTime + this.mods.rageTime;
    this.atkTimer = 0;
    this.parryPose = 0.3;
  }

  update(dt, g) {
    if (this.dead) return;
    this.parryCD = Math.max(0, this.parryCD - dt);
    if (this.parryPending && g.elapsed - this.lastParry > this.parryWindow && !g.parryThreat) this.parryFailed(g);
    this.parryPose = Math.max(0, this.parryPose - dt);
    this.rage = Math.max(0, this.rage - dt);
    this.invuln = Math.max(0, this.invuln - dt);
    this.hurtFlash = Math.max(0, this.hurtFlash - dt);
    if (this.shieldT > 0) { this.shieldT -= dt; if (this.shieldT <= 0) this.shield = 0; }
    for (const k in this.abilities) {
      this.abilities[k].t -= dt;
      if (this.abilities[k].t <= 0) delete this.abilities[k];
    }
    for (const k in this.curses) {
      this.curses[k].t -= dt;
      if (this.curses[k].t <= 0) delete this.curses[k];
    }
    if (this.curses.bleed) {
      this.bleedTick -= dt;
      if (this.bleedTick <= 0) { this.bleedTick = 1; g.damagePlayer(2, null, { pure: true }); if (this.dead) return; }
    }

    // 공격 모션 (타격 순간 0.1초 정지)
    if (this.freeze > 0) this.freeze -= dt;
    else if (this.swing) {
      const s = this.swing;
      s.t += dt;
      if (!s.hit && s.t >= s.hitAt) { s.hit = true; this.resolveHit(g); }
      if (s.t >= s.dur) this.swing = null;
    }

    this.autoDashT = Math.max(0, this.autoDashT - dt);
    this.isMoving = false;
    if (this.state === 'dash') {
      this.updateDash(dt, g);
    } else {
      const mv = g.input.moveVec;
      if (mv.x || mv.y) {
        // 드래그 중에는 공격하지 않고 수동 8방향 이동
        this.state = 'move'; this.target = null; this.combatT = 0;
        const sp = BAL.player.speed * this.moveMul;
        this.x += mv.x * sp * dt; this.y += mv.y * sp * dt;
        this.facing = Math.atan2(mv.y, mv.x);
        this.isMoving = true;
      } else {
        this.updateAutoAttack(dt, g);
        if (g.autoMode && this.state === 'idle') this.updateAutoHunt(dt, g);
      }
    }
    if (this.isMoving) this.walkT += dt * (this.state === 'dash' ? 1.8 : 1);
    this.updateAbilities(dt, g);
  }

  // 일정 거리 안에 적이 있으면 제자리에서 자동 공격 (적에게 달려가지 않음)
  updateAutoAttack(dt, g) {
    const B = BAL.player;
    const gapOf = (e) => dist(this.x, this.y, e.x, e.y) - e.r - this.r;
    let t = this.target;
    if (!t || !t.alive || gapOf(t) > B.autoRange + 10) {
      t = null;
      let bd = B.autoRange;
      for (const e of g.enemies) {
        if (!e.alive || e.state === 'spawn') continue;
        const gp = gapOf(e);
        if (gp <= bd) { bd = gp; t = e; }
      }
      this.target = t;
    }
    if (t) {
      this.state = 'attack';
      this.combatT = 0.4;
      if (!this.swing || this.swing.hit) this.facing = angleTo(this.x, this.y, t.x, t.y);
      if (this.freeze <= 0) this.atkTimer -= dt;
      if (this.atkTimer <= 0 && !this.swing) {
        this.startSwing(g, t, this.combo === 2 ? 'thrust' : 'slash');
        this.combo = (this.combo + 1) % 3;
        this.atkTimer = 1 / this.atkSpeed;
      }
    } else {
      this.state = 'idle';
      this.combatT = Math.max(0, this.combatT - dt);
    }
  }

  // 자동 모드: 근접 공격 대상이 없으면 가장 가까운 적에게 이동, 대시 거리 안이면 대시
  updateAutoHunt(dt, g) {
    let near = null, bd = Infinity;
    for (const e of g.enemies) {
      if (!e.alive || e.state === 'spawn') continue;
      const d = dist2(this.x, this.y, e.x, e.y);
      if (d < bd) { bd = d; near = e; }
    }
    if (!near) return;
    if (this.autoDashT <= 0 && this.dashCandidate(g) && this.startDash(g)) {
      this.autoDashT = BAL.player.autoDashGap;
      return;
    }
    const a = angleTo(this.x, this.y, near.x, near.y);
    const sp = BAL.player.speed * this.moveMul;
    this.x += Math.cos(a) * sp * dt; this.y += Math.sin(a) * sp * dt;
    this.facing = a;
    this.state = 'move';
    this.isMoving = true;
  }

  updateDash(dt, g) {
    const B = BAL.player, t = this.dashTarget;
    if (!t || !t.alive) { this.state = 'idle'; return; }
    const a = angleTo(this.x, this.y, t.x, t.y);
    this.facing = a;
    const gap = dist(this.x, this.y, t.x, t.y) - t.r - this.r;
    const step = Math.min(B.dashSpeed * this.moveMul * dt, Math.max(0, gap - B.reachPad * 0.5));
    this.x += Math.cos(a) * step; this.y += Math.sin(a) * step;
    this.isMoving = true;
    this.dashT += dt;
    this.ghostT -= dt;
    if (this.ghostT <= 0) { this.ghostT = 0.03; g.fx.ghost(this.x, this.y, this.facing); }
    if (gap - step <= B.reachPad || this.dashT > 0.45) {
      // 도착 → 대시 베기
      this.state = 'attack'; this.target = t; this.combatT = 0.4;
      this.startSwing(g, t, 'dash');
      this.atkTimer = 1 / this.atkSpeed;
    }
  }

  startSwing(g, t, kind) {
    const dur = kind === 'dash' ? 0.24 : Math.min(0.26, 0.75 / this.atkSpeed);
    const side = kind === 'dash' ? 1 : (this.combo === 1 ? -1 : 1);
    this.swing = { t: 0, dur, side, kind, hitAt: dur * 0.35, hit: false, target: t };
    SFX.slash();
  }

  resolveHit(g) {
    const B = BAL.player, s = this.swing, t = s.target;
    const dashHit = s.kind === 'dash';
    const mul = dashHit ? B.dashMul * (1 + this.mods.dashDmg) : s.kind === 'thrust' ? 1.35 : 1;
    const reach = B.reachPad + (dashHit ? 30 : 16);
    const arc = dashHit ? 2.6 : B.cleaveArc;
    const hits = [];
    for (const e of g.enemies) {
      if (!e.alive) continue;
      const d = dist(this.x, this.y, e.x, e.y) - e.r - this.r;
      if (d > reach) continue;
      const ad = Math.abs(angleDiff(this.facing, angleTo(this.x, this.y, e.x, e.y)));
      if (e === t || ad <= arc / 2 || d < 4) hits.push(e);
    }
    // 릴블레이드 게이지가 가득 찬 상태로 타격 → 해당 몬스터에게 릴 슬롯
    let reelFired = false;
    if (g.gauge >= BAL.gauge.max) {
      const victim = (t && t.alive && hits.includes(t) && !t.reel) ? t : hits.find((e) => !e.reel);
      if (victim && g.spawnMonsterReel(victim)) { g.gauge = 0; reelFired = true; }
    }
    const kb = dashHit ? 340 : s.kind === 'thrust' ? 260 : 140;
    for (const e of hits) {
      const crit = Math.random() < this.critChance;
      const dmg = this.atkPower * mul * (crit ? B.critMul : 1) * rand(0.9, 1.1);
      e.hitFreeze = B.hitFreeze;
      if (dashHit) g.dashBurst(e, angleTo(this.x, this.y, e.x, e.y), crit); // 몬스터 뒤쪽으로 터지는 관통 이펙트
      g.damageEnemy(e, dmg, { crit, kx: Math.cos(this.facing) * kb, ky: Math.sin(this.facing) * kb });
      if (this.abilities.flame && e.alive) {
        e.ignite(this.atkPower * (0.3 + 0.1 * this.abilities.flame.lvl), 3);
        g.fx.burst(e.x, e.y, '#ff8a2a', 4, 160, 0.4, 5, { z: 30, glow: true, g: -200 });
      }
    }
    if (hits.length) {
      this.freeze = B.hitFreeze;
      if (!reelFired) g.addGauge(BAL.gauge.perHit);
      SFX.hit();
      g.shake(dashHit ? 5 : 2, 0.08);
    }
    const col = g.gauge >= BAL.gauge.max ? '#ffe27a' : this.rage > 0 ? '#ffb04a' : '#7ff3ff';
    g.fx.slash(this.x, this.y, this.facing, this.r + reach + 14, s.kind === 'thrust' ? 0.9 : dashHit ? 3.0 : 2.3, s.side, col, 0.2, s.kind === 'thrust');
    if (dashHit) g.fx.ring(this.x, this.y, 20, 110, 0.3, '#9ff6ff', 6, true);

    const A = this.abilities;
    if (A.wave) {
      const n = A.wave.lvl >= 4 ? 3 : A.wave.lvl >= 2 ? 2 : 1;
      for (let i = 0; i < n; i++) {
        const a = this.facing + (i - (n - 1) / 2) * 0.28;
        g.projectiles.push(new Projectile({
          kind: 'wave', x: this.x + Math.cos(a) * 20, y: this.y + Math.sin(a) * 20,
          vx: Math.cos(a) * 780, vy: Math.sin(a) * 780, ang: a, life: 0.55, r: 30, pierce: 99,
          dmg: this.atkPower * (0.55 + 0.15 * A.wave.lvl), scale: 1 + 0.1 * A.wave.lvl,
        }));
      }
    }
    if (A.chain && t && hits.includes(t)) g.chainLightning(t, 2 + A.chain.lvl, this.atkPower * (0.45 + 0.12 * A.chain.lvl));
    // 합성: 화염 검기 (베기마다 불타는 검기, 맞은 적 점화)
    const fw = this.fusions.flameWave;
    if (fw) {
      const n = fw.lvl >= 4 ? 3 : fw.lvl >= 2 ? 2 : 1;
      for (let i = 0; i < n; i++) {
        const a = this.facing + (i - (n - 1) / 2) * 0.3;
        g.projectiles.push(new Projectile({
          kind: 'wave', fire: true, x: this.x + Math.cos(a) * 20, y: this.y + Math.sin(a) * 20,
          vx: Math.cos(a) * 820, vy: Math.sin(a) * 820, ang: a, life: 0.6, r: 34, pierce: 99,
          dmg: this.atkPower * (0.8 + 0.15 * fw.lvl), scale: 1.15 + 0.1 * fw.lvl, burn: this.atkPower * (0.4 + 0.1 * fw.lvl),
        }));
      }
    }
  }

  updateAbilities(dt, g) {
    const ob = this.abilities.orbit;
    if (ob) {
      this.orbitAng += dt * 4.2;
      const n = 2 + ob.lvl;
      for (let i = 0; i < n; i++) {
        const a = this.orbitAng + i * TAU / n;
        const bx = this.x + Math.cos(a) * 88, by = this.y + Math.sin(a) * 88;
        for (const e of g.enemies) {
          if (!e.alive) continue;
          if (dist2(bx, by, e.x, e.y) < (e.r + 18) ** 2 && g.elapsed - (e.orbitHit || -9) > 0.35) {
            e.orbitHit = g.elapsed;
            g.damageEnemy(e, this.atkPower * (0.4 + 0.1 * ob.lvl), { color: '#bfe8ff', kx: Math.cos(a) * 120, ky: Math.sin(a) * 120 });
          }
        }
      }
    }
    if (this.storm > 0) {
      this.storm -= dt; this.stormTick -= dt;
      if (this.stormTick <= 0) {
        this.stormTick = 0.15;
        for (const e of g.enemies) {
          if (e.alive && dist(this.x, this.y, e.x, e.y) < 135 + e.r) g.damageEnemy(e, this.atkPower * 0.75, { color: '#bfe8ff' });
        }
        SFX.slash();
      }
    }
  }
}

// ================================================================ 적
class Enemy {
  constructor(type, x, y, scale = 1, elite = false) {
    const d = ENEMY_TYPES[type];
    this.def = d; this.type = type; this.elite = elite && !d.boss; this.boss = !!d.boss;
    this.sc = BAL.charScale * (d.size || 1) * (this.elite ? BAL.elite.scale : 1);
    this.x = x; this.y = y; this.r = d.r * this.sc;
    this.height = d.height * this.sc;
    this.maxHp = Math.round(d.hp * scale * (this.elite ? BAL.elite.hpMul : 1)); this.hp = this.maxHp;
    this.dmgScale = (1 + (scale - 1) * 0.35) * (this.elite ? BAL.elite.dmgMul : 1);
    this.slots = this.boss ? 3 : this.elite ? 2 : 1;
    this.spRange = d.special ? d.special.range * this.sc : 0;
    this.alive = true;
    this.speed = d.speed * rand(0.9, 1.1);
    this.facing = Math.PI / 2;
    this.state = 'spawn'; this.t = 0.45;
    this.atkCD = rand(0.3, 1);
    this.spCD = d.special ? rand(1.5, 3.5) : 0;
    this.kvx = 0; this.kvy = 0;
    this.hurtFlash = 0; this.hitFreeze = 0; this.stun = 0; this.frozen = 0;
    this.burn = 0; this.burnDps = 0; this.burnTick = 0;
    this.animT = Math.random() * 10;
    this.aim = 0;
    this.reel = null;
  }

  get mass() { const k = this.sc / BAL.charScale; return this.def.mass * k * k; } // 전체 크기 배율은 무게에 반영 안 함

  ignite(dps, t) { this.burnDps = Math.max(this.burnDps, dps); this.burn = Math.max(this.burn, t); }

  stunFor(t) {
    this.stun = t;
    this.state = 'chase'; this.t = 0;
    this.spCD = Math.max(this.spCD, 2);
    this.atkCD = Math.max(this.atkCD, 0.6);
  }

  freeze(t) {
    this.frozen = Math.max(this.frozen, t);
    if (this.state === 'special' || this.state === 'windup') { this.state = 'chase'; this.spCD = Math.max(this.spCD, 1.5); }
  }

  pickTarget(g) {
    // 기사(성기사 포함) 영웅은 주변 적을 도발
    for (const h of g.heroes) {
      if (h.alive && h.landed && h.base === 'knight' && dist2(h.x, h.y, this.x, this.y) < 150 * 150) return h;
    }
    // 그 외에는 플레이어보다 확실히 가까운 영웅을 공격
    const p = g.player;
    let best = p, bd = p.dead ? Infinity : dist2(p.x, p.y, this.x, this.y);
    for (const h of g.heroes) {
      if (!h.alive || !h.landed) continue;
      const d = dist2(h.x, h.y, this.x, this.y) * 1.4;
      if (d < bd && d < 260 * 260 * 1.4) { best = h; bd = d; }
    }
    return best;
  }

  update(dt, g) {
    this.hurtFlash = Math.max(0, this.hurtFlash - dt);
    if (this.hitFreeze > 0) { this.hitFreeze -= dt; return; } // 피격 경직 (타격감)
    this.animT += dt;
    this.x += this.kvx * dt; this.y += this.kvy * dt;
    const kd = Math.max(0, 1 - 10 * dt); this.kvx *= kd; this.kvy *= kd;

    if (this.burn > 0) {
      this.burn -= dt; this.burnTick -= dt;
      if (this.burnTick <= 0) {
        this.burnTick = 0.5;
        g.damageEnemy(this, this.burnDps * 0.5, { color: '#ffa04a', small: true });
        g.fx.burst(this.x, this.y, '#ff8a2a', 3, 80, 0.5, 5, { z: 30, glow: true, g: -200 });
        if (!this.alive) return;
      }
    }
    if (this.state === 'spawn') { this.t -= dt; if (this.t <= 0) this.state = 'chase'; return; }
    if (this.frozen > 0) { this.frozen -= dt; return; }
    if (this.stun > 0) { this.stun -= dt; return; }

    const tgt = this.pickTarget(g);
    const isPlayer = tgt === g.player;
    if (isPlayer && g.player.dead) { this.state = 'chase'; return; }
    const gap = dist(this.x, this.y, tgt.x, tgt.y) - this.r - tgt.r;
    this.atkCD -= dt;
    if (this.def.special) this.spCD -= dt;

    switch (this.state) {
      case 'chase': {
        const a = angleTo(this.x, this.y, tgt.x, tgt.y);
        this.facing = a;
        if (this.def.special && isPlayer && this.spCD <= 0 && gap <= this.spRange * 0.85) {
          this.state = 'special'; this.t = this.def.special.wind; this.aim = a;
          break;
        }
        if (gap <= this.def.atkRange) {
          if (this.atkCD <= 0) { this.state = 'windup'; this.t = this.def.atkWind; }
        } else {
          this.x += Math.cos(a) * this.speed * dt;
          this.y += Math.sin(a) * this.speed * dt;
        }
        break;
      }
      case 'windup':
        this.t -= dt;
        if (this.t <= 0) {
          if (gap <= this.def.atkRange + 14) g.enemyHit(this, tgt, this.def.dmg * this.dmgScale);
          this.atkCD = this.def.atkCD * rand(0.85, 1.15);
          this.state = 'recover'; this.t = 0.25;
        }
        break;
      case 'special': {
        const sp = this.def.special;
        this.t -= dt;
        // 차지 초반에는 조준 추적, 이후 고정 (회피 가능)
        if (this.t > sp.wind * 0.45) {
          const want = angleTo(this.x, this.y, g.player.x, g.player.y);
          this.aim += angleDiff(this.aim, want) * Math.min(1, dt * 8);
          this.facing = this.aim;
        }
        if (this.t <= 0) {
          this.resolveSpecial(g);
          if (this.state === 'special') { this.state = 'recover'; this.t = 0.55; }
          this.spCD = rand(sp.cd[0], sp.cd[1]);
        }
        break;
      }
      case 'recover':
        this.t -= dt;
        if (this.t <= 0) this.state = 'chase';
        break;
    }
  }

  // 특수기 범위 안에 있는지
  inSpecialZone(px, py, pr, margin = 0) {
    const sp = this.def.special;
    if (sp.kind === 'lunge') {
      const L = this.spRange + this.r + 10, w = this.r + 10;
      const ca = Math.cos(this.aim), sa = Math.sin(this.aim);
      const dx = px - this.x, dy = py - this.y;
      const along = dx * ca + dy * sa, perp = Math.abs(-dx * sa + dy * ca);
      return along > -this.r - margin && along < L + pr + margin && perp < w + pr + margin;
    }
    return dist(px, py, this.x, this.y) <= this.spRange + this.r + pr * 0.5 + margin;
  }

  resolveSpecial(g) {
    const sp = this.def.special, p = g.player;
    const hit = this.inSpecialZone(p.x, p.y, p.r);
    if (sp.kind === 'lunge') {
      this.kvx = Math.cos(this.aim) * 700; this.kvy = Math.sin(this.aim) * 700;
      g.fx.slash(this.x, this.y, this.aim, 80 * this.sc, 0.8, 1, '#ff6a6a', 0.22, true);
    } else {
      const R = this.spRange + this.r;
      g.fx.ring(this.x, this.y, 10, R, 0.4, '#ffb36b', 10, true);
      g.fx.burst(this.x, this.y, '#a08060', 16, 320, 0.5, 6, { z: 5 });
      g.shake(this.boss ? 12 : 6, 0.2);
      SFX.explode();
    }
    // 범위 안의 영웅도 피해
    for (const h of g.heroes) {
      if (h.alive && h.landed && this.inSpecialZone(h.x, h.y, h.r)) g.damageHero(h, sp.dmg * this.dmgScale, { heavy: true });
    }
    if (hit && !p.dead) {
      if (p.parryActive(g)) g.onParry(this);
      else {
        g.damagePlayer(sp.dmg * this.dmgScale, this, { heavy: true });
        if (!p.dead) { g.cursePlayer(); g.dropCoins(); } // 특수기를 막지 못하면 저주 릴 + 코인 흘림
      }
    }
  }
}

// ================================================================ 영웅 (릴 소환)
class Hero {
  constructor(type, x, y, lvl) {
    this.type = type; this.def = HERO_TYPES[type];
    this.base = this.def.base || type; // 모습·공격 방식 (합성 영웅은 기본 영웅을 따름)
    this.permanent = false; this.auraT = 2;
    this.x = x; this.y = y; this.r = 18 * BAL.charScale; this.lvl = lvl;
    this.life = this.maxLife = BAL.heroDur;
    this.alive = true;
    this.atkT = 0.3; this.facing = Math.PI / 2; this.target = null;
    this.swing = 0; this.walkT = 0; this.isMoving = false; this.seed = Math.random() * 10;
    this.dropT = 0; this.dropMax = 1;  // 소환 시 위에서 떨어지는 연출
    this.hurtFlash = 0;
    this.maxHp = this.hp = this.hpFor(lvl);
  }

  hpFor(lvl) { return Math.round(this.def.hp * (1 + 0.3 * (lvl - 1))); }
  get landed() { return this.dropT <= 0; }
  get dmg() { return this.def.dmg * (1 + 0.5 * (this.lvl - 1)); }
  get z() { return this.dropT > 0 ? 280 * (this.dropT / this.dropMax) ** 2 : 0; }

  update(dt, g) {
    if (this.dropT > 0) {
      this.dropT -= dt;
      if (this.dropT <= 0) { this.dropT = 0; g.heroLand(this); }
      return;
    }
    this.life -= dt;
    if (this.life <= 0) {
      this.alive = false;
      g.fx.burst(this.x, this.y, '#ffd24a', 14, 260, 0.5, 5, { z: 30, glow: true });
      return;
    }
    this.hurtFlash = Math.max(0, this.hurtFlash - dt);
    this.swing = Math.max(0, this.swing - dt);
    this.atkT -= dt;
    this.isMoving = false;
    const p = g.player;
    if (this.def.aura && !p.dead) {
      // 성기사: 주기적으로 플레이어에게 보호막
      this.auraT -= dt;
      if (this.auraT <= 0) {
        this.auraT = BAL.fusion.paladinShieldCD;
        p.shield = Math.max(p.shield, 20 + 12 * this.lvl); p.shieldT = 12;
        g.fx.ring(p.x, p.y - 30, 10, 70, 0.45, '#ffe08a', 6);
        g.fx.text(p.x, p.y - 116, '성기사의 가호', '#ffe08a', 20, { life: 1.0 });
      }
    }
    if (this.def.heal) { this.updateHealer(dt, g); return; }
    if (!this.target || !this.target.alive || dist2(this.target.x, this.target.y, p.x, p.y) > 650 * 650) {
      this.target = g.findNearestEnemy(this.x, this.y, 560, (e) => dist2(e.x, e.y, p.x, p.y) < 600 * 600);
    }
    const t = this.target;
    let mx = 0, my = 0;
    if (t) {
      const a = angleTo(this.x, this.y, t.x, t.y);
      this.facing = a;
      const gap = dist(this.x, this.y, t.x, t.y) - t.r - this.r;
      const want = this.def.range;
      if (gap > want) { mx = Math.cos(a); my = Math.sin(a); }
      else if (this.base !== 'knight' && gap < want * 0.4) { mx = -Math.cos(a); my = -Math.sin(a); }
      if (gap <= want + 8 && this.atkT <= 0) {
        this.attack(g, t);
        this.atkT = this.def.atkCD / (1 + 0.15 * (this.lvl - 1));
      }
    } else {
      const d = dist(this.x, this.y, p.x, p.y);
      if (d > 110) { const a = angleTo(this.x, this.y, p.x, p.y); mx = Math.cos(a); my = Math.sin(a); this.facing = a; }
    }
    if (mx || my) {
      this.x += mx * this.def.speed * dt; this.y += my * this.def.speed * dt;
      this.isMoving = true; this.walkT += dt;
    }
  }

  // 힐러: 플레이어 근처를 따라다니며 체력 비율이 가장 낮은 아군을 회복
  updateHealer(dt, g) {
    const p = g.player;
    let tgt = null, low = 0.999;
    const consider = (u, maxHp) => {
      if (dist2(u.x, u.y, this.x, this.y) > this.def.range * this.def.range) return;
      const k = u.hp / maxHp;
      if (k < low) { low = k; tgt = u; }
    };
    if (!p.dead) consider(p, p.maxHp);
    for (const h of g.heroes) if (h.alive && h.landed) consider(h, h.maxHp);
    let mx = 0, my = 0;
    const d = dist(this.x, this.y, p.x, p.y);
    if (d > 130) { const a = angleTo(this.x, this.y, p.x, p.y); mx = Math.cos(a); my = Math.sin(a); this.facing = a; }
    else {
      // 가까운 적에게서 살짝 물러남
      const e = g.findNearestEnemy(this.x, this.y, 90);
      if (e) { const a = angleTo(e.x, e.y, this.x, this.y); mx = Math.cos(a) * 0.7; my = Math.sin(a) * 0.7; }
    }
    if (tgt) {
      this.facing = angleTo(this.x, this.y, tgt.x, tgt.y);
      if (this.atkT <= 0) {
        this.swing = 0.25;
        g.healUnit(tgt, this.dmg, this);
        this.atkT = this.def.atkCD / (1 + 0.15 * (this.lvl - 1));
      }
    }
    if (mx || my) {
      this.x += mx * this.def.speed * dt; this.y += my * this.def.speed * dt;
      this.isMoving = true; this.walkT += dt;
    }
  }

  attack(g, t) {
    this.swing = 0.25;
    const chain = this.def.chain ? 1 + Math.ceil(this.lvl / 2) : 0; // 뇌전 궁수: 화살 적중 시 번개 연쇄
    if (this.base === 'knight') {
      for (const e of g.enemies) {
        if (!e.alive) continue;
        const d = dist(this.x, this.y, e.x, e.y) - e.r - this.r;
        if (d <= 44 && (e === t || Math.abs(angleDiff(this.facing, angleTo(this.x, this.y, e.x, e.y))) < 1.1)) {
          g.damageEnemy(e, this.dmg, { kx: Math.cos(this.facing) * 160, ky: Math.sin(this.facing) * 160 });
        }
      }
      g.fx.slash(this.x, this.y, this.facing, 64, 2, 1, this.def.aura ? '#fff2b0' : '#ffe08a', 0.2);
      SFX.slash();
    } else if (this.base === 'archer') {
      const a = angleTo(this.x, this.y, t.x, t.y);
      g.projectiles.push(new Projectile({
        kind: 'arrow', x: this.x, y: this.y, vx: Math.cos(a) * 950, vy: Math.sin(a) * 950,
        life: 0.6, r: 8, dmg: this.dmg, pierce: this.lvl >= 3 ? 2 : 0, chain, zap: !!chain,
      }));
      if (this.lvl >= 2) {
        for (const off of [-0.18, 0.18]) {
          g.projectiles.push(new Projectile({
            kind: 'arrow', x: this.x, y: this.y, vx: Math.cos(a + off) * 950, vy: Math.sin(a + off) * 950,
            life: 0.6, r: 8, dmg: this.dmg * 0.6, pierce: 0, zap: !!chain,
          }));
        }
      }
    } else {
      const a = angleTo(this.x, this.y, t.x, t.y);
      g.projectiles.push(new Projectile({
        kind: 'fireball', x: this.x, y: this.y, vx: Math.cos(a) * 560, vy: Math.sin(a) * 560,
        life: 0.9, r: 14, dmg: this.dmg, R: 70 + 12 * this.lvl,
      }));
    }
  }
}

// ================================================================ 투사체
class Projectile {
  constructor(o) {
    Object.assign(this, { x: 0, y: 0, vx: 0, vy: 0, life: 1, t: 0, dmg: 10, r: 10, pierce: 0, kind: 'arrow', alive: true }, o);
    this.hit = new Set();
    if (this.kind === 'bomb' || this.kind === 'meteor') { this.sx = this.x; this.sy = this.y; this.z = 0; }
  }

  update(dt, g) {
    this.t += dt;
    switch (this.kind) {
      case 'wave': case 'arrow': case 'fireball': {
        this.x += this.vx * dt; this.y += this.vy * dt;
        if (this.kind === 'fireball' && Math.random() < 0.6) g.fx.particle(this.x, this.y, { z: 34, vz: 40, g: 0, life: 0.3, size: 7, color: '#ff8a2a', glow: true });
        for (const e of g.enemies) {
          if (!e.alive || this.hit.has(e)) continue;
          if (dist2(this.x, this.y, e.x, e.y) <= (this.r + e.r) ** 2) {
            if (this.kind === 'fireball') { this.explode(g); return; }
            this.hit.add(e);
            const a = Math.atan2(this.vy, this.vx);
            const col = this.fire ? '#ffb04a' : this.kind === 'wave' ? '#9ff3ff' : this.zap ? '#fff46a' : '#ffffff';
            g.damageEnemy(e, this.dmg, { color: col, kx: Math.cos(a) * 120, ky: Math.sin(a) * 120 });
            if (this.burn && e.alive) e.ignite(this.burn, 3);
            if (this.chain) { g.chainLightning(e, this.chain, this.dmg * 0.6); this.chain = 0; }
            if (this.pierce-- <= 0) { this.alive = false; return; }
          }
        }
        if (this.t >= this.life) { if (this.kind === 'fireball') this.explode(g); else this.alive = false; }
        break;
      }
      case 'bomb': {
        const k = Math.min(1, this.t / this.dur);
        this.x = lerp(this.sx, this.tx, k); this.y = lerp(this.sy, this.ty, k);
        this.z = Math.sin(k * Math.PI) * 140;
        if (k >= 1) this.explode(g);
        break;
      }
      case 'meteor':
        if (this.t >= this.dur) this.explode(g);
        break;
    }
  }

  explode(g) {
    this.alive = false;
    if (this.kind === 'fireball') g.explode(this.x, this.y, this.R, this.dmg, { shake: 3 });
    else if (this.kind === 'bomb') g.explode(this.x, this.y, this.R, this.dmg, { shake: 9 });
    else if (this.kind === 'meteor') {
      g.explode(this.tx, this.ty, this.R, this.dmg, { shake: this.freeze ? 10 : 16 });
      if (this.freeze) {
        // 혜성: 떨어진 자리 주변을 얼림
        for (const e of g.enemies) if (e.alive && dist(this.tx, this.ty, e.x, e.y) <= this.R * 1.15 + e.r) e.freeze(this.freeze);
        g.fx.ring(this.tx, this.ty, 20, this.R * 1.3, 0.6, '#bfe8ff', 12, true);
        g.fx.burst(this.tx, this.ty, '#dff6ff', 24, 500, 0.6, 5, { z: 20, glow: true });
        SFX.freeze();
      } else {
        g.fx.ring(this.tx, this.ty, 20, this.R * 1.3, 0.5, '#ffcf7a', 12, true);
        g.flash = 0.25; g.flashColor = '255,200,120';
      }
    }
  }
}

</script>
<script>/* reel.js */
'use strict';
// 릴 시스템
//  - PlayerReel : 상단 HUD의 플레이어 릴. 코인 개수만큼 칸들이 반짝이고,
//                 반짝이는 칸을 터치하면 첫 칸부터 그 칸까지 코인을 써서 함께 회전.
//                 왼쪽 릴과 같은 심볼이 나오면 왼쪽 릴로 합체(강화)하고 그 칸은 한 번 더 회전.
//                 모두 멈추면 이웃한 레시피 조합을 합성 → 심볼이 캐릭터에게 날아가 획득되고 릴은 바로 비워짐.
//                 심볼은 판마다 새로 꾸리는 덱(레벨업 카드로 추가·제거·강화)에서만 나옴.
//                 남은 칸을 모두 돌릴 때 코인이 충분히 남으면 피버 스핀 (남은 코인 전부 사용).
//  - SlotReel   : 몬스터 머리 위 릴 / 플레이어 저주 릴 (월드 공간)

function makeStrip(first, result, len, rollFn) {
  const strip = [first];
  for (let k = 1; k < len - 1; k++) strip.push(rollFn());
  strip.push(result);       // 결과 (index len-1)
  strip.push(rollFn());     // 오버슈트용 여분
  return strip;
}

// 회전 진행 (0..1 → 스트립 위치), 멈추면 true
function advanceSpin(s, dt) {
  s.t += dt;
  const k = Math.min(1, s.t / s.dur);
  s.pos = (s.L - 1) * Ease.outBack(k, 0.9);
  const idx = Math.floor(s.pos);
  if (idx !== s.lastIdx) { s.lastIdx = idx; if (s.tick) SFX.tick(); }
  if (k >= 1) { s.pos = s.L - 1; return true; }
  return false;
}

// ================================================================ 플레이어 릴
class PlayerReel {
  constructor(g) {
    this.g = g;
    this.coins = 0;
    this.cells = [];          // 칸별 {id, lvl, flash, merge} 또는 undefined
    this.cursor = 0;          // 다음에 채울 칸
    this.active = [];         // 회전 중인 칸들
    this.respins = {};        // 칸별 연속 합체 횟수
    this.temp = [];           // 임시 슬롯별 남은 회전 횟수
    this.holdT = 0;           // 결과 확인 후 캐릭터에게 날아가기까지
    this.spins = 0; this.merges = 0; this.fusions = 0; this.fevers = 0;
    this.newSlotFx = 0;
    this.deck = BAL.deck.start.slice();
    this.boost = {};          // 심볼별 획득 Lv 보너스 (강화 카드)
    this.gold = 0;            // 황금 와일드: 남은 합체 확정 횟수
    this.fever = null;        // 피버 스핀 중이면 { bonus, surplus }
  }

  // 덱에서 심볼 뽑기 (강화한 심볼은 더 자주)
  randSym() { return weightedPick(this.deck, (id) => SYMBOLS[id].w * (1 + 0.5 * (this.boost[id] || 0))); }

  addSymbol(id) { if (!this.deck.includes(id)) this.deck.push(id); }
  removeSymbol(id) { if (this.deck.length > BAL.deck.min) this.deck = this.deck.filter((s) => s !== id); }
  boostSymbol(id) { this.boost[id] = Math.min(BAL.deck.boostMax, (this.boost[id] || 0) + 1); }

  // 지금 남은 칸을 모두 돌리면 피버가 되는지 (남는 코인 수, 아니면 0)
  feverSurplus() {
    const n = this.slotCount() - this.cursor;
    if (this.available() < n) return 0;
    const s = this.coins - n;
    return s >= BAL.fever.min ? s : 0;
  }

  slotCount() { return Math.min(BAL.reel.maxSlots, BAL.reel.baseSlots + this.temp.length); }
  tempLeft(i) { return i >= BAL.reel.baseSlots ? this.temp[i - BAL.reel.baseSlots] : 0; }
  get busy() { return this.active.length > 0; }
  spinning(i) { return this.active.find((s) => s.i === i); }

  // 지금 코인으로 돌릴 수 있는 칸 수 (커서부터)
  available() {
    if (this.busy || this.holdT > 0 || this.g.pendingLv > 0) return 0; // 레벨업 대기 중엔 새 회전 막음
    return Math.max(0, Math.min(this.coins, this.slotCount() - this.cursor));
  }
  canSpinTo(i) { const n = this.available(); return n > 0 && i >= this.cursor && i < this.cursor + n; }

  addTempSlot() {
    if (this.slotCount() >= BAL.reel.maxSlots) return;
    this.temp.push(BAL.reel.tempSlotSpins);
    this.newSlotFx = 1;
  }

  addCoins(n) { this.coins += n; SFX.coin(); }

  // 반짝이는 칸 터치 → 커서부터 그 칸까지 코인 사용해서 함께 회전
  spinTo(i) {
    if (!this.canSpinTo(i)) return false;
    const n = i - this.cursor + 1;
    const surplus = i === this.slotCount() - 1 ? this.feverSurplus() : 0;
    if (surplus) {
      // 피버: 남은 코인을 모두 써서 합체 확률 + 재회전 한도 상승
      const F = BAL.fever;
      this.coins = 0;
      this.fever = { bonus: Math.min(F.maxBonus, surplus * F.perCoin), surplus };
      this.fevers++;
      this.g.onFever(surplus);
    } else {
      this.coins -= n;
      this.fever = null;
    }
    this.respins = {};
    for (let k = 0; k < n; k++) this.startSpin(this.cursor + k, k, false);
    SFX.spinStart();
    return true;
  }

  // 돌릴 수 있는 칸 모두 회전 (PC 단축키)
  spinAll() { const n = this.available(); return n > 0 && this.spinTo(this.cursor + n - 1); }

  startSpin(i, order, respin) {
    const strip = [];
    for (let k = 0; k < 12; k++) strip.push(this.randSym());
    this.cells[i] = undefined;
    this.active.push({
      i, phase: 'free', freeT: 0,
      minFree: respin ? 0.3 : BAL.reel.spinTime * 0.6 + order * 0.25,
      strip, L: strip.length, pos: Math.random() * strip.length, speed: 18,
      t: 0, dur: respin ? 0.4 : 0.45, lastIdx: -1, tick: order === 0, result: null,
    });
    this.spins++;
  }

  update(dt) {
    this.newSlotFx = Math.max(0, this.newSlotFx - dt);
    for (const c of this.cells) if (c) { c.flash = Math.max(0, c.flash - dt * 2); c.merge = Math.max(0, c.merge - dt * 1.5); }
    if (this.holdT > 0) {
      this.holdT -= dt;
      if (this.holdT <= 0) this.release();
      return;
    }
    for (const s of this.active.slice()) {
      if (s.phase === 'free') {
        // 고속 회전 → 왼쪽 칸이 모두 결정된 뒤에 감속 정지 (왼쪽부터 순서대로)
        s.freeT += dt;
        s.pos = (s.pos + s.speed * dt) % s.L;
        const idx = Math.floor(s.pos);
        if (idx !== s.lastIdx) { s.lastIdx = idx; if (s.tick) SFX.tick(); }
        const blocked = this.active.some((o) => o.i < s.i);
        if (!blocked && s.freeT >= s.minFree) {
          s.result = this.roll(s.i);
          s.strip = makeStrip(s.strip[idx], s.result, 8, () => this.randSym());
          s.L = 8; s.pos = 0; s.t = 0; s.lastIdx = 0; s.phase = 'stop';
        }
      } else if (advanceSpin(s, dt)) {
        this.active.splice(this.active.indexOf(s), 1);
        this.onStop(s);
      }
    }
  }

  roll(i) {
    const left = this.cells[i - 1];
    if (!left || left.fused) return this.randSym();
    if (this.gold > 0 && (this.respins[i] || 0) < this.maxRespin) { this.gold--; return left.id; } // 황금 와일드: 합체 확정
    const luck = BAL.reel.matchChance + this.g.player.mods.lucky + (this.fever ? this.fever.bonus : 0);
    if (Math.random() < luck) return left.id;
    return this.randSym();
  }

  get maxRespin() { return this.fever ? BAL.fever.respin : BAL.reel.maxRespin; }

  onStop(s) {
    const g = this.g;
    SFX.reelStop();
    const id = s.result, i = s.i, left = this.cells[i - 1];
    if (left && !left.fused && left.id === id && (this.respins[i] || 0) < this.maxRespin) {
      // 합체: 왼쪽 릴 강화 + 이 칸 재회전
      left.lvl++; left.merge = 1; left.flash = 1;
      this.respins[i] = (this.respins[i] || 0) + 1;
      this.merges++;
      g.ui.banner(`${SYMBOLS[id].name} 합체! Lv${left.lvl}`, CAT[SYMBOLS[id].cat].color, 34, 1.8, left.lvl >= 3);
      SFX.merge();
      this.startSpin(i, 0, true);
      return;
    }
    this.cells[i] = { id, lvl: 1, flash: 1, merge: 0 };
    this.cursor = Math.max(this.cursor, i + 1);
    if (!this.busy) this.holdT = this.fuse() ? 1.0 : 0.35; // 모두 멈춤 → (합성) → 잠깐 보여준 뒤 획득
  }

  // 이웃한 두 칸이 레시피 조합이면 왼쪽 칸에 합성 심볼, 오른쪽 칸은 비움
  fuse() {
    let any = false;
    for (let i = 0; i + 1 < this.cells.length; i++) {
      const a = this.cells[i], b = this.cells[i + 1];
      if (!a || !b || a.fused || b.fused) continue;
      const rc = findRecipe(a.id, b.id);
      if (!rc) continue;
      this.cells[i] = { id: rc.out, lvl: Math.max(a.lvl, b.lvl), flash: 1, merge: 1, fused: true, parts: [a.id, b.id] };
      this.cells[i + 1] = { id: b.id, lvl: b.lvl, flash: 1, merge: 0, consumed: true };
      this.fusions++;
      this.g.onFusion(rc.out, this.cells[i].lvl);
      any = true;
      i++;
    }
    return any;
  }

  // 결과 심볼을 캐릭터에게 날려 보내고 릴 초기화
  release() {
    const { rects } = this.g.ui.reelSlotRects();
    let order = 0;
    this.cells.forEach((c, i) => {
      if (!c || c.consumed || !rects[i]) return;
      const r = rects[i];
      const lvl = c.lvl + (c.fused ? 0 : this.boost[c.id] || 0);
      this.g.launchSymbol(c.id, lvl, r.x + r.w / 2, r.y + r.h / 2, Math.min(r.w, r.h) - 12, order++ * 0.12);
    });
    this.cells = [];
    this.cursor = 0;
    this.fever = null;
    this.temp = this.temp.map((c) => c - 1).filter((c) => c > 0);
  }
}

// ================================================================ 몬스터 릴 / 저주 릴
class SlotReel {
  // kind: 'monster' | 'curse'
  constructor(g, anchor, n, kind) {
    this.g = g; this.anchor = anchor; this.kind = kind;
    this.x = anchor.x; this.y = anchor.y;
    this.alive = true; this.hold = 0; this.fade = 1;
    const table = kind === 'curse' ? null : anchor.def.reel;
    this.rollFn = kind === 'curse'
      ? () => pick(CURSE_IDS)
      : () => weightedPick(Object.keys(table), (id) => table[id] * (id === 'miss' && anchor.elite ? 0.5 : 1));
    const MR = BAL.monsterReel;
    this.slots = [];
    for (let i = 0; i < n; i++) {
      const result = this.rollFn();
      const L = 10 + i * 3;
      this.slots.push({ strip: makeStrip(this.rollFn(), result, L, this.rollFn), L, t: 0, dur: (kind === 'curse' ? 0.9 : MR.spinBase) + i * MR.spinStagger, pos: 0, lastIdx: 0, result, stopped: false, flash: 0, tick: i === 0 });
    }
  }

  update(dt) {
    const a = this.anchor;
    if (this.kind === 'curse' ? !a.dead : a.alive) {
      this.x = a.x;
      // 릴 아래 화살표 끝이 머리(체력바, 정예 표시, 보스 왕관) 위에 오도록 (화살표 끝 = 중심 + 29px × 배율)
      const tip = 29 * BAL.monsterReel.scale;
      this.y = a.y - (this.kind === 'curse' ? 120 + tip : a.height + (a.boss ? 34 : a.elite ? 28 : 12) + tip);
    }
    let all = true;
    this.slots.forEach((s, i) => {
      s.flash = Math.max(0, s.flash - dt * 3);
      if (s.stopped) return;
      all = false;
      if (advanceSpin(s, dt)) {
        s.stopped = true; s.flash = 1;
        SFX.reelStop();
        this.g.onSlotReelResult(this, i, s.result);
      }
    });
    if (all) {
      this.hold += dt;
      if (this.hold > BAL.monsterReel.hold) {
        this.fade -= dt * 3;
        if (this.fade <= 0) { this.alive = false; if (a.reel === this) a.reel = null; }
      }
    }
  }
}

</script>
<script>/* input.js */
'use strict';
// 터치/마우스/키보드 입력

class Input {
  constructor(g) {
    this.g = g;
    this.c = g.canvas;
    this.moveVec = { x: 0, y: 0 };
    this.joy = { active: false, id: null, ox: 0, oy: 0, x: 0, y: 0, moved: false };
    this.keys = new Set();
    const c = this.c;
    c.addEventListener('pointerdown', (e) => this.down(e));
    c.addEventListener('pointermove', (e) => this.move(e));
    c.addEventListener('pointerup', (e) => this.up(e));
    c.addEventListener('pointercancel', (e) => this.up(e));
    c.addEventListener('contextmenu', (e) => e.preventDefault());
    window.addEventListener('keydown', (e) => this.keyDown(e));
    window.addEventListener('keyup', (e) => this.keys.delete(e.code));
    window.addEventListener('blur', () => { this.keys.clear(); this.reset(); });
  }

  down(e) {
    e.preventDefault();
    SFX.init();
    const p = this.g.toLogical(e.clientX, e.clientY);
    const h = this.g.ui.hitTest(p.x, p.y);
    if (h) { h(); return; }
    if (this.g.state !== 'play') { this.g.onTap(p); return; }
    if (!this.joy.active) {
      this.joy = { active: true, id: e.pointerId, ox: p.x, oy: p.y, x: p.x, y: p.y, moved: false };
      try { this.c.setPointerCapture(e.pointerId); } catch (err) { /* noop */ }
    }
  }

  move(e) {
    const j = this.joy;
    if (!j.active || e.pointerId !== j.id) return;
    const p = this.g.toLogical(e.clientX, e.clientY);
    j.x = p.x; j.y = p.y;
    const dx = p.x - j.ox, dy = p.y - j.oy, d = Math.hypot(dx, dy);
    if (d > 16) j.moved = true;
    const R = 80 * 1.3;
    if (d > R) { j.ox = p.x - dx / d * R; j.oy = p.y - dy / d * R; } // 조이스틱 원점이 손가락을 따라옴
  }

  up(e) {
    if (this.joy.active && e.pointerId === this.joy.id) this.joy.active = false;
  }

  // 공격 시작 시 현재 손가락 위치를 새 원점으로 (이후 다시 드래그해야 수동 이동)
  rebaseJoystick() {
    const j = this.joy;
    j.ox = j.x; j.oy = j.y; j.moved = false;
  }

  reset() { this.joy.active = false; this.moveVec.x = 0; this.moveVec.y = 0; }

  keyDown(e) {
    if (e.repeat) return;
    this.keys.add(e.code);
    const g = this.g;
    SFX.init();
    if (g.state === 'paused') {
      if (e.code === 'Escape' || e.code === 'KeyP' || e.code === 'Space' || e.code === 'Enter') g.resume();
      return;
    }
    if (g.state === 'levelup') {
      const n = { Digit1: 0, Digit2: 1, Digit3: 2 }[e.code];
      if (n !== undefined) g.chooseCard(n);
      return;
    }
    if (g.state !== 'play') {
      if (e.code === 'Space' || e.code === 'Enter') g.onTap(null);
      return;
    }
    if (e.code === 'Space' || e.code === 'KeyJ') { e.preventDefault(); g.pressAction(); }
    else if (e.code === 'Digit1' || e.code === 'KeyK') g.useSkill(0);
    else if (e.code === 'Digit2' || e.code === 'KeyL') g.useSkill(1);
    else if (e.code === 'KeyE') g.preel.spinAll();
    else if (e.code === 'KeyQ') g.toggleAuto();
    else if (e.code === 'Escape' || e.code === 'KeyP') g.pause();
  }

  update() {
    let x = 0, y = 0;
    const j = this.joy;
    if (j.active && j.moved) {
      const dx = j.x - j.ox, dy = j.y - j.oy;
      if (Math.hypot(dx, dy) > 14) {
        // 8방향 스냅
        const a = Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) * (Math.PI / 4);
        x = Math.cos(a); y = Math.sin(a);
      }
    }
    const K = this.keys;
    const kx = (K.has('KeyD') || K.has('ArrowRight') ? 1 : 0) - (K.has('KeyA') || K.has('ArrowLeft') ? 1 : 0);
    const ky = (K.has('KeyS') || K.has('ArrowDown') ? 1 : 0) - (K.has('KeyW') || K.has('ArrowUp') ? 1 : 0);
    if (kx || ky) { const l = Math.hypot(kx, ky); x = kx / l; y = ky / l; }
    this.moveVec.x = Math.abs(x) < 1e-6 ? 0 : x;
    this.moveVec.y = Math.abs(y) < 1e-6 ? 0 : y;
  }
}

</script>
<script>/* ui.js */
'use strict';
// HUD / 버튼 / 플레이어 릴 / 레벨업 카드 / 타이틀·게임오버 화면

class UI {
  constructor(g) {
    this.g = g;
    this.banners = [];
    this.flyers = [];
    this.pressAnim = 0;
    this.skillPress = [0, 0];
    this.reelPress = 0;
    this.cardT = 0;
    this.cardRects = [];
    this.hint = null; this.hintT = 0;
    this.parryFlash = 0;
    this.pauseT = 0; this.pauseBtns = [];
  }

  layout(W, H) {
    this.W = W; this.H = H;
    this.FT = BAL.field.top;
    this.reelPanel = { x: 12, y: 52, w: W - 24, h: 128 };
    this.coinBox = { x: 24, y: 64, w: 78, h: 104 };
    this.gaugeRect = { x: 32, y: 190, w: W - 64, h: 24 };
    this.hpRect = { x: 64, y: 230, w: 250, h: 18 };
    this.atkBtn = { x: W - 130, y: H - 190, r: 92 };
    this.reelBtn = { x: 118, y: H - 160, r: 70 }; // 보유 코인 전부 사용해 릴 회전
    this.autoBtn = { x: 118, y: H - 300, r: 46 }; // 자동 전투 on/off
    this.pauseBtn = { x: W - 138, y: 28, r: 20 };
    this.skillBtns = [
      { x: W - 130 - 172, y: H - 190 + 62, r: 54 },
      { x: W - 130 - 66, y: H - 190 - 168, r: 54 },
    ];
  }

  update(dt) {
    for (const b of this.banners) b.t += dt;
    this.banners = this.banners.filter((b) => b.t < b.life);
    for (const f of this.flyers.slice()) {
      if (f.delay > 0) { f.delay -= dt; continue; }
      f.t += dt;
      if (f.t >= f.life && !f.done) { f.done = true; f.cb && f.cb(); }
    }
    this.flyers = this.flyers.filter((f) => !f.done);
    this.pressAnim = Math.max(0, this.pressAnim - dt);
    this.reelPress = Math.max(0, this.reelPress - dt);
    this.skillPress = this.skillPress.map((v) => Math.max(0, v - dt));
    this.parryFlash = Math.max(0, this.parryFlash - dt);
    this.hintT = Math.max(0, this.hintT - dt);
    if (this.g.state === 'levelup') this.cardT += dt;
  }

  banner(text, color = '#fff', size = 34, life = 1.6, big = false) {
    this.banners.push({ text, color, size, life, t: 0, big });
    if (this.banners.length > 5) this.banners.shift();
  }

  showHint(text, dur = 4) { this.hint = text; this.hintT = dur; }

  // 화면 공간 비행 연출. tgt()는 매 프레임 목표 지점(화면 좌표)을 돌려줌
  fly(o) {
    this.flyers.push(Object.assign({ t: 0, delay: 0, life: 0.6, size: 32, endSize: 32, done: false, glow: '255,230,120' }, o));
  }

  // 몬스터 릴에서 나온 코인이 상단 코인함으로 날아감
  flyCoin(sx, sy, cb) {
    const CB = this.coinBox;
    this.fly({
      sx, sy, cx: sx + rand(-120, 120), cy: sy - rand(80, 200), life: rand(0.55, 0.75), glyph: 'coin', cb,
      tgt: () => ({ x: CB.x + CB.w / 2, y: CB.y + 38 }),
    });
  }

  // 플레이어 릴 칸 위치 (그리기·터치 공용)
  reelSlotRects() {
    const P = this.reelPanel, CB = this.coinBox;
    const ax0 = CB.x + CB.w + 12, ax1 = P.x + P.w - 12, aw = ax1 - ax0;
    const n = this.g.preel.slotCount(), gap = 8;
    const sw = Math.min(118, (aw - (n - 1) * gap) / n), sh = P.h - 24;
    const total = n * sw + (n - 1) * gap;
    const x0 = ax0 + (aw - total) / 2, y0 = P.y + 12;
    const rects = [];
    for (let i = 0; i < n; i++) rects.push({ x: x0 + i * (sw + gap), y: y0, w: sw, h: sh });
    return { rects, sw, sh, x0, y0, total };
  }

  hitTest(x, y) {
    const g = this.g;
    if (g.state === 'levelup') {
      if (this.cardT < 0.45) return () => {};
      for (let i = 0; i < this.cardRects.length; i++) {
        const r = this.cardRects[i];
        if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return () => g.chooseCard(i);
      }
      return () => {};
    }
    if (g.state === 'paused') {
      for (const b of this.pauseBtns) {
        if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.fn;
      }
      return () => {};
    }
    if (g.state !== 'play') return null;
    const PB = this.pauseBtn;
    if (dist(x, y, PB.x, PB.y) <= PB.r + 14) return () => g.pause();
    const A = this.atkBtn;
    if (dist(x, y, A.x, A.y) <= A.r * 1.15) return () => { this.pressAnim = 0.12; g.pressAction(); };
    for (let i = 0; i < 2; i++) {
      const B = this.skillBtns[i];
      if (dist(x, y, B.x, B.y) <= B.r * 1.15) return () => g.useSkill(i);
    }
    const AB = this.autoBtn;
    if (dist(x, y, AB.x, AB.y) <= AB.r * 1.15) return () => g.toggleAuto();
    const RB = this.reelBtn;
    if (dist(x, y, RB.x, RB.y) <= RB.r * 1.15) {
      return () => { this.reelPress = 0.12; if (!g.preel.spinAll()) SFX.miss(); };
    }
    // 반짝이는 릴 칸 터치 → 그 칸까지 회전
    const { rects } = this.reelSlotRects();
    for (let i = 0; i < rects.length; i++) {
      const r = rects[i];
      if (x >= r.x - 4 && x <= r.x + r.w + 4 && y >= r.y - 4 && y <= r.y + r.h + 4) {
        return () => { if (!g.preel.spinTo(i) && g.preel.coins <= 0 && !g.preel.busy) SFX.miss(); };
      }
    }
    if (y < this.FT) return () => {}; // HUD 영역은 조이스틱 입력 제외
    return null;
  }

  // =========================================================== draw
  draw(ctx) {
    const g = this.g;
    if (g.state === 'title') { this.drawTitle(ctx); return; }
    this.drawBossBar(ctx);
    this.drawBanners(ctx);
    if (g.state === 'play') {
      this.drawControls(ctx);
      this.drawJoystick(ctx);
      if (this.hintT > 0 && this.hint) this.drawHint(ctx);
    }
    this.drawHUD(ctx);
    this.drawFlyers(ctx);
    if (g.state === 'paused') this.drawPause(ctx);
    if (g.state === 'levelup') this.drawLevelUp(ctx);
    if (g.state === 'over') this.drawGameOver(ctx);
    if (g.state === 'clear') this.drawClear(ctx);
  }

  drawHUD(ctx) {
    const W = this.W, FT = this.FT;
    const bg = ctx.createLinearGradient(0, 0, 0, FT);
    bg.addColorStop(0, '#1e1332'); bg.addColorStop(1, '#130b20');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, FT);
    const sh = ctx.createLinearGradient(0, FT, 0, FT + 14);
    sh.addColorStop(0, 'rgba(0,0,0,0.45)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sh; ctx.fillRect(0, FT, W, 14);
    ctx.fillStyle = '#c99a3c'; ctx.fillRect(0, FT - 3, W, 3);
    this.drawTopRow(ctx);
    this.drawReels(ctx);
    this.drawGauge(ctx);
    this.drawStatus(ctx);
  }

  drawTopRow(ctx) {
    const g = this.g, W = this.W;
    const need = g.expNeed();
    ART.circle(ctx, 36, 28, 21); ctx.fillStyle = '#2a1a3e'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#e3b341'; ctx.stroke();
    ctx.font = font(11); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#e3b341'; ctx.fillText('Lv', 36, 18);
    ctx.font = font(20); textOutlined(ctx, String(g.level), 36, 34, '#ffffff', '#120b1c', 4);
    const ex = { x: 66, y: 21, w: W - 66 - 170, h: 14 };
    roundRect(ctx, ex.x, ex.y, ex.w, ex.h, 7); ctx.fillStyle = '#0c0614'; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2; ctx.stroke();
    const ek = clamp(g.exp / need, 0, 1);
    if (ek > 0) { roundRect(ctx, ex.x + 2, ex.y + 2, (ex.w - 4) * ek, ex.h - 4, 5); ctx.fillStyle = '#7dff8a'; ctx.fill(); }
    ctx.font = font(12); ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.fillText(`EXP ${g.exp}/${need}`, ex.x + ex.w / 2, ex.y + ex.h / 2 + 1);
    // 챕터 진행 바 (정예 습격 · 중간 보스 · 최종 보스 시점 표시)
    const C = BAL.chapter, cb = { x: ex.x, y: ex.y + ex.h + 4, w: ex.w, h: 6 };
    roundRect(ctx, cb.x, cb.y, cb.w, cb.h, 3); ctx.fillStyle = '#0c0614'; ctx.fill();
    const ck = clamp(g.elapsed / C.duration, 0, 1);
    if (ck > 0) { roundRect(ctx, cb.x, cb.y, cb.w * ck, cb.h, 3); ctx.fillStyle = g.arena ? '#ff4a6a' : '#c99aff'; ctx.fill(); }
    for (const s of C.eliteWaves) { ctx.fillStyle = '#ffd24a'; ART.circle(ctx, cb.x + cb.w * s / C.duration, cb.y + 3, 3.5); ctx.fill(); }
    ctx.fillStyle = '#ff6a5a'; ART.circle(ctx, cb.x + cb.w * C.midBoss / C.duration, cb.y + 3, 5); ctx.fill();
    ctx.fillStyle = '#ff2a5a'; ART.circle(ctx, cb.x + cb.w, cb.y + 3, 6); ctx.fill();
    ctx.textAlign = 'right'; ctx.font = font(20);
    const final = !!g.arena;
    textOutlined(ctx, final ? 'FINAL' : fmtTime(g.elapsed), W - 24, 22, final ? '#ff6a7a' : '#ffffff', '#120b1c', 4);
    ctx.font = font(14); ctx.fillStyle = '#cbbfe6'; ctx.fillText(`처치 ${g.kills}`, W - 24, 42);
    // 잠시 멈춤 버튼
    const PB = this.pauseBtn;
    ART.circle(ctx, PB.x, PB.y, PB.r); ctx.fillStyle = '#2a1a3e'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#e3b341'; ctx.stroke();
    ctx.fillStyle = '#ffffff';
    roundRect(ctx, PB.x - 7.5, PB.y - 8, 5, 16, 2); ctx.fill();
    roundRect(ctx, PB.x + 2.5, PB.y - 8, 5, 16, 2); ctx.fill();
  }

  // 잠시 멈춤 화면
  drawPause(ctx) {
    const g = this.g, W = this.W, H = this.H;
    const a = Math.min(1, this.pauseT / 0.15);
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(8,4,16,0.72)'; ctx.fillRect(0, 0, W, H);
    const pw = W - 120, ph = 330, px = 60, py = H / 2 - ph / 2 - 40;
    roundRect(ctx, px, py, pw, ph, 24); ctx.fillStyle = 'rgba(30,19,50,0.96)'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#c99a3c'; ctx.stroke();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = font(40); textOutlined(ctx, '일시 정지', W / 2, py + 58, '#ffe9b0', '#120b1c', 6);
    ctx.font = font(18); ctx.fillStyle = '#cbbfe6';
    ctx.fillText(`${fmtTime(g.elapsed)} · Lv ${g.level} · 처치 ${g.kills}`, W / 2, py + 104);
    const bw = pw - 80, bh = 72, bx = px + 40;
    this.pauseBtns = [
      { x: bx, y: py + 140, w: bw, h: bh, label: '계속하기', c0: '#ffe08a', c1: '#d08a10', fn: () => g.resume() },
      { x: bx, y: py + 230, w: bw, h: bh, label: '다시 시작', c0: '#c8d2e8', c1: '#4a5568', fn: () => { SFX.click(); g.start(); } },
    ];
    for (const b of this.pauseBtns) {
      roundRect(ctx, b.x, b.y + 5, b.w, b.h, 18); ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill();
      roundRect(ctx, b.x, b.y, b.w, b.h, 18);
      const gr = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
      gr.addColorStop(0, b.c0); gr.addColorStop(1, b.c1);
      ctx.fillStyle = gr; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = '#1a0f22'; ctx.stroke();
      ctx.font = font(28); textOutlined(ctx, b.label, b.x + b.w / 2, b.y + b.h / 2 + 1, '#ffffff', '#1a0f22', 5);
    }
    this.drawDeck(ctx, py + ph + 20);
    ctx.restore();
  }

  drawReels(ctx) {
    const g = this.g, R = g.preel, P = this.reelPanel, CB = this.coinBox, t = g.time;
    roundRect(ctx, P.x, P.y, P.w, P.h, 20);
    const pg = ctx.createLinearGradient(0, P.y, 0, P.y + P.h);
    pg.addColorStop(0, '#34224d'); pg.addColorStop(1, '#150c24');
    ctx.fillStyle = pg; ctx.fill();
    const fever = R.fever, feverReady = R.feverSurplus() > 0;
    ctx.lineWidth = fever ? 7 : 4;
    ctx.strokeStyle = fever ? `hsl(${(t * 900) % 360},100%,68%)` : R.busy ? `hsl(${(t * 360) % 360},90%,65%)` : '#c99a3c'; ctx.stroke();
    if (fever) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.25 + 0.15 * Math.sin(t * 20);
      roundRect(ctx, P.x, P.y, P.w, P.h, 20); ctx.fillStyle = '#ff5ad8'; ctx.fill(); ctx.restore();
    }

    // 코인함 (피버 가능하면 분홍빛으로 반짝임)
    if (feverReady) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.4 + 0.35 * Math.sin(t * 10);
      roundRect(ctx, CB.x - 5, CB.y - 5, CB.w + 10, CB.h + 10, 18); ctx.fillStyle = '#ff5ad8'; ctx.fill(); ctx.restore();
    }
    roundRect(ctx, CB.x, CB.y, CB.w, CB.h, 14); ctx.fillStyle = '#24160a'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = feverReady ? '#ff9ae8' : R.coins > 0 ? '#ffd84a' : 'rgba(217,164,65,0.5)'; ctx.stroke();
    const bounce = R.coins > 0 ? Math.abs(Math.sin(t * 6)) * 3 : 0;
    ART.glyph(ctx, 'coin', CB.x + CB.w / 2, CB.y + 38 - bounce, 50);
    ctx.font = font(22); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    textOutlined(ctx, '×' + R.coins, CB.x + CB.w / 2, CB.y + 80, R.coins > 0 ? '#ffe27a' : '#8a7a5a', '#120b1c', 4);
    if (feverReady) { ctx.font = font(14); textOutlined(ctx, 'FEVER', CB.x + CB.w / 2, CB.y + 8, '#ffd0f4', '#3a0a30', 4); }
    if (R.gold > 0) {
      // 황금 와일드 남은 횟수
      const gx = CB.x + CB.w - 4, gy = CB.y + 4;
      ART.circle(ctx, gx, gy, 13); ctx.fillStyle = '#ffd24a'; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = '#7a4a00'; ctx.stroke();
      ctx.font = font(13); ctx.fillStyle = '#3a2000'; ctx.fillText('W' + R.gold, gx, gy + 1);
    }

    const { rects, sw, sh, x0, y0, total } = this.reelSlotRects();
    const n = rects.length;
    const iconSize = Math.min(sw, sh) - 12;
    for (let i = 0; i < n; i++) {
      const x = rects[i].x, cx = x + sw / 2, cy = y0 + sh / 2;
      const cell = R.cells[i], spin = R.spinning(i);
      const isTemp = i >= BAL.reel.baseSlots;
      const ready = R.canSpinTo(i);
      if (ready) {
        // 코인으로 돌릴 수 있는 칸: 테두리 반짝임
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.35 + 0.35 * Math.sin(t * 9 - i * 0.6);
        roundRect(ctx, x - 6, y0 - 6, sw + 12, sh + 12, 16); ctx.fillStyle = '#ffd84a'; ctx.fill();
        ctx.restore();
      }
      roundRect(ctx, x, y0, sw, sh, 12);
      const sg = ctx.createLinearGradient(0, y0, 0, y0 + sh);
      sg.addColorStop(0, '#0d0916'); sg.addColorStop(0.5, '#2e2545'); sg.addColorStop(1, '#0d0916');
      ctx.fillStyle = sg; ctx.fill();
      ctx.save(); ctx.clip();
      if (spin) {
        const L = spin.strip.length;
        const idx = Math.floor(spin.pos), frac = spin.pos - idx;
        ctx.globalAlpha = spin.phase === 'free' ? 0.85 : 1;
        ctx.drawImage(ART.symbolIcon(spin.strip[idx % L]), cx - iconSize / 2, cy - iconSize / 2 + frac * sh, iconSize, iconSize);
        ctx.drawImage(ART.symbolIcon(spin.strip[(idx + 1) % L]), cx - iconSize / 2, cy - iconSize / 2 + (frac - 1) * sh, iconSize, iconSize);
        ctx.globalAlpha = 1;
      } else if (cell && cell.consumed) {
        // 합성 재료로 쓰인 칸: 흐리게 + 왼쪽 화살표
        ctx.globalAlpha = 0.25;
        ctx.drawImage(ART.symbolIcon(cell.id), cx - iconSize / 2, cy - iconSize / 2, iconSize, iconSize);
        ctx.globalAlpha = 1;
        ctx.font = font(30); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        textOutlined(ctx, '◀', cx - 6 * Math.sin(t * 12), cy, '#ffd24a', '#120b1c', 5);
      } else if (cell) {
        const s = iconSize * (1 + 0.15 * cell.merge);
        if (cell.fused) {
          ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.5 + 0.3 * Math.sin(t * 14);
          ctx.fillStyle = '#ffd24a'; ART.circle(ctx, cx, cy, s * 0.62); ctx.fill(); ctx.restore();
        }
        ctx.drawImage(ART.symbolIcon(cell.id), cx - s / 2, cy - s / 2, s, s);
      } else if (ready) {
        const s = iconSize * (0.55 + 0.05 * Math.sin(t * 9 - i * 0.6));
        ART.glyph(ctx, 'coin', cx, cy - 8, s);
        ctx.font = font(15); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        textOutlined(ctx, 'TAP', cx, cy + sh * 0.3, '#fff2b0', '#120b1c', 4);
      } else {
        ctx.globalAlpha = 0.16; ART.glyph(ctx, 'coin', cx, cy, iconSize * 0.6); ctx.globalAlpha = 1;
      }
      const shade = ctx.createLinearGradient(0, y0, 0, y0 + sh);
      shade.addColorStop(0, 'rgba(0,0,0,0.6)'); shade.addColorStop(0.2, 'rgba(0,0,0,0)');
      shade.addColorStop(0.8, 'rgba(0,0,0,0)'); shade.addColorStop(1, 'rgba(0,0,0,0.6)');
      ctx.fillStyle = shade; ctx.fillRect(x, y0, sw, sh);
      ctx.restore();
      roundRect(ctx, x, y0, sw, sh, 12);
      let bc = isTemp ? '#5ef0ff' : '#d9a441', bw = 3;
      if (ready) { bc = `rgba(255,${200 + Math.round(55 * Math.sin(t * 9 - i * 0.6))},90,1)`; bw = 5; }
      if (cell && cell.fused) { bc = '#ffd24a'; bw = 5 + 4 * Math.abs(Math.sin(t * 8)); }
      else if (cell && cell.merge > 0) { bc = CAT[SYMBOLS[cell.id].cat].color; bw = 4 + 5 * cell.merge; }
      else if (cell && cell.flash > 0) { bc = '#ffffff'; bw = 3 + 3 * cell.flash; }
      ctx.lineWidth = bw; ctx.strokeStyle = bc; ctx.stroke();
      if (cell && !cell.consumed && cell.lvl > 1) {
        const bx = x + sw - 16, by = y0 + 16;
        roundRect(ctx, bx - 22, by - 11, 38, 22, 11); ctx.fillStyle = CAT[SYMBOLS[cell.id].cat].color; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = '#120b1c'; ctx.stroke();
        ctx.font = font(13); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#120b1c';
        ctx.fillText('Lv' + cell.lvl, bx - 3, by + 1);
      }
      if (isTemp) {
        const bx = x + sw - 13, by = y0 + sh - 13;
        ctx.fillStyle = '#0a3a48'; ART.circle(ctx, bx, by, 11); ctx.fill();
        ctx.strokeStyle = '#5ef0ff'; ctx.lineWidth = 2; ctx.stroke();
        ctx.font = font(13); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#bff8ff';
        ctx.fillText(String(R.tempLeft(i)), bx, by + 1);
      }
    }
    if (R.newSlotFx > 0) {
      ctx.save(); ctx.globalAlpha = R.newSlotFx; ctx.strokeStyle = '#5ef0ff'; ctx.lineWidth = 6;
      const k = 1 - R.newSlotFx;
      roundRect(ctx, P.x - 6 * k, P.y - 6 * k, P.w + 12 * k, P.h + 12 * k, 22); ctx.stroke();
      ctx.restore();
    }
  }

  // 릴블레이드 게이지
  drawGauge(ctx) {
    const g = this.g, p = g.player, G = this.gaugeRect, t = g.time;
    const k = clamp(g.gauge / BAL.gauge.max, 0, 1);
    const full = k >= 1, sealed = !!p.curses.seal;
    if (full) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.35 + 0.25 * Math.sin(t * 10);
      roundRect(ctx, G.x - 5, G.y - 5, G.w + 10, G.h + 10, 17); ctx.fillStyle = '#ffd84a'; ctx.fill(); ctx.restore();
    }
    roundRect(ctx, G.x, G.y, G.w, G.h, 12); ctx.fillStyle = '#0c0614'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = sealed ? '#9a4aff' : '#c99a3c'; ctx.stroke();
    if (k > 0) {
      ctx.save();
      roundRect(ctx, G.x + 4, G.y + 4, G.w - 8, G.h - 8, 8); ctx.clip();
      const fw = (G.w - 8) * k;
      const fg = ctx.createLinearGradient(G.x, 0, G.x + G.w, 0);
      if (sealed) { fg.addColorStop(0, '#5a2a8a'); fg.addColorStop(1, '#3a1a5a'); }
      else if (full) { fg.addColorStop(0, '#ffe27a'); fg.addColorStop(1, '#ffb02a'); }
      else { fg.addColorStop(0, '#36e0ff'); fg.addColorStop(1, '#7a8aff'); }
      ctx.fillStyle = fg; ctx.fillRect(G.x + 4, G.y + 4, fw, G.h - 8);
      const sx = G.x + ((t * 420) % (G.w + 200)) - 100;
      const shine = ctx.createLinearGradient(sx - 40, 0, sx + 40, 0);
      shine.addColorStop(0, 'rgba(255,255,255,0)'); shine.addColorStop(0.5, 'rgba(255,255,255,0.4)'); shine.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = shine; ctx.fillRect(G.x + 4, G.y + 4, fw, G.h - 8);
      ctx.restore();
    }
    ctx.font = font(14); ctx.textBaseline = 'middle';
    ctx.textAlign = 'left'; textOutlined(ctx, '릴블레이드', G.x + 12, G.y + G.h / 2 + 1, '#ffe7a8', '#120b1c', 4);
    ctx.textAlign = 'right';
    const label = sealed ? '봉인됨' : full ? 'CHARGED! 적을 베면 릴 등장' : Math.floor(k * 100) + '%';
    textOutlined(ctx, label, G.x + G.w - 12, G.y + G.h / 2 + 1, full ? '#ffffff' : sealed ? '#d8a8ff' : '#e8dcff', '#120b1c', 4);
  }

  drawStatus(ctx) {
    const g = this.g, p = g.player, W = this.W;
    const H = this.hpRect;
    ART.glyph(ctx, 'heart', H.x - 22, H.y + H.h / 2, 30);
    roundRect(ctx, H.x, H.y, H.w, H.h, 9); ctx.fillStyle = '#0c0614'; ctx.fill(); ctx.strokeStyle = '#5a2030'; ctx.lineWidth = 2; ctx.stroke();
    const hk = clamp(p.hp / p.maxHp, 0, 1);
    if (hk > 0) {
      roundRect(ctx, H.x + 2, H.y + 2, (H.w - 4) * hk, H.h - 4, 7);
      const hg = ctx.createLinearGradient(0, H.y, 0, H.y + H.h); hg.addColorStop(0, '#ff7a8a'); hg.addColorStop(1, '#d42a46');
      ctx.fillStyle = hg; ctx.fill();
    }
    if (p.shield > 0) {
      roundRect(ctx, H.x + 2, H.y + 2, (H.w - 4) * clamp(p.shield / p.maxHp, 0, 1), 6, 3); ctx.fillStyle = '#8fd4ff'; ctx.fill();
    }
    ctx.font = font(13); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    textOutlined(ctx, `${Math.ceil(p.hp)} / ${p.maxHp}`, H.x + H.w / 2, H.y + H.h / 2 + 1, '#fff', '#120b1c', 3);

    const buffs = [];
    for (const id in p.curses) { const c = p.curses[id]; buffs.push({ img: ART.curseIcon(id), ratio: c.t / c.max, label: CURSES[id].name, curse: true }); }
    if (p.rage > 0) buffs.push({ glyph: 'flame', bg: '#ff7a1a', ratio: p.rage / (BAL.player.parryBuffTime + p.mods.rageTime), label: '반격' });
    for (const id in p.fusions) { const f = p.fusions[id]; buffs.push({ img: ART.symbolIcon(id), ratio: f.max ? 1 - f.t / f.max : 1, label: 'Lv' + f.lvl }); }
    for (const id in p.abilities) { const a = p.abilities[id]; buffs.push({ img: ART.symbolIcon(id), ratio: a.t / a.max, label: a.lvl > 1 ? 'Lv' + a.lvl : '' }); }
    for (const h of g.heroes) if (h.alive) buffs.push({ img: ART.symbolIcon(h.type), ratio: h.permanent ? 1 : h.life / h.maxLife, label: h.lvl > 1 ? '★' + h.lvl : '' });
    if (p.shield > 0) buffs.push({ img: ART.symbolIcon('shield'), ratio: p.shieldT / 12, label: String(Math.ceil(p.shield)) });
    let bx = H.x + H.w + 16;
    const by = 224, bs = 32;
    for (const b of buffs) {
      if (bx + bs > W - 8) break;
      if (b.img) ctx.drawImage(b.img, bx, by, bs, bs);
      else { roundRect(ctx, bx, by, bs, bs, 8); ctx.fillStyle = b.bg; ctx.fill(); ART.glyph(ctx, b.glyph, bx + bs / 2, by + bs / 2, bs * 0.8); }
      ctx.save(); roundRect(ctx, bx, by, bs, bs, 8); ctx.clip();
      ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.beginPath(); ctx.moveTo(bx + bs / 2, by + bs / 2);
      ctx.arc(bx + bs / 2, by + bs / 2, bs, -Math.PI / 2 + TAU * clamp(b.ratio, 0, 1), -Math.PI / 2 + TAU); ctx.closePath(); ctx.fill();
      ctx.restore();
      if (b.curse) { roundRect(ctx, bx, by, bs, bs, 8); ctx.lineWidth = 2; ctx.strokeStyle = '#c86aff'; ctx.stroke(); }
      if (b.label) { ctx.font = font(11); ctx.textAlign = 'center'; textOutlined(ctx, b.label, bx + bs / 2, by + bs + 9, b.curse ? '#e0b0ff' : '#fff', '#120b1c', 3); }
      bx += bs + 6;
    }
  }

  drawFlyers(ctx) {
    for (const f of this.flyers) {
      const tg = f.tgt();
      const k = f.delay > 0 ? 0 : Ease.inQuad(clamp(f.t / f.life, 0, 1));
      const x = (1 - k) * (1 - k) * f.sx + 2 * (1 - k) * k * f.cx + k * k * tg.x;
      const y = (1 - k) * (1 - k) * f.sy + 2 * (1 - k) * k * f.cy + k * k * tg.y;
      const s = lerp(f.size, f.endSize, k);
      if (k > 0) {
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        const gr = ctx.createRadialGradient(x, y, 0, x, y, s * 0.9);
        gr.addColorStop(0, `rgba(${f.glow},0.7)`); gr.addColorStop(1, `rgba(${f.glow},0)`);
        ctx.fillStyle = gr; ART.circle(ctx, x, y, s * 0.9); ctx.fill(); ctx.restore();
      }
      if (f.img) ctx.drawImage(f.img, x - s / 2, y - s / 2, s, s);
      else ART.glyph(ctx, f.glyph, x, y, s);
    }
  }

  drawBossBar(ctx) {
    const b = this.g.enemies.find((e) => e.boss && e.state !== 'spawn');
    if (!b) return;
    const W = this.W, y = this.FT + 18, w = W - 140, x = 70;
    ctx.font = font(16); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    textOutlined(ctx, b.def.name, W / 2, y, '#ffb0a0', '#120b1c', 4);
    roundRect(ctx, x, y + 12, w, 14, 7); ctx.fillStyle = 'rgba(10,4,8,0.85)'; ctx.fill(); ctx.strokeStyle = '#ff6a5a'; ctx.lineWidth = 2; ctx.stroke();
    roundRect(ctx, x + 2, y + 14, (w - 4) * clamp(b.hp / b.maxHp, 0, 1), 10, 5); ctx.fillStyle = b.stun > 0 ? '#ffd24a' : '#e8384f'; ctx.fill();
  }

  drawBanners(ctx) {
    let y = this.FT + 70;
    for (const b of this.banners) {
      const k = b.t / b.life;
      const a = k < 0.8 ? 1 : 1 - (k - 0.8) / 0.2;
      const sc = b.t < 0.15 ? 0.6 + 0.4 * Ease.outBack(b.t / 0.15) : 1;
      ctx.save(); ctx.globalAlpha = a; ctx.translate(this.W / 2, y); ctx.scale(sc, sc);
      ctx.font = font(b.size); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      if (b.big) {
        const w = ctx.measureText(b.text).width + 60;
        ctx.fillStyle = 'rgba(20,8,30,0.7)'; roundRect(ctx, -w / 2, -b.size * 0.75, w, b.size * 1.5, b.size * 0.5); ctx.fill();
        textOutlined(ctx, b.text, 0, 2, `hsl(${(this.g.time * 400) % 360},100%,70%)`, '#120b1c', 7);
      } else {
        textOutlined(ctx, b.text, 0, 0, b.color, '#120b1c', 6);

  drawControls(ctx) {
    const g = this.g, p = g.player, A = this.atkBtn, t = g.time;
    const mode = g.actionMode();
    const parry = mode === 'parry';
    const dashOk = !parry && !!p.dashCandidate(g);
    const s = this.pressAnim > 0 ? 0.92 : 1;
    ctx.save(); ctx.translate(A.x, A.y); ctx.scale(s, s);
    if (parry && g.parryThreat) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(255,240,170,0.9)'; ctx.lineWidth = 6;
      ART.circle(ctx, 0, 0, A.r + 10 + 10 * Math.abs(Math.sin(t * 18))); ctx.stroke();
      ctx.restore();
    }
    const parryLocked = parry && p.parryCD > 0 && !p.parryPending && p.parryCDMax > BAL.player.parryCooldown;
    if ((!parry && !dashOk) || parryLocked) ctx.globalAlpha = 0.55;
    ART.circle(ctx, 0, 6, A.r); ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill();
    ART.circle(ctx, 0, 0, A.r);
    const bg = ctx.createRadialGradient(-A.r * 0.3, -A.r * 0.4, 6, 0, 0, A.r);
    if (parry) { bg.addColorStop(0, '#fff3b8'); bg.addColorStop(0.55, '#f2b632'); bg.addColorStop(1, '#a8640c'); }
    else if (dashOk) { bg.addColorStop(0, '#d8fbff'); bg.addColorStop(0.55, '#2ab4e0'); bg.addColorStop(1, '#0a4a78'); }
    else { bg.addColorStop(0, '#9aa6b8'); bg.addColorStop(0.55, '#4a5568'); bg.addColorStop(1, '#232a36'); }
    ctx.fillStyle = bg; ctx.fill();
    ctx.lineWidth = 5; ctx.strokeStyle = '#1a0f22'; ctx.stroke();
    ART.circle(ctx, 0, 0, A.r - 8); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.stroke();
    ART.glyph(ctx, parry ? 'shield' : 'dash', 0, -12, A.r * (parry ? 0.95 : 0.9));
    ctx.font = font(24); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    textOutlined(ctx, parry ? '패링' : '대시', 0, A.r * 0.55, '#ffffff', '#1a0f22', 5);
    const cd = parry ? p.parryCD / p.parryCDMax : 0;
    if (cd > 0) {
      ctx.fillStyle = 'rgba(20,10,30,0.6)';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, A.r, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(cd, 0, 1)); ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (parryLocked) {
      // 패링 실패 쿨타임: 남은 초 표시
      ctx.font = font(44); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      textOutlined(ctx, Math.ceil(p.parryCD).toString(), 0, -6, '#ffffff', '#1a0f22', 7);
    }
    if (this.parryFlash > 0) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = this.parryFlash / 0.4;
      ctx.fillStyle = '#fff'; ART.circle(ctx, 0, 0, A.r); ctx.fill(); ctx.restore();
    }
    ctx.restore();
    if (p.rage > 0) {
      ctx.font = font(16); ctx.textAlign = 'center';
      textOutlined(ctx, `반격 ${p.rage.toFixed(1)}s`, A.x, A.y - A.r - 16, '#ffb347', '#1a0f22', 4);
    }

    for (let i = 0; i < 2; i++) {
      const B = this.skillBtns[i], sk = p.skills[i];
      const sc = this.skillPress[i] > 0 ? 0.9 : 1;
      ctx.save(); ctx.translate(B.x, B.y); ctx.scale(sc, sc);
      ART.circle(ctx, 0, 4, B.r); ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill();
      ART.circle(ctx, 0, 0, B.r);
      ctx.fillStyle = sk ? '#1a2a48' : 'rgba(20,14,34,0.55)'; ctx.fill();
      ctx.lineWidth = 4; ctx.strokeStyle = sk ? '#47b4ff' : 'rgba(255,255,255,0.2)'; ctx.stroke();
      if (sk) {
        ctx.save(); ART.circle(ctx, 0, 0, B.r - 5); ctx.clip();
        const s = B.r * 1.7;
        ctx.drawImage(ART.symbolIcon(sk.id), -s / 2, -s / 2, s, s);
        ctx.restore();
        ART.circle(ctx, B.r * 0.68, -B.r * 0.68, 15); ctx.fillStyle = '#ffd24a'; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = '#1a0f22'; ctx.stroke();
        ctx.font = font(15); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#1a0f22';
        ctx.fillText('x' + sk.charges, B.r * 0.68, -B.r * 0.68 + 1);
      } else {
        ctx.font = font(15); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.fillText('스킬', 0, 0);
      }
      ctx.restore();
    }
    this.drawReelButton(ctx);
    this.drawAutoButton(ctx);
  }

  drawAutoButton(ctx) {
    const g = this.g, B = this.autoBtn, t = g.time, on = g.autoMode;
    ctx.save(); ctx.translate(B.x, B.y);
    if (on) {
      ctx.save(); ctx.strokeStyle = '#7dff9a'; ctx.lineWidth = 4;

  // 왼쪽 하단 릴 버튼: 보유 코인으로 돌릴 수 있는 칸을 모두 회전

      ctx.restore();
    } else ctx.globalAlpha = 0.6;

    ctx.font = font(18); ctx.fillStyle = '#1a0f22'; ctx.fillText('x' + coins, bx, by + 1);
    ctx.restore();
  }

  drawJoystick(ctx) {
    const j = this.g.input.joy;
    if (!j.active) return;
    const R = 80;
    ctx.save();
    ART.circle(ctx, j.ox, j.oy, R); ctx.fillStyle = 'rgba(255,255,255,0.07)'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; ART.circle(ctx, j.ox + Math.cos(a) * (R - 12), j.oy + Math.sin(a) * (R - 12), 3); ctx.fill(); }
    let dx = j.x - j.ox, dy = j.y - j.oy; const d = Math.hypot(dx, dy);
    if (d > R) { dx = dx / d * R; dy = dy / d * R; }
    ART.circle(ctx, j.ox + dx, j.oy + dy, 34); ctx.fillStyle = j.moved ? 'rgba(120,230,255,0.45)' : 'rgba(255,255,255,0.3)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.stroke();
    ctx.restore();
  }

  drawHint(ctx) {
    const a = Math.min(1, this.hintT / 0.4);
    ctx.save(); ctx.globalAlpha = a;
    ctx.font = font(22); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const w = ctx.measureText(this.hint).width + 40, y = this.H - 430;
    roundRect(ctx, this.W / 2 - w / 2, y - 24, w, 48, 24); ctx.fillStyle = 'rgba(10,6,20,0.75)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,220,140,0.6)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#ffe9b0'; ctx.fillText(this.hint, this.W / 2, y + 1);
    ctx.restore();
  }

  drawLevelUp(ctx) {
    const g = this.g, W = this.W, H = this.H, t = g.time;
    ctx.fillStyle = 'rgba(6,3,14,0.78)'; ctx.fillRect(0, 0, W, H);
    const ty = H / 2 - 280;
    ctx.save(); ctx.translate(W / 2, ty);
    const sc = 0.8 + 0.2 * Ease.outBack(clamp(this.cardT / 0.3, 0, 1));
    ctx.scale(sc, sc);
    ctx.font = font(56); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    textOutlined(ctx, 'LEVEL UP!', 0, 0, '#ffd24a', '#2a1200', 9);
    ctx.font = font(22); ctx.fillStyle = '#e8dcff'; ctx.fillText(`Lv.${g.level}  ·  성장 카드를 선택하세요`, 0, 52);
    ctx.restore();
    const cw = 208, ch = 320, gap = 12;
    const total = 3 * cw + 2 * gap;
    const x0 = (W - total) / 2, y = H / 2 - ch / 2 + 30;
    this.cardRects = [];
    (g.cards || []).forEach((c, i) => {
      const x = x0 + i * (cw + gap);
      this.cardRects.push({ x, y, w: cw, h: ch });
      const a = clamp((this.cardT - 0.1 - i * 0.08) / 0.3, 0, 1);
      if (a <= 0) return;
      ctx.save();
      ctx.translate(x + cw / 2, y + ch / 2);
      const s = Ease.outBack(a); ctx.scale(s, s);
      ctx.translate(-cw / 2, -ch / 2);
      if (c.rare) {
        ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.5 + 0.3 * Math.sin(t * 6);
        roundRect(ctx, -8, -8, cw + 16, ch + 16, 24); ctx.fillStyle = '#3ad8ff'; ctx.fill(); ctx.restore();
      }
      roundRect(ctx, 0, 0, cw, ch, 18);
      const bg = ctx.createLinearGradient(0, 0, 0, ch); bg.addColorStop(0, c.rare ? '#173a55' : '#33244d'); bg.addColorStop(1, '#140c22');
      ctx.fillStyle = bg; ctx.fill();
      ctx.lineWidth = 4; ctx.strokeStyle = c.rare ? '#5ef0ff' : '#d9a441'; ctx.stroke();
      const tag = c.rare ? 'REEL' : c.tag ? '릴 ' + c.tag : '';
      if (tag) {
        const tc = c.rare ? '#5ef0ff' : { 추가: '#7dff9a', 제거: '#ff8a8a', 강화: '#ffd24a', 황금: '#ffd24a' }[c.tag];
        roundRect(ctx, cw / 2 - 46, -12, 92, 24, 12); ctx.fillStyle = tc; ctx.fill();
        ctx.font = font(14); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#120b1c'; ctx.fillText(tag, cw / 2, 1);
      }
      ART.circle(ctx, cw / 2, 90, 56); ctx.fillStyle = '#0d0818'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.stroke();
      if (c.sym) {
        ctx.drawImage(ART.symbolIcon(c.sym), cw / 2 - 44, 46, 88, 88);
        if (c.tag === '제거') { ctx.font = font(64); textOutlined(ctx, '✕', cw / 2, 92, '#ff6a6a', '#1a0008', 7); }
        else if (c.tag === '추가') { ctx.font = font(40); textOutlined(ctx, '+', cw / 2 + 40, 54, '#7dff9a', '#062010', 6); }
        else if (c.tag === '강화') { ctx.font = font(34); textOutlined(ctx, '▲', cw / 2 + 40, 56, '#ffd24a', '#2a1200', 6); }
      } else ART.glyph(ctx, c.glyph, cw / 2, 90, 80);
      ctx.font = font(24); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      textOutlined(ctx, c.name, cw / 2, 178, '#ffffff', '#120b1c', 5);
      ctx.font = font(18, '600'); ctx.fillStyle = '#d6cdf0';
      c.desc().split('\n').forEach((ln, k) => ctx.fillText(ln, cw / 2, 220 + k * 28));
      ctx.font = font(14); ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillText(`터치하여 선택  [${i + 1}]`, cw / 2, ch - 22);
      ctx.restore();
    });
    this.drawDeck(ctx, y + ch + 34);
  }

  // 내 릴 덱 + 합성 레시피 (레벨업·일시 정지 화면)
  drawDeck(ctx, y) {
    const g = this.g, R = g.preel, W = this.W, p = g.player;
    const bx = 24, bw = W - 48, bh = 176;
    roundRect(ctx, bx, y, bw, bh, 16); ctx.fillStyle = 'rgba(20,12,34,0.92)'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(217,164,65,0.6)'; ctx.stroke();
    ctx.font = font(16); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    textOutlined(ctx, `내 릴 덱 ${R.deck.length}/${BAL.deck.max}`, bx + 16, y + 20, '#ffd24a', '#120b1c', 4);
    ctx.font = font(13, '600'); ctx.fillStyle = '#a89cc8'; ctx.textAlign = 'right';
    ctx.fillText('덱이 좁을수록 합체·합성 확률 ↑', bx + bw - 16, y + 20);
    const s = 42, gap = 6, n = R.deck.length;
    let x = bx + (bw - (n * s + (n - 1) * gap)) / 2;
    for (const id of R.deck) {
      ctx.drawImage(ART.symbolIcon(id), x, y + 38, s, s);
      const b = R.boost[id] || 0;
      if (b) { ctx.font = font(12); ctx.textAlign = 'center'; textOutlined(ctx, '+' + b, x + s - 6, y + 42, '#ffd24a', '#120b1c', 3); }
      x += s + gap;
    }
    // 레시피: 두 재료가 덱에 있으면 밝게, 이번 판에 만든 건 금색 테두리
    const rs = 30, gw = rs * 3 + 34, rgap = 10;
    let rx = bx + (bw - (RECIPES.length * gw + (RECIPES.length - 1) * rgap)) / 2;
    const ry = y + 104;
    ctx.font = font(13, '600'); ctx.textAlign = 'left'; ctx.fillStyle = '#a89cc8'; ctx.fillText('합성 레시피 (이웃한 칸)', bx + 16, ry - 8);
    for (const rc of RECIPES) {
      const ok = R.deck.includes(rc.a) && R.deck.includes(rc.b);
      const got = g.fusionsGot[rc.out] || p.fusions[rc.out] || g.heroes.some((h) => h.alive && h.type === rc.out);
      ctx.globalAlpha = ok ? 1 : 0.35;
      ctx.drawImage(ART.symbolIcon(rc.a), rx, ry + 8, rs, rs);
      ctx.drawImage(ART.symbolIcon(rc.b), rx + rs + 2, ry + 8, rs, rs);
      ctx.font = font(16); ctx.textAlign = 'center'; ctx.fillStyle = '#ffe9b0'; ctx.fillText('→', rx + rs * 2 + 14, ry + 8 + rs / 2);
      ctx.drawImage(ART.symbolIcon(rc.out), rx + rs * 2 + 26, ry + 4, rs + 8, rs + 8);
      if (got) { roundRect(ctx, rx + rs * 2 + 24, ry + 2, rs + 12, rs + 12, 8); ctx.lineWidth = 3; ctx.strokeStyle = '#ffd24a'; ctx.stroke(); }
      ctx.globalAlpha = 1;
      ctx.font = font(11, '600'); ctx.textAlign = 'center'; ctx.fillStyle = ok ? '#e8dcff' : '#7a7090';
      ctx.fillText(SYMBOLS[rc.out].name, rx + rs * 2 + 30 + rs / 2, ry + rs + 24);
      rx += gw + rgap;
    }
  }

    textOutlined(ctx, 'REEL', 0, -10, lg, '#1a0a00', 12);
