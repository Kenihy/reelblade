    ctx.restore();
    ctx.font = font(22); ctx.textAlign = 'center'; ctx.fillStyle = '#cbbfe6';
    ctx.fillText('릴블레이드', W / 2, cy + 262);

    const lines = [
      ['드래그', '8방향 이동'],
      ['자동 공격', '적이 가까이 오면 자동으로 공격'],
      ['대시', '근처 적에게 돌진 베기'],
      ['패링', '적이 ✦ 반짝일 때! 성공 시 몬스터 릴'],
      ['릴블레이드', '게이지가 차면 다음 타격에 몬스터 릴'],
      ['코인', '반짝이는 릴 칸 터치 · 왼쪽 아래 릴 버튼은 전부 회전'],
      ['합체', '같은 릴이 연속 → 왼쪽 강화 + 재회전'],
      ['피버', '코인을 모아 한 번에 돌리면 합체 확률 ↑'],
      ['합성', '이웃한 레시피 조합 → 합성 (판 끝까지)'],
      ['챕터', '10분 생존 + 최종 보스 처치 = 클리어'],
    ];
    const bx = 40, by = H * 0.5, bw = W - 80, bh = lines.length * 44 + 24;
    roundRect(ctx, bx, by, bw, bh, 18); ctx.fillStyle = 'rgba(15,8,28,0.85)'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(217,164,65,0.6)'; ctx.stroke();
    lines.forEach(([k, v], i) => {
      const y = by + 34 + i * 44;
      ctx.textAlign = 'left'; ctx.font = font(19); ctx.fillStyle = '#ffd24a'; ctx.fillText(k, bx + 24, y);
      ctx.font = font(18, '600'); ctx.fillStyle = '#ece6ff'; ctx.fillText(v, bx + 150, y);
    });
    ctx.font = font(16, '600'); ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.fillText('PC: WASD 이동 · Space 대시/패링 · 1,2 스킬 · E 릴 · Q 자동 · Esc 멈춤', W / 2, by + bh + 28);
    ctx.globalAlpha = 0.55 + 0.45 * Math.sin(t * 4);
    ctx.font = font(32); textOutlined(ctx, '화면을 터치하여 시작', W / 2, Math.min(H - 60, by + bh + 100), '#ffffff', '#120b1c', 6);
    ctx.globalAlpha = 1;
  }

  drawGameOver(ctx) {
    const g = this.g, W = this.W, H = this.H, t = g.time;
    const a = clamp(g.overT / 0.6, 0, 1);
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(14,2,8,0.8)'; ctx.fillRect(0, 0, W, H);
    ctx.font = font(64, '900'); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    textOutlined(ctx, 'GAME OVER', W / 2, H * 0.3, '#ff5a6a', '#1a0008', 10);
    const stats = [
      ['생존 시간', fmtTime(g.elapsed)], ['레벨', String(g.level)], ['처치', String(g.kills)],
      ['패링 성공', String(g.parries)], ['몬스터 릴', String(g.monsterReels)],
      ['릴 합체', String(g.preel.merges)], ['피버 스핀', String(g.preel.fevers)], ['합성', String(g.preel.fusions)],
    ];
    const bw = 420, bx = W / 2 - bw / 2, by = H * 0.37;
    roundRect(ctx, bx, by, bw, stats.length * 48 + 24, 18); ctx.fillStyle = 'rgba(20,10,30,0.9)'; ctx.fill(); ctx.strokeStyle = '#d9a441'; ctx.lineWidth = 2; ctx.stroke();
    stats.forEach(([k, v], i) => {
      const y = by + 36 + i * 48;
      ctx.font = font(22, '600'); ctx.textAlign = 'left'; ctx.fillStyle = '#cbbfe6'; ctx.fillText(k, bx + 30, y);
      ctx.font = font(26); ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.fillText(v, bx + bw - 30, y);
    });
    if (g.overT > 0.8) {
      ctx.globalAlpha = 0.55 + 0.45 * Math.sin(t * 4);
      ctx.font = font(30); ctx.textAlign = 'center';
      textOutlined(ctx, '터치하여 다시 시작', W / 2, by + stats.length * 48 + 90, '#ffffff', '#120b1c', 6);
    }
    ctx.restore();
  }
}

</script>
<script>/* game.js */
'use strict';
// 게임 본체: 상태 관리, 월드, 스폰, 전투 처리, 렌더링

class Game {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.W = 720; this.H = 1280;
    this.ui = new UI(this);
    this.input = new Input(this);
    ART.init();
    window.addEventListener('resize', () => this.resize());
    this.resize();
    this.reset();
    this.state = 'title';
    this.time = 0;
    this.autoMode = false;
    try { this.autoMode = localStorage.getItem('reelblade.auto') === '1'; } catch (err) { /* 저장 불가 환경 */ }
    this.last = performance.now();
    requestAnimationFrame((t) => this.frame(t));
  }

  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const iw = window.innerWidth, ih = window.innerHeight;
    const W = 720;
    const aspect = ih / iw;
    const H = aspect >= 16 / 9 ? Math.round(W * Math.min(aspect, 2.4)) : 1280;
    const scale = Math.min(iw / W, ih / H);
    const cw = W * scale, ch = H * scale;
    const c = this.canvas;
    c.style.left = (iw - cw) / 2 + 'px'; c.style.top = (ih - ch) / 2 + 'px';
    c.style.width = cw + 'px'; c.style.height = ch + 'px';
    c.width = Math.round(cw * dpr); c.height = Math.round(ch * dpr);
    this.W = W; this.H = H;
    this.pxRatio = c.width / W;
    this.pattern = null;
    this.ui.layout(W, H);
  }

  toLogical(clientX, clientY) {
    const r = this.canvas.getBoundingClientRect();
    return { x: (clientX - r.left) / r.width * this.W, y: (clientY - r.top) / r.height * this.H };
  }

  // 필드(HUD 아래) 영역
  get fieldTop() { return BAL.field.top; }
  get fieldCY() { return this.fieldTop + (this.H - this.fieldTop) * 0.47; }

  toScreen(x, y) { return { x: x - this.cam.x, y: y - this.cam.y }; }

  reset() {
    this.elapsed = 0; this.kills = 0; this.parries = 0; this.monsterReels = 0;
    this.level = 1; this.exp = 0; this.pendingLv = 0;
    this.gauge = 0;
    this.world = this.makeWorld();
    this.player = new Player(this.world.w / 2, this.world.h / 2);
    this.enemies = []; this.heroes = []; this.projectiles = []; this.reels = [];
    this.fx = new FX();
    this.preel = new PlayerReel(this);
    this.cam = { x: 0, y: 0 };
    this.updateCamera();
    this.shakeT = 0; this.shakeMag = 0;
    this.slowmo = 0;
    this.flash = 0; this.flashColor = '255,255,255';
    this.hurtV = 0;
    this.spawnT = 1.2;
    this.waveIdx = 0; this.midBossDone = false; this.finalBoss = null;
    this.arena = null;        // 최종 보스 아레나 { x, y, r, t }
    this.pickups = [];        // 바닥에 흘린 코인
    this.respawns = [];       // 쓰러진 합성 영웅 부활 대기
    this.fusionsGot = {};     // 이번 판에 만든 합성 심볼 (처음 만들면 크게 알림)
    this.cards = null;
    this.deathT = 0; this.overT = 0; this.clearT = 0; this.clearDelay = 0;
    this.parryThreat = false; this.threatAny = false; this.parryHintShown = false; this.gaugeHintShown = false; this.coinHintShown = false;
    this.feverHintShown = false; this.dropHintShown = false;
    this.input.reset();
    this.ui.banners = []; this.ui.flyers = [];
  }

  start() {
    this.reset();
    this.state = 'play';
    for (let i = 0; i < 5; i++) {
      const a = rand(0, TAU), r = rand(280, 420);
      this.spawnEnemy(i === 4 ? 'goblin' : 'slime', this.player.x + Math.cos(a) * r, this.player.y + Math.sin(a) * r);
    }
    this.ui.showHint('적에게 다가가면 자동 공격! 대시 버튼으로 돌진', 5);
  }

  // 자동 모드 on/off (기기별로 기억)
  toggleAuto() {
    this.autoMode = !this.autoMode;
    try { localStorage.setItem('reelblade.auto', this.autoMode ? '1' : '0'); } catch (err) { /* 저장 불가 환경 */ }
    this.ui.banner(this.autoMode ? '자동 전투 ON' : '자동 전투 OFF', this.autoMode ? '#7dff9a' : '#cfd8e6', 28, 1.2);
    SFX.click();
  }

  // 대시 타격: 몬스터 뒤쪽(ang 방향)으로 터지는 관통 이펙트
  dashBurst(e, ang, crit) {
    const charged = this.gauge >= BAL.gauge.max;
    const col = charged ? '#ffe27a' : crit ? '#ffd04a' : '#8ff6ff';
    const bx = e.x + Math.cos(ang) * e.r * 0.7, by = e.y + Math.sin(ang) * e.r * 0.7;
    const len = (crit ? 190 : 150) + e.r * 1.5;
    this.fx.pierce(bx, by, ang, len, col, crit ? 38 : 30);
    for (let i = 0; i < (crit ? 18 : 12); i++) {
      const a = ang + rand(-0.45, 0.45), s = rand(320, 760);
      this.fx.particle(bx, by, { vx: Math.cos(a) * s, vy: Math.sin(a) * s * 0.75, vz: rand(40, 220), z: 30, g: 500, drag: 4,
        life: rand(0.25, 0.45), size: rand(3, 6), color: i % 3 ? col : '#ffffff', glow: true });
    }
    this.fx.ring(bx + Math.cos(ang) * 24, by + Math.sin(ang) * 24, 6, 46 + e.r * 0.5, 0.25, col, 5, true);
  }

  // 잠시 멈춤
  pause() {
    if (this.state !== 'play') return;
    this.state = 'paused'; this.input.reset(); this.ui.pauseT = 0;
    SFX.click();
  }

  resume() {
    if (this.state !== 'paused') return;
    this.state = 'play'; this.input.reset();
    SFX.click();
  }

  onTap() {
    if (this.state === 'title') { SFX.click(); this.start(); }
    else if (this.state === 'over' && this.overT > 0.8) { SFX.click(); this.start(); }
    else if (this.state === 'clear' && this.clearT > 1.2) { SFX.click(); this.start(); }
  }

  // ---------------------------------------------------------------- 월드
  makeWorld() {
    const W = BAL.world.w, H = BAL.world.h;
    const props = [], decals = [];
    const cx = W / 2, cy = H / 2;
    const free = (x, y, r) => dist2(x, y, cx, cy) > 200 * 200 && props.every((p) => dist2(p.x, p.y, x, y) > (p.r + r + 50) ** 2);
    const place = (n, make) => {
      for (let i = 0; i < n; i++) {
        for (let tries = 0; tries < 30; tries++) {
          const x = rand(80, W - 80), y = rand(90, H - 80);
          const p = make(x, y);
          if (free(x, y, p.r)) { props.push(p); break; }
        }
      }
    };
    // 필드 오브젝트 3종 (모두 캐릭터 허리 높이 이하)
    place(26, (x, y) => {
      const r = rand(14, 22), pts = [];
      for (let i = 0; i < 7; i++) { const a = i / 7 * TAU; const rr = r * rand(0.82, 1.12); pts.push([Math.cos(a) * rr, Math.sin(a) * rr * 0.6 - r * 0.3]); }
      return { kind: 'rock', x, y, r, pts, solid: true };
    });
    place(16, (x, y) => ({ kind: 'stump', x, y, r: 18, solid: true }));
    place(34, (x, y) => ({ kind: 'bush', x, y, r: 16, solid: false, berry: Math.random() < 0.3 }));
    const flowerCols = ['#ffffff', '#ffd1e8', '#ffe66a', '#b8a8ff', '#ff8a8a'];
    for (let i = 0; i < 300; i++) decals.push({ kind: Math.random() < 0.6 ? 'flower' : 'tuft', x: rand(20, W - 20), y: rand(20, H - 20), color: pick(flowerCols) });
    return { w: W, h: H, props, decals };
  }

  // ---------------------------------------------------------------- 루프
  frame(ts) {
    // 다음 프레임을 먼저 예약: 한 프레임에서 오류가 나도 게임 루프가 멈추지 않음
    requestAnimationFrame((t) => this.frame(t));
    // PC 크롬은 첫 프레임 시각이 생성 시각보다 이를 수 있어 음수가 되지 않게 0~0.05초로 제한
    const dt = clamp((ts - this.last) / 1000, 0, 0.05);
    this.last = ts;
    try {
      this.update(dt);
      this.render();
    } catch (err) {
      if (!this.loggedErr) { this.loggedErr = true; console.error('[ReelBlade] frame error', err); }
    }
  }

  update(dt) {
    this.time += dt;
    if (this.state === 'paused') { this.ui.pauseT += dt; return; } // 멈춤 중엔 연출 포함 전부 정지
    this.ui.update(dt);
    if (this.state === 'title') { this.updateCamera(); return; }
    if (this.state === 'levelup') return;
    if (this.state === 'over') { this.overT += dt; this.fx.update(dt * 0.5); return; }
    if (this.state === 'clear') { this.clearT += dt; this.fx.update(dt * 0.5); return; }

    // 패링 성공 시 1초간 게임 전체 슬로우
    let sdt = dt;
    if (this.slowmo > 0) { this.slowmo -= dt; sdt = dt * BAL.player.parrySlowScale; }
    this.elapsed += sdt;
    this.flash = Math.max(0, this.flash - dt);
    this.hurtV = Math.max(0, this.hurtV - dt * 1.5);
    this.shakeT = Math.max(0, this.shakeT - dt);

    this.input.update();
    const p = this.player;
    if (!p.dead && !p.curses.seal) this.addGauge(BAL.gauge.perSec * sdt);
    p.update(sdt, this);
    for (const e of this.enemies) if (e.alive) e.update(sdt, this);
    for (const h of this.heroes) if (h.alive) h.update(sdt, this);
    for (const pr of this.projectiles) if (pr.alive) pr.update(sdt, this);
    for (const r of this.reels) if (r.alive) r.update(sdt);
    this.resolveCollisions();
    this.enemies = this.enemies.filter((e) => e.alive);
    this.heroes = this.heroes.filter((h) => h.alive);
    this.projectiles = this.projectiles.filter((pr) => pr.alive);
    this.reels = this.reels.filter((r) => r.alive);
    this.fx.update(sdt);
    this.preel.update(sdt);
    this.updatePickups(sdt);
    this.updateFusions(sdt);
    if (!p.dead && !this.clearDelay) this.updateSpawner(sdt);
    if (this.arena) this.arena.t += dt;
    this.updateCamera();

    // 특수기 위협 감지 (버튼이 패링으로 전환 / 반짝임 구간 강조)
    this.parryThreat = false; this.threatAny = false;
    for (const e of this.enemies) {
      if (e.state !== 'special') continue;
      if (e.inSpecialZone(p.x, p.y, p.r, 60)) {
        this.threatAny = true;
        if (e.t <= SPARKLE_TIME) this.parryThreat = true;
      }
    }
    if (this.parryThreat && !this.parryHintShown) {
      this.parryHintShown = true;
      this.ui.showHint('✦ 반짝일 때 패링! 성공하면 몬스터 릴', 3.5);
    }
    if (!this.feverHintShown && this.preel.feverSurplus() > 0) {
      this.feverHintShown = true;
      this.ui.showHint('피버 준비! 릴 버튼으로 한 번에 돌리면 합체 확률 ↑', 4);
    }
    if (this.gauge >= BAL.gauge.max && !this.gaugeHintShown) {
      this.gaugeHintShown = true;
      this.ui.showHint('릴블레이드 충전 완료! 적을 베면 릴 등장', 3.5);
    }

    if (p.dead) {
      this.deathT -= dt;
      if (this.deathT <= 0) { this.state = 'over'; this.overT = 0; this.input.reset(); }
    } else if (this.clearDelay > 0) {
      // 최종 보스 처치 → 잠깐 연출 후 클리어 화면
      this.clearDelay -= dt;
      if (this.clearDelay <= 0) { this.clearDelay = 0; this.state = 'clear'; this.clearT = 0; this.input.reset(); SFX.levelup(); }
    } else if (this.pendingLv > 0 && !this.reelFxBusy()) {
      this.openLevelUp();
    }
  }

  // 플레이어 릴 회전 → 심볼 비행 → 획득(영웅 착지) 연출이 진행 중이면 레벨업 보류
  reelFxBusy() {
    const R = this.preel;
    return R.busy || R.holdT > 0 || this.time < (this.reelFxEnd || 0)
      || this.ui.flyers.some((f) => f.symbol)
      || this.heroes.some((h) => h.alive && h.dropT > 0);
  }

  // 카메라는 항상 캐릭터 중심 (필드 영역 기준)
  updateCamera() {
    const p = this.player;
    this.cam.x = p.x - this.W / 2;
    this.cam.y = p.y - this.fieldCY;
  }

  // 챕터 진행: 정예 습격 → 5분 중간 보스 → 10분 최종 보스(아레나)
  updateSpawner(dt) {
    const t = this.elapsed, C = BAL.chapter, p = this.player;
    if (this.waveIdx < C.eliteWaves.length && t >= C.eliteWaves[this.waveIdx]) {
      const n = C.eliteCount[this.waveIdx++];
      const a0 = rand(0, TAU);
      for (let i = 0; i < n; i++) {
        const a = a0 + i * TAU / n;
        const type = t < 200 ? 'goblin' : Math.random() < 0.5 ? 'brute' : 'goblin';
        this.spawnEnemy(type, p.x + Math.cos(a) * 560, p.y + Math.sin(a) * 560, true);
      }
      this.ui.banner('정예 습격!', '#ffd24a', 38, 2.0, true);
      SFX.curse();
    }
    if (!this.midBossDone && t >= C.midBoss) {
      this.midBossDone = true;
      const a = rand(0, TAU);
      this.spawnEnemy('boss', p.x + Math.cos(a) * 520, p.y + Math.sin(a) * 520);
      this.ui.banner('BOSS 등장! 오우거 족장', '#ff6a5a', 40, 2.4, true);
      this.shake(10, 0.4);
    }
    if (!this.finalBoss && t >= C.duration) { this.startFinalBoss(); return; }

    this.spawnT -= dt;
    if (this.spawnT > 0) return;
    this.spawnT = Math.max(0.35, 1.5 - t * 0.008);
    if (this.arena) { this.spawnInArena(); return; }
    const maxAlive = Math.min(50, 7 + Math.floor(t / 7));
    if (this.enemies.length >= maxAlive) return;
    const n = 1 + (Math.random() < Math.min(0.6, t / 120) ? randi(1, 3) : 0);
    const a = rand(0, TAU), R = rand(720, 820);
    const bx = this.player.x + Math.cos(a) * R, by = this.player.y + Math.sin(a) * R;
    for (let i = 0; i < n; i++) {
      const type = weightedPick(['slime', 'goblin', 'brute'], (k) =>
        k === 'slime' ? 12 : k === 'goblin' ? (t < 15 ? 2 : 5 + t / 30) : (t < 60 ? 0 : 1 + t / 90));
      const elite = t > 30 && Math.random() < Math.min(0.1, 0.03 + t / 2500);
      this.spawnEnemy(type, bx + rand(-60, 60), by + rand(-60, 60), elite);
    }
  }

  // 10분: 아레나를 닫고 최종 보스 등장. 남아 있던 적은 모두 소멸 (이후 아레나 안에 잡몹이 조금씩)
  startFinalBoss() {
    const p = this.player, C = BAL.chapter, W = this.world.w, H = this.world.h;
    const R = C.arenaR;
    const x = clamp(p.x, R + 40, W - R - 40), y = clamp(p.y, R + 40, H - R - 40);
    this.arena = { x, y, r: R, t: 0 };
    for (const e of this.enemies) {
      if (!e.alive) continue;
      e.alive = false;
      this.fx.burst(e.x, e.y, '#d8b6ff', 8, 220, 0.5, 4, { z: 30, glow: true, g: -100 });
    }
    // 결전 준비: 체력 절반 회복 + 저주 해제
    p.heal(p.maxHp * 0.5); p.curses = {};
    this.fx.text(p.x, p.y - 150, '결전 준비! 체력 회복', '#6dff8a', 26, { life: 1.6, vy: -40 });
    this.fx.burst(p.x, p.y, '#6dff8a', 20, 240, 0.8, 5, { z: 30, glow: true, g: -200 });
    const a = angleTo(x, y, p.x, p.y) + Math.PI;
    this.finalBoss = this.spawnEnemy('warlord', x + Math.cos(a) * R * 0.6, y + Math.sin(a) * R * 0.6);
    this.ui.banner('FINAL BOSS! 오우거 대족장', '#ff4a6a', 42, 3.0, true);
    this.ui.showHint('아레나에 갇혔다! 패링으로 대족장을 쓰러뜨려라', 4);
    this.shake(16, 0.6); this.flash = 0.4; this.flashColor = '255,80,90';
    SFX.curse();
  }

  // 아레나 안 잡몹 (코인·게이지 공급용, 적게)
  spawnInArena() {
    const A = this.arena;
    if (this.enemies.length >= BAL.chapter.arenaMaxAlive + 1) return;
    const a = rand(0, TAU), r = A.r * rand(0.75, 0.92);
    this.spawnEnemy(Math.random() < 0.65 ? 'slime' : 'goblin', A.x + Math.cos(a) * r, A.y + Math.sin(a) * r);
  }

  spawnEnemy(type, x, y, elite = false) {
    const W = this.world.w, H = this.world.h;
    // 적 강화 배율: 5분까지 기존 곡선, 이후 완만하게 (10분 ≈ 3.0배)
    const t = this.elapsed, scale = 1 + Math.min(t, 300) / 240 + Math.max(0, t - 300) / 400;
    const e = new Enemy(type, clamp(x, 60, W - 60), clamp(y, 80, H - 60), scale, elite);
    this.enemies.push(e);
    this.fx.portal(e.x, e.y);
    return e;
  }

  resolveCollisions() {
    const p = this.player;
    const bodies = [];
    if (!p.dead) bodies.push({ o: p, m: 3 });
    for (const e of this.enemies) if (e.alive) bodies.push({ o: e, m: e.mass });
    for (const h of this.heroes) bodies.push({ o: h, m: 1.5 });
    for (let i = 0; i < bodies.length; i++) {
      const A = bodies[i].o, ma = bodies[i].m;
      for (let j = i + 1; j < bodies.length; j++) {
        const B = bodies[j].o, mb = bodies[j].m;
        const dx = B.x - A.x, dy = B.y - A.y, rr = A.r + B.r;
        const d2 = dx * dx + dy * dy;
        if (d2 >= rr * rr || d2 === 0) continue;
        const d = Math.sqrt(d2), ov = (rr - d) * 0.5;
        const nx = dx / d, ny = dy / d;
        const wa = mb / (ma + mb), wb = ma / (ma + mb);
        A.x -= nx * ov * wa * 2; A.y -= ny * ov * wa * 2;
        B.x += nx * ov * wb * 2; B.y += ny * ov * wb * 2;
      }
    }
    const W = this.world.w, H = this.world.h;
    for (const { o } of bodies) {
      for (const pr of this.world.props) {
        if (!pr.solid) continue;
        const dx = o.x - pr.x, dy = o.y - pr.y, rr = o.r + pr.r;
        if (Math.abs(dx) > rr || Math.abs(dy) > rr) continue;
        const d2 = dx * dx + dy * dy;
        if (d2 < rr * rr && d2 > 0) { const d = Math.sqrt(d2); o.x = pr.x + dx / d * rr; o.y = pr.y + dy / d * rr; }
      }
      // 경계 (돌담)
      o.x = clamp(o.x, 24 + o.r, W - 24 - o.r); o.y = clamp(o.y, 14 + o.r, H - 30 - o.r * 0.5);
      // 최종 보스 아레나: 안쪽에 가둠
      const A = this.arena;
      if (A) {
        const d = dist(o.x, o.y, A.x, A.y), lim = A.r - o.r;
        if (d > lim && d > 0) { o.x = A.x + (o.x - A.x) / d * lim; o.y = A.y + (o.y - A.y) / d * lim; }
      }
    }
  }

  // ---------------------------------------------------------------- 전투 처리
  findNearestEnemy(x, y, maxD = Infinity, filter = null) {
    let best = null, bd = maxD * maxD;
    for (const e of this.enemies) {
      if (!e.alive || (filter && !filter(e))) continue;
      const d = dist2(x, y, e.x, e.y);
      if (d < bd) { bd = d; best = e; }
    }
    return best;
  }

  addGauge(n) {
    const before = this.gauge;
    this.gauge = Math.min(BAL.gauge.max, this.gauge + n * (1 + this.player.mods.energy));
    if (before < BAL.gauge.max && this.gauge >= BAL.gauge.max) {
      SFX.charged();
      this.fx.ring(this.player.x, this.player.y, 10, 70, 0.4, '#ffe27a', 6, true);
    }
  }

  damageEnemy(e, dmg, o = {}) {
    if (!e.alive) return;
    if (e.stun > 0) dmg *= 1.5;
    dmg = Math.max(1, Math.round(dmg));
    e.hp -= dmg;
    e.hurtFlash = 0.08;
    if (o.kx !== undefined) { const m = 1 / e.mass; e.kvx += o.kx * m; e.kvy += o.ky * m; }
    const color = o.crit ? '#ffe04a' : (o.color || '#ffffff');
    this.fx.text(e.x, e.y - e.height - 8, dmg, color, o.crit ? 34 : o.small ? 18 : 24);
    if (e.hp <= 0) this.killEnemy(e);
  }

  killEnemy(e) {
    e.alive = false;
    this.kills++;
    this.gainExp(e.def.exp * (e.elite ? BAL.elite.expMul : 1));
    this.fx.burst(e.x, e.y, e.def.color, e.boss ? 40 : 14, e.boss ? 600 : 360, 0.6, 6, { z: 20 });
    this.fx.burst(e.x, e.y, '#d8b6ff', 6, 200, 0.5, 4, { z: 30, glow: true, g: -100 });
    if (e.def.final) {
      // 최종 보스 처치 → 챕터 클리어
      this.ui.banner('CHAPTER CLEAR!', '#ffd24a', 52, 3.0, true);
      this.shake(20, 0.6); this.flash = 0.6; this.flashColor = '255,240,180';
      this.slowmo = 1.5; this.clearDelay = 2.2;
      this.player.invuln = 99;
      for (const o of this.enemies) if (o.alive && o !== e) { o.alive = false; this.fx.burst(o.x, o.y, '#d8b6ff', 8, 220, 0.5, 4, { z: 30, glow: true, g: -100 }); }
    } else if (e.boss) { this.ui.banner('BOSS 처치!', '#ffd24a', 44, 2.2, true); this.shake(14, 0.4); this.flash = 0.3; this.flashColor = '255,230,160'; }
    SFX.kill();
  }

  // ---------------------------------------------------------------- 피버 / 합성 / 흘린 코인
  onFever(surplus) {
    const pct = Math.round(this.preel.fever.bonus * 100);
    this.ui.banner(`FEVER SPIN! 코인 ${surplus}개 · 합체 +${pct}%`, '#ff7ad8', 34, 2.0, true);
    this.slowmo = Math.max(this.slowmo, BAL.fever.slow);
    this.flash = 0.3; this.flashColor = '255,140,230';
    this.shake(8, 0.3);
    SFX.levelup();
  }

  onFusion(id, lvl) {
    const S = SYMBOLS[id], first = !this.fusionsGot[id];
    this.fusionsGot[id] = true;
    this.ui.banner(`${first ? '새 합성! ' : '합성! '}${S.name}${lvl > 1 ? ' Lv' + lvl : ''}`, CAT[S.cat].color, 36, 2.2, true);
    if (first) this.ui.showHint(`${S.name}: ${S.desc} (판 끝까지)`, 3.5);
    this.flash = 0.25; this.flashColor = '255,230,150';
    SFX.merge();
  }

  // 특수기 피격 → 보유 코인 일부를 주변에 흘림
  dropCoins() {
    const R = this.preel, C = BAL.coinDrop, p = this.player;
    if (R.coins <= 0) return;
    const n = Math.min(C.max, R.coins, Math.max(1, Math.floor(R.coins * C.ratio)));
    R.coins -= n;
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), s = rand(C.speed[0], C.speed[1]);
      this.pickups.push({ x: p.x, y: p.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s * 0.75, z: 30, vz: rand(260, 380), t: 0, life: C.life });
    }
    this.fx.text(p.x, p.y - 150, `코인 -${n}`, '#ffb04a', 24, { life: 1.2, vy: -40 });
    if (!this.dropHintShown) { this.dropHintShown = true; this.ui.showHint('특수기에 맞으면 코인을 흘린다! 주워서 회수', 3.5); }
  }

  updatePickups(dt) {
    const p = this.player, C = BAL.coinDrop;
    for (const c of this.pickups) {
      c.t += dt;
      c.x += c.vx * dt; c.y += c.vy * dt;
      const k = Math.max(0, 1 - 4 * dt); c.vx *= k; c.vy *= k;
      if (c.z > 0 || c.vz > 0) { c.vz -= 1200 * dt; c.z = Math.max(0, c.z + c.vz * dt); if (c.z === 0) c.vz = c.vz < -150 ? -c.vz * 0.35 : 0; }
      if (this.arena) {
        const A = this.arena, d = dist(c.x, c.y, A.x, A.y);
        if (d > A.r - 16) { c.x = A.x + (c.x - A.x) / d * (A.r - 16); c.y = A.y + (c.y - A.y) / d * (A.r - 16); }
      }
      if (!p.dead && c.t > 0.45 && dist2(c.x, c.y, p.x, p.y) < (C.pickR + p.r) ** 2) {
        c.done = true;
        this.preel.addCoins(1);
        this.fx.burst(c.x, c.y, '#ffd84a', 6, 160, 0.35, 4, { z: 20, glow: true, g: -120 });
      } else if (c.t >= c.life) c.done = true;
    }
    this.pickups = this.pickups.filter((c) => !c.done);
  }

  // 합성 심볼 지속 효과 (혜성 주기 낙하, 합성 영웅 부활)
  updateFusions(dt) {
    const p = this.player;
    if (p.dead) return;
    const cm = p.fusions.comet;
    if (cm) {
      cm.t -= dt;
      if (cm.t <= 0) {
        cm.t = cm.max = Math.max(4, BAL.fusion.cometCD - cm.lvl);
        let best = null, bestN = -1;
        for (const e of this.enemies) {
          if (!e.alive || e.state === 'spawn' || dist2(e.x, e.y, p.x, p.y) > 600 * 600) continue;
          let n = 0;
          for (const o of this.enemies) if (o.alive && dist2(o.x, o.y, e.x, e.y) < 150 * 150) n++;
          if (e.boss) n += 3;
          if (n > bestN) { bestN = n; best = e; }
        }
        if (best) {
          this.projectiles.push(new Projectile({ kind: 'meteor', x: best.x, y: best.y, tx: best.x, ty: best.y, dur: 0.8, R: 150 + 10 * cm.lvl, dmg: 70 + p.atkPower * (2 + 0.4 * cm.lvl), freeze: 1.6 + 0.3 * cm.lvl }));
          SFX.summon();
        } else cm.t = 1;
      }
    }
    for (const r of this.respawns) {
      r.t -= dt;
      if (r.t <= 0) {
        r.done = true;
        this.landHero(r.id, r.lvl, p.x + (Math.random() < 0.5 ? -86 : 86), p.y + 16);
        this.fx.text(p.x, p.y - 150, HERO_TYPES[r.id].name + ' 부활!', '#ffe08a', 24, { life: 1.4, vy: -40 });
      }
    }
    this.respawns = this.respawns.filter((r) => !r.done);
  }

  enemyHit(e, tgt, dmg) {
    if (tgt === this.player) this.damagePlayer(dmg, e);
    else this.damageHero(tgt, dmg);
  }

  // 영웅 피격 (체력 0 → 쓰러짐)
  damageHero(h, dmg, o = {}) {
    if (!h.alive || !h.landed) return;
    dmg = Math.max(1, Math.round(dmg * (h.base === 'knight' ? 0.75 : 1))); // 기사(성기사 포함)는 피해 25% 감소
    h.hp -= dmg;
    h.hurtFlash = 0.12;
    this.fx.text(h.x, h.y - 104, '-' + dmg, '#ff8a6a', o.heavy ? 26 : 20);
    this.fx.burst(h.x, h.y, '#ffffff', 4, 200, 0.2, 3, { z: 30 });
    if (h.hp <= 0) {
      h.hp = 0; h.alive = false;
      this.fx.text(h.x, h.y - 130, HERO_TYPES[h.type].name + ' 쓰러짐', '#cfd8e6', 22, { life: 1.3, vy: -40 });
      this.fx.burst(h.x, h.y, PAL_HERO[h.type].body, 16, 300, 0.6, 5, { z: 30 });
      this.fx.burst(h.x, h.y, '#ffd24a', 10, 220, 0.6, 4, { z: 40, glow: true, g: -120 });
      this.fx.add({ type: 'decal', x: h.x, y: h.y, r: 26, life: 2, layer: 'ground' });
      SFX.miss();
      if (h.permanent) this.respawns.push({ id: h.type, lvl: h.lvl, t: BAL.fusion.respawn }); // 합성 영웅은 잠시 뒤 부활
    }
  }

  // 힐러 회복 (플레이어 또는 영웅)
  healUnit(u, amt, src) {
    amt = Math.round(amt);
    if (u === this.player) this.player.heal(amt);
    else u.hp = Math.min(u.maxHp, u.hp + amt);
    this.fx.text(u.x, u.y - 116, '+' + amt, '#6dff8a', 22);
    this.fx.ring(u.x, u.y, 8, 50, 0.35, '#8affb0', 5, true);
    const n = 8;
    for (let i = 1; i <= n; i++) {
      const k = i / (n + 1);
      this.fx.particle(lerp(src.x, u.x, k), lerp(src.y, u.y, k), { z: 50, vz: 30, g: 0, life: 0.25 + k * 0.2, size: 6, color: '#9affc0', glow: true });
    }
    this.fx.burst(u.x, u.y, '#b8ffd0', 6, 120, 0.5, 4, { z: 30, glow: true, g: -160 });
  }

  damagePlayer(dmg, src, o = {}) {
    const p = this.player;
    if (p.dead || (p.invuln > 0 && !o.pure) || this.clearDelay > 0) return; // 클리어 연출 중엔 피해 없음
    if (!o.pure) dmg *= 1 - Math.min(0.5, p.mods.guard);
    dmg = Math.max(1, Math.round(dmg));
    if (p.shield > 0 && !o.pure) {
      const ab = Math.min(p.shield, dmg);
      p.shield -= ab; dmg -= ab;
      this.fx.text(p.x, p.y - 104, '흡수', '#8fd4ff', 20);
      if (dmg <= 0) { p.invuln = 0.2; return; }
    }
    p.hp -= dmg;
    if (!o.pure) {
      p.invuln = BAL.player.invuln;
      p.hurtFlash = 0.15;
      this.hurtV = Math.min(1, this.hurtV + (o.heavy ? 0.9 : 0.45));
      this.shake(o.heavy ? 12 : 5, 0.2);
      SFX.hurt();
    }
    this.fx.text(p.x, p.y - 104, '-' + dmg, o.pure ? '#c86aff' : '#ff4a5a', o.heavy ? 34 : o.pure ? 20 : 26);
    if (o.heavy && src) { const a = angleTo(src.x, src.y, p.x, p.y); p.x += Math.cos(a) * 30; p.y += Math.sin(a) * 30; }
    if (p.hp <= 0) {
      p.hp = 0; p.dead = true; p.state = 'idle';
      this.deathT = 1.4;
      this.fx.burst(p.x, p.y, '#5ff0ff', 30, 420, 0.8, 6, { z: 30, glow: true });
      this.slowmo = 0.8;
    }
  }

  onParry(e) {
    const p = this.player;
    p.onParrySuccess();
    e.stunFor(BAL.player.stunTime);
    const a = angleTo(p.x, p.y, e.x, e.y);
    e.kvx = Math.cos(a) * 420 / e.mass; e.kvy = Math.sin(a) * 420 / e.mass;
    const mx = (p.x + e.x) / 2, my = (p.y + e.y) / 2;
    this.fx.ring(mx, my - 30, 10, 130, 0.35, '#fff6c0', 8);
    this.fx.ring(p.x, p.y, 20, 160, 0.5, '#ffd24a', 6, true);
    this.fx.burst(mx, my, '#ffe27a', 24, 560, 0.45, 4, { z: 30, g: 300, glow: true });
    this.fx.text(p.x, p.y - 130, 'PARRY!', '#ffe04a', 46, { life: 1.0, vy: -60 });
    this.fx.text(e.x, e.y - e.height - 20, '경직', '#bfe8ff', 22, { life: 1.0 });
    this.flash = 0.3; this.flashColor = '255,248,220';
    this.slowmo = BAL.player.parrySlowTime;
    this.shake(10, 0.25);
    this.parries++;
    this.ui.parryFlash = 0.4;
    SFX.parry();
    // 패링 성공 → 게이지와 상관없이 몬스터 릴
    this.spawnMonsterReel(e);
  }

  // ---------------------------------------------------------------- 릴
  spawnMonsterReel(e) {
    if (e.reel && e.reel.alive) return false;
    const r = new SlotReel(this, e, e.slots, 'monster');
    e.reel = r;
    this.reels.push(r);
    this.monsterReels++;
    this.fx.ring(e.x, e.y - e.height - 36, 10, 60, 0.35, '#ffe27a', 5);
    SFX.spinStart();
    return true;
  }

  cursePlayer() {
    const p = this.player;
    if (p.reel && p.reel.alive) return;
    const r = new SlotReel(this, p, 1, 'curse');
    p.reel = r;
    this.reels.push(r);
    SFX.curse();
  }

  onSlotReelResult(reel, i, id) {
    const p = this.player;
    if (reel.kind === 'curse') {
      p.curses[id] = { t: BAL.curseDur, max: BAL.curseDur };
      this.ui.banner(`저주: ${CURSES[id].name} (${CURSES[id].desc})`, '#c86aff', 28, 2.2);
      this.fx.burst(p.x, p.y, '#9a4aff', 18, 240, 0.7, 5, { z: 40, glow: true, g: -150 });
      SFX.curse();
      return;
    }
    const sx = reel.x - this.cam.x, sy = reel.y - this.cam.y;
    if (id === 'coin') {
      this.fx.text(reel.x, reel.y - 30, '코인!', '#ffd84a', 24);
      this.ui.flyCoin(sx, sy, () => {
        this.preel.addCoins(1);
        if (!this.coinHintShown) { this.coinHintShown = true; this.ui.showHint('코인 획득! 위의 반짝이는 릴을 터치해 회전', 4); }
      });
    } else if (id === 'miss') {
      this.fx.text(reel.x, reel.y - 30, '꽝', '#b0b0bc', 24);
      this.fx.burst(reel.x, reel.y, '#8a8a96', 8, 120, 0.4, 4, { z: 0, g: 200 });
      SFX.miss();
    } else {
      MSYM[id].apply(this);
      this.fx.text(p.x, p.y - 124 - i * 26, MSYM[id].name, MSYM[id].bg[0], 22, { life: 1.3, vy: -50 });
      this.fx.burst(p.x, p.y, MSYM[id].bg[0], 10, 200, 0.5, 4, { z: 40, glow: true, g: -150 });
      SFX.heal();
    }
  }

  explode(x, y, R, dmg, o = {}) {
    for (const e of this.enemies) {
      if (!e.alive) continue;
      if (dist(x, y, e.x, e.y) <= R + e.r) {
        const a = angleTo(x, y, e.x, e.y);
        this.damageEnemy(e, dmg, { kx: Math.cos(a) * 320, ky: Math.sin(a) * 320, color: '#ffb36b' });
      }
    }
    this.fx.boom(x, y, R);
    this.fx.burst(x, y, '#ff9a3a', 18, R * 3, 0.6, 7, { z: 20, glow: true });
    this.fx.burst(x, y, '#5a4a3a', 10, R * 2.5, 0.7, 6, { z: 10 });
    this.shake(o.shake || 8, 0.25);
    SFX.explode();
  }

  chainLightning(src, jumps, dmg) {
    const pts = [{ x: src.x, y: src.y - 28 }];
    const hit = new Set([src]);
    let cur = src;
    for (let j = 0; j < jumps; j++) {
      const n = this.findNearestEnemy(cur.x, cur.y, 240, (e) => !hit.has(e));
      if (!n) break;
      hit.add(n); pts.push({ x: n.x, y: n.y - 28 });
      this.damageEnemy(n, dmg, { color: '#fff46a' });
      cur = n;
    }
    if (pts.length > 1) { this.fx.bolt(pts, '#7fd8ff', 0.22); SFX.zap(); }
  }

  expNeed() { const l = this.level - 1; return Math.round(5 + l * 4 + Math.pow(l, 1.5)); }

  gainExp(n) {
    this.exp += n;
    while (this.exp >= this.expNeed()) { this.exp -= this.expNeed(); this.level++; this.pendingLv++; }
  }

  // 플레이어 릴 결과 심볼이 슬롯에서 캐릭터(영웅은 캐릭터 옆 착지 지점)로 날아감
  launchSymbol(id, lvl, sx, sy, size, delay) {
    const p = this.player, cat = SYMBOLS[id].cat, isHero = cat === 'hero';
    const land = isHero ? { dx: (Math.random() < 0.5 ? -1 : 1) * 86, dy: 16 } : null;
    const tgt = () => isHero
      ? { x: p.x + land.dx - this.cam.x, y: p.y + land.dy - 34 - this.cam.y }
      : { x: p.x - this.cam.x, y: p.y - 57 - this.cam.y };
    const t0 = tgt();
    const glow = { attack: '255,93,93', hero: '255,201,60', skill: '71,180,255', item: '85,224,122' }[cat];
    this.ui.fly({
      img: ART.symbolIcon(id), sx, sy, cx: lerp(sx, t0.x, 0.5) + rand(-90, 90), cy: lerp(sy, t0.y, 0.25),
      size, endSize: isHero ? 46 : 30, life: 0.55, delay, glow, tgt, symbol: true,
      cb: () => this.acquireSymbol(id, lvl, isHero ? { x: p.x + land.dx, y: p.y + land.dy } : null),
    });
  }

  // 심볼 도착 → 효과 적용 + 캐릭터 머리 위에 이름 표시
  acquireSymbol(id, lvl, land) {
    const p = this.player, S = SYMBOLS[id];
    if (p.dead || this.state === 'over') return;
    if (S.cat === 'hero') this.landHero(id, lvl, land.x, land.y);
    else this.applySymbol(id, lvl);
    this.reelFxEnd = Math.max(this.reelFxEnd || 0, this.time + 0.7); // 이름 표시를 잠깐 보여준 뒤 레벨업
    if (this.time - (this.labelT || -9) > 0.6) this.labelN = 0;
    this.labelT = this.time;
    const n = this.labelN++ % 4;
    this.fx.text(p.x, p.y - 130 - n * 30, S.name + (lvl > 1 ? ' Lv' + lvl : ''), CAT[S.cat].color, 26, { life: 1.4, vy: -40 });
    if (S.cat !== 'hero') {
      this.fx.ring(p.x, p.y, 10, 70, 0.35, CAT[S.cat].color, 5, true);
      this.fx.burst(p.x, p.y - 30, CAT[S.cat].light, 10, 200, 0.5, 4, { z: 30, glow: true, g: -150 });
      SFX.coin();
    }
  }

  // 영웅이 캐릭터 옆으로 떨어져 착지 (착지 지점 주변 대미지 + 넉백)
  landHero(id, lvl, x, y) {
    x = clamp(x, 40, this.world.w - 40); y = clamp(y, 60, this.world.h - 40);
    let h = this.heroes.find((o) => o.alive && o.type === id);
    if (h) { h.lvl = Math.min(5, h.lvl + lvl); h.maxHp = h.hpFor(h.lvl); h.hp = h.maxHp; } // 재소환 시 레벨업 + 체력 회복
    else { h = new Hero(id, x, y, Math.min(5, lvl)); this.heroes.push(h); }
    h.x = x; h.y = y; h.target = null;
    if (SYMBOLS[id].fusion) h.permanent = true; // 합성 영웅: 판 끝까지
    h.life = h.maxLife = h.permanent ? Infinity : BAL.heroDur + (lvl - 1) * 5;
    h.dropT = h.dropMax = 0.28;
    SFX.summon();
  }

  heroLand(h) {
    const L = BAL.heroLand, p = this.player;
    const dmg = (L.dmg + p.atkPower * L.atkMul) * (1 + 0.25 * (h.lvl - 1));
    for (const e of this.enemies) {
      if (!e.alive || dist(h.x, h.y, e.x, e.y) > L.radius + e.r) continue;
      const a = angleTo(h.x, h.y, e.x, e.y);
      this.damageEnemy(e, dmg, { kx: Math.cos(a) * L.knock, ky: Math.sin(a) * L.knock, color: '#ffe08a' });
    }
    this.fx.ring(h.x, h.y, 10, L.radius, 0.4, '#ffe08a', 10, true);
    this.fx.ring(h.x, h.y, 10, L.radius * 0.6, 0.3, '#ffffff', 5, true);
    this.fx.burst(h.x, h.y, '#c8b48a', 18, 380, 0.5, 6, { z: 4 });
    this.fx.burst(h.x, h.y, '#ffe9a0', 14, 260, 0.6, 5, { z: 30, glow: true, g: -100 });
    this.fx.add({ type: 'decal', x: h.x, y: h.y, r: 40, life: 2, layer: 'ground' });
    this.shake(7, 0.2);
    SFX.explode();
    this.slowmo = Math.max(this.slowmo || 0, L.slow); // 패링과 같은 전체 슬로우
    // 착지 완료 → 영웅 머리 위에 이름
    const nm = HERO_TYPES[h.type].name + (h.lvl > 1 ? ' Lv' + h.lvl : '');
    this.fx.text(h.x, h.y - 150, nm, '#ffe08a', 28, { life: 1.6, vy: -30 });
    this.reelFxEnd = Math.max(this.reelFxEnd || 0, this.time + 0.6);
  }

  // 플레이어 릴 심볼 적용 (같은 심볼을 다시 얻으면 강화)
  applySymbol(id, count) {
    const S = SYMBOLS[id], p = this.player;
    if (S.fusion) {
      // 합성 공격·스킬: 판 끝까지 지속, 다시 얻으면 Lv 상승
      const old = p.fusions[id];
      const lvl = Math.min(5, (old ? old.lvl : 0) + count);
      p.fusions[id] = id === 'comet' ? { lvl, t: old ? old.t : 1.2, max: BAL.fusion.cometCD } : { lvl };
      this.fx.ring(p.x, p.y, 10, 110, 0.5, CAT[S.cat].color, 8, true);
      return;
    }
    switch (S.cat) {
      case 'attack': {
        const old = p.abilities[id];
        const lvl = Math.min(5, (old ? old.lvl : 0) + count);
        const dur = BAL.abilityDur + (count - 1) * 4;
        p.abilities[id] = { t: dur, max: dur, lvl };
        this.fx.ring(p.x, p.y, 10, 90, 0.4, CAT.attack.color, 6, true);
        break;
      }
      case 'hero':
        this.landHero(id, count, p.x + 86, p.y + 16);
        break;
      case 'skill': {
        const s = p.skills.find((x) => x && x.id === id);
        if (s) s.charges += count;
        else {
          let i = p.skills.indexOf(null);
          if (i < 0) i = p.skills[0].charges <= p.skills[1].charges ? 0 : 1;
          p.skills[i] = { id, charges: count };
        }
        break;
      }
      case 'item':
        if (id === 'potion') {
          const amt = Math.round(p.maxHp * 0.3 * count);
          p.heal(amt);
          this.fx.text(p.x, p.y - 116, '+' + amt, '#6dff8a', 32);
          this.fx.burst(p.x, p.y, '#6dff8a', 16, 200, 0.7, 5, { z: 30, glow: true, g: -200 });
          SFX.heal();
        } else if (id === 'bomb') {
          const used = new Set();
          for (let i = 0; i < count * 2; i++) {
            const t = this.findNearestEnemy(p.x, p.y, 600, (e) => !used.has(e));
            let tx, ty;
            if (t) { used.add(t); tx = t.x; ty = t.y; }
            else { const a = p.facing + rand(-0.6, 0.6); tx = p.x + Math.cos(a) * 220; ty = p.y + Math.sin(a) * 220; }
            this.projectiles.push(new Projectile({ kind: 'bomb', x: p.x, y: p.y, tx, ty, dur: 0.55 + i * 0.06, R: 110, dmg: 60 + p.atkPower * 2 }));
          }
        } else if (id === 'shield') {
          p.shield += 40 * count; p.shieldT = 12;
          this.fx.ring(p.x, p.y - 30, 10, 60, 0.4, '#8fd4ff', 6);
          SFX.heal();
        }
        break;
    }
  }

  useSkill(i) {
    if (this.state !== 'play') return;
    const p = this.player, s = p.skills[i];
    if (!s || p.dead) return;
    this.ui.skillPress[i] = 0.15;
    if (s.id === 'meteor') {
      let best = null, bestN = -1;
      for (const e of this.enemies) {
        if (!e.alive || dist2(e.x, e.y, p.x, p.y) > 650 * 650) continue;
        let n = 0;
        for (const o of this.enemies) if (o.alive && dist2(o.x, o.y, e.x, e.y) < 150 * 150) n++;
        if (n > bestN) { bestN = n; best = e; }
      }
      const tx = best ? best.x : p.x + Math.cos(p.facing) * 200, ty = best ? best.y : p.y + Math.sin(p.facing) * 200;
      this.projectiles.push(new Projectile({ kind: 'meteor', x: tx, y: ty, tx, ty, dur: 0.8, R: 160, dmg: 90 + p.atkPower * 3 }));
      SFX.summon();
    } else if (s.id === 'storm') {
      p.storm = 3; p.stormTick = 0;
      SFX.dash();
    } else if (s.id === 'frost') {
      for (const e of this.enemies) {
        if (e.alive && dist(e.x, e.y, p.x, p.y) < 380) { e.freeze(3.2); this.damageEnemy(e, 20 + p.atkPower, { color: '#bfe8ff' }); }
      }
      this.fx.ring(p.x, p.y, 20, 380, 0.6, '#bfe8ff', 14, true);
      this.fx.burst(p.x, p.y, '#dff6ff', 40, 700, 0.7, 5, { z: 20, glow: true });
      this.flash = 0.2; this.flashColor = '200,240,255';
      SFX.freeze();
    }
    s.charges--;
    if (s.charges <= 0) p.skills[i] = null;
  }

  // 메인 버튼: 공격 중이거나 특수기 위협이 있으면 패링, 아니면 대시
  actionMode() {
    const p = this.player;
    return p.inCombat || this.threatAny ? 'parry' : 'dash';
  }

  pressAction() {
    if (this.state !== 'play') return;
    const p = this.player;
    if (p.dead) return;
    if (this.actionMode() === 'parry') {
      if (!p.tryParry(this) && p.parryCD > 0 && !p.parryPending) {
        SFX.miss(); // 쿨타임 중에는 누를 수 없음
        this.fx.text(p.x, p.y - 116, `패링 대기 ${p.parryCD.toFixed(1)}초`, '#cfd8e6', 18, { life: 0.6 });
      }
      return;
    }
    if (!p.startDash(this)) {
      SFX.miss();
      if (p.state !== 'dash') this.fx.text(p.x, p.y - 116, '대시 범위에 적 없음', '#cfd8e6', 18, { life: 0.7 });
    }
  }

  // 성장 카드 3장: 첫 장은 항상 릴 편집 카드(추가·제거·강화·황금), 나머지는 전체에서
  openLevelUp() {
    this.state = 'levelup';
    this.input.reset();
    const reel = reelEditCards(this);
    const chosen = [];
    if (reel.length) { const c = weightedPick(reel, (x) => x.weight(this)); chosen.push(c); reel.splice(reel.indexOf(c), 1); }
    const pool = CARDS.concat(reel);
    for (let i = chosen.length; i < 3 && pool.length; i++) {
      const c = weightedPick(pool, (x) => x.weight(this));
      if (c.weight(this) <= 0) break;
      chosen.push(c);
      pool.splice(pool.indexOf(c), 1);
    }
    this.cards = chosen;
    this.ui.cardT = 0;
    SFX.levelup();
  }

  chooseCard(i) {
    if (this.state !== 'levelup' || !this.cards || !this.cards[i] || this.ui.cardT < 0.45) return;
    const c = this.cards[i];
    c.apply(this);
    SFX.click();
    this.ui.banner(c.name, c.rare ? '#5ef0ff' : '#ffd24a', 30, 1.6);
    this.pendingLv--;
    this.player.invuln = Math.max(this.player.invuln, 0.8);
    if (this.pendingLv > 0) this.openLevelUp();
    else { this.state = 'play'; this.cards = null; }
  }

  shake(mag, t) { this.shakeMag = Math.max(this.shakeT > 0 ? this.shakeMag : 0, mag); this.shakeT = Math.max(this.shakeT, t); }

  // ---------------------------------------------------------------- 렌더링
  render() {
    const ctx = this.ctx, W = this.W, H = this.H, FT = this.fieldTop;
    ctx.setTransform(this.pxRatio, 0, 0, this.pxRatio, 0, 0);
    ctx.fillStyle = '#211b14'; ctx.fillRect(0, 0, W, H);
    let sx = 0, sy = 0;
    if (this.shakeT > 0) { sx = rand(-1, 1) * this.shakeMag; sy = rand(-1, 1) * this.shakeMag; }
    const cx = Math.round(this.cam.x + sx), cy = Math.round(this.cam.y + sy);

    // 필드는 HUD 아래 영역에만 그림 (타이틀 화면은 전체)
    const clipTop = this.state === 'title' ? 0 : FT;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, clipTop, W, H - clipTop); ctx.clip();
    ctx.translate(-cx, -cy);
    const vx0 = cx - 140, vx1 = cx + W + 140, vy0 = cy + clipTop - 80, vy1 = cy + H + 80;

    ART.drawOutside(ctx, this.world, vx0, vy0, vx1, vy1);
    if (!this.pattern) this.pattern = ctx.createPattern(ART.tile, 'repeat');
    ctx.fillStyle = this.pattern;
    const gx0 = Math.max(0, vx0), gy0 = Math.max(0, vy0);
    const gx1 = Math.min(this.world.w, vx1), gy1 = Math.min(this.world.h, vy1);
    if (gx1 > gx0 && gy1 > gy0) ctx.fillRect(gx0, gy0, gx1 - gx0, gy1 - gy0);
    ART.drawWalls(ctx, this.world, vx0, vy0, vx1, vy1, 'back');

    for (const d of this.world.decals) if (d.x > vx0 && d.x < vx1 && d.y > vy0 && d.y < vy1) ART.drawDecal(ctx, d);
    if (this.arena) ART.drawArena(ctx, this.arena, this.time);
    this.fx.draw(ctx, 'ground');
    for (const c of this.pickups) ART.drawCoinPickup(ctx, c, this.time);
    for (const e of this.enemies) {
      if (e.elite || e.boss) ART.drawEliteAura(ctx, e, this.time);
      if (e.state === 'special') ART.dangerZone(ctx, e);
    }
    for (const pr of this.projectiles) ART.drawProjectileGround(ctx, pr);
    const p = this.player;
    if (this.gauge >= BAL.gauge.max && !p.dead) ART.drawChargedRing(ctx, p, this.time);

    // y 정렬 그리기
    const list = [];
    for (const pr of this.world.props) if (pr.x > vx0 && pr.x < vx1 && pr.y > vy0 && pr.y < vy1) list.push({ y: pr.y, k: 0, o: pr });
    for (const e of this.enemies) list.push({ y: e.y, k: 1, o: e });
    for (const h of this.heroes) list.push({ y: h.y, k: 2, o: h });
    if (!p.dead || this.deathT > 0) list.push({ y: p.y, k: 3, o: p });
    list.sort((a, b) => a.y - b.y);
    for (const it of list) {
      if (it.k === 0) ART.drawProp(ctx, it.o);
      else if (it.k === 1) ART.drawEnemy(ctx, it.o, this);
      else if (it.k === 2) ART.drawHero(ctx, it.o, this);
      else ART.drawPlayer(ctx, it.o, this);
    }
    ART.drawWalls(ctx, this.world, vx0, vy0, vx1, vy1, 'front');
    for (const pr of this.projectiles) ART.drawProjectile(ctx, pr, this);
    this.fx.draw(ctx, 'top');

    // 적 체력바
    for (const e of this.enemies) {
      if (e.state === 'spawn' || e.boss) continue;
      if (e.hp >= e.maxHp && !e.elite) continue;
      const w = e.r * 2 + 12, x = e.x - w / 2, y = e.y - e.height - 6;
      ctx.fillStyle = 'rgba(10,5,15,0.75)'; ctx.fillRect(x - 1, y - 1, w + 2, 7);
      ctx.fillStyle = e.stun > 0 ? '#ffd24a' : e.elite ? '#ffb02a' : '#ff4a5a'; ctx.fillRect(x, y, w * clamp(e.hp / e.maxHp, 0, 1), 5);
      if (e.elite) { ctx.font = font(13); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; textOutlined(ctx, '정예', e.x, y - 10, '#ffd24a', OL, 3); }
    }
    for (const r of this.reels) ART.drawSlotReel(ctx, r, this);
    this.fx.draw(ctx, 'text');
    ctx.restore();

    // 화면 효과 (필드 영역)
    const fcy = (FT + H) / 2;
    const vg = ctx.createRadialGradient(W / 2, fcy, H * 0.28, W / 2, fcy, H * 0.7);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.4)');
    ctx.fillStyle = vg; ctx.fillRect(0, FT, W, H - FT);
    if (this.hurtV > 0) {
      const hg = ctx.createRadialGradient(W / 2, fcy, H * 0.22, W / 2, fcy, H * 0.65);
      hg.addColorStop(0, 'rgba(255,0,30,0)'); hg.addColorStop(1, `rgba(255,0,30,${0.5 * this.hurtV})`);
      ctx.fillStyle = hg; ctx.fillRect(0, FT, W, H - FT);
    }
    if (p.rage > 0 && this.state === 'play') {
      const rg = ctx.createRadialGradient(W / 2, fcy, H * 0.3, W / 2, fcy, H * 0.7);
      rg.addColorStop(0, 'rgba(255,120,0,0)'); rg.addColorStop(1, `rgba(255,120,0,${0.18 + 0.06 * Math.sin(this.time * 10)})`);
      ctx.fillStyle = rg; ctx.fillRect(0, FT, W, H - FT);
    }
    if (this.slowmo > 0 && this.state === 'play') {
      ctx.fillStyle = `rgba(160,200,255,${0.12 * Math.min(1, this.slowmo * 3)})`; ctx.fillRect(0, FT, W, H - FT);
    }
    if (this.flash > 0) { ctx.fillStyle = `rgba(${this.flashColor},${Math.min(0.6, this.flash * 1.8)})`; ctx.fillRect(0, 0, W, H); }

    this.ui.draw(ctx);
  }
}

</script>
<script>/* main.js */
'use strict';

window.game = new Game(document.getElementById('game'));
// 앱 전환·화면 꺼짐 시 자동으로 잠시 멈춤
document.addEventListener('visibilitychange', () => { if (document.hidden) window.game.pause(); });

</script>
